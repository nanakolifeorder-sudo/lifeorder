name: Daily Supabase Backup

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create backup
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "Missing GitHub secret SUPABASE_DATABASE_URL" >&2
            exit 1
          fi
          mkdir -p backups
          pg_dump "$SUPABASE_DATABASE_URL" --format=custom --no-owner --no-privileges --file "backups/dm-booking-$(date -u +%Y%m%d-%H%M%S).dump"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 14