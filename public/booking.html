<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>預約諮詢</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1a73e8;
      --green: #188038;
      --red: #d93025;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --soft: #f8fafc;
      --notice: #fff8e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #f5f7fb;
      color: var(--ink);
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    .wrap {
      display: grid;
      grid-template-columns: minmax(320px, 520px);
      gap: 20px;
      max-width: 560px;
      margin: 0 auto;
      align-items: start;
      justify-content: center;
    }
    .wrap.booking-calendar {
      grid-template-columns: minmax(680px, 880px);
      max-width: 920px;
    }
    .wrap.has-notice {
      grid-template-columns: minmax(220px, 0.8fr) minmax(320px, 1.2fr);
      max-width: 1060px;
    }
    .wrap.has-notice.booking-calendar {
      grid-template-columns: minmax(220px, 280px) minmax(680px, 1fr);
      max-width: 1180px;
    }
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(60, 64, 67, 0.08);
    }
    .notice { background: var(--notice); border-color: #f9d56e; display: none; }
    h1, h2, h3 { margin: 0 0 16px; line-height: 1.25; }
    h1 { font-size: 26px; color: var(--blue); }
    h2 { font-size: 22px; }
    p { color: var(--muted); line-height: 1.6; }
    label { display: block; font-weight: 700; margin: 0 0 8px; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 96px; resize: vertical; }
    .field { margin-bottom: 18px; }
    .choice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 0;
      font-weight: 400;
      color: var(--ink);
    }
    .choice input { width: 18px; margin-top: 2px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 13px 16px;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
    button:disabled { opacity: 0.58; cursor: wait; }
    .calendar-layout {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(220px, 280px);
      gap: 22px;
      margin-top: 16px;
    }
    .calendar-toolbar {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .calendar-toolbar button {
      width: 42px;
      height: 42px;
      padding: 0;
      background: #fff;
      color: var(--blue);
      border: 1px solid var(--line);
    }
    .calendar-toolbar strong { text-align: center; font-size: 18px; }
    .weekdays, .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .weekdays span {
      padding: 7px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .calendar-day {
      width: 100%;
      aspect-ratio: 1;
      min-height: 46px;
      padding: 0;
      border: 1px solid var(--line);
      background: #f1f3f4;
      color: #9aa0a6;
      font-size: 15px;
    }
    .calendar-day.available {
      background: #fff;
      color: var(--blue);
      border-color: var(--blue);
    }
    .calendar-day:disabled { cursor: not-allowed; }
    .calendar-day.available:hover, .calendar-day.selected {
      background: var(--blue);
      color: #fff;
    }
    .calendar-day.blank { visibility: hidden; }
    .time-panel {
      min-height: 360px;
      padding-left: 20px;
      border-left: 1px solid var(--line);
    }
    .slots {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      max-height: 320px;
      overflow: auto;
      padding-right: 4px;
    }
    .slot {
      border: 1px solid var(--blue);
      color: var(--blue);
      background: #fff;
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      font-weight: 700;
      text-align: center;
    }
    .slot.selected { background: var(--blue); color: #fff; }
    .hidden { display: none !important; }
    .status { margin-top: 14px; color: var(--muted); }
    .error { color: var(--red); }
    .success { color: var(--green); }
    .reschedule-notice {
      border: 1px solid #f6b100;
      background: #fff8e1;
      color: #7a5100;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-weight: 700;
    }
    .complete {
      text-align: center;
      padding: 28px;
    }
    .complete a { color: var(--blue); font-weight: 700; }
    @media (max-width: 760px) {
      body { padding: 12px; }
      .wrap, .wrap.booking-calendar, .wrap.has-notice.booking-calendar { grid-template-columns: 1fr; max-width: 560px; }
      .panel { padding: 18px; }
      .calendar-layout { grid-template-columns: 1fr; }
      .time-panel { min-height: 0; padding: 16px 0 0; border-left: 0; border-top: 1px solid var(--line); }
      .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <aside class="panel notice" id="noticePanel">
      <h3>預約注意事項</h3>
      <div id="noticeText"></div>
    </aside>

    <section class="panel" id="formPanel">
      <h1 id="title">預約諮詢</h1>
      <div class="reschedule-notice hidden" id="rescheduleNotice">這是專屬改期頁面，原始資料已自動帶入，請直接選擇新的時間。</div>
      <p id="loading">正在載入預約設定...</p>
      <form id="bookingForm" class="hidden">
        <div class="field">
          <label for="clientName">姓名 *</label>
          <input id="clientName" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="clientEmail">Email *</label>
          <input id="clientEmail" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="clientPhone">電話 *</label>
          <input id="clientPhone" autocomplete="tel" required>
        </div>
        <div id="questions"></div>
        <button type="submit">下一步：選擇時間</button>
      </form>

      <section id="slotsPanel" class="hidden">
        <h2>選擇可預約時間</h2>
        <p>以下時段會即時避開顧問已連結行事曆裡的忙碌行程。</p>
        <div id="slotStatus" class="status">正在讀取可預約時間...</div>
        <div id="calendarLayout" class="calendar-layout hidden">
          <div>
            <div class="calendar-toolbar">
              <button id="prevMonth" type="button" title="上一個月">‹</button>
              <strong id="calendarMonth"></strong>
              <button id="nextMonth" type="button" title="下一個月">›</button>
            </div>
            <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div id="calendarDays" class="calendar-days"></div>
          </div>
          <div class="time-panel">
            <h3 id="selectedDateTitle">請先選擇日期</h3>
            <div id="slots" class="slots"></div>
          </div>
        </div>
        <button id="confirmBtn" class="hidden" disabled style="margin-top:16px;">確認預約</button>
        <button class="secondary" id="backBtn" type="button" style="margin-top:10px;">返回修改資料</button>
      </section>

      <section id="donePanel" class="complete hidden"></section>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const isLocalPreview = location.protocol === 'file:' ||
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1';
    const tenant = (params.get('tenant') || params.get('t') || (isLocalPreview ? 'dm-test' : '')).toLowerCase();
    const projectCode = (params.get('p') || 'P01').toUpperCase();
    const rescheduleToken = params.get('rid') || '';
    const quizResultId = params.get('qrid') || params.get('quizResultId') || ''; 
    const invitationToken = params.get('invite') || '';
    const skipForm = params.get('skipForm') === 'true';
    const apiBase = isLocalPreview ? 'https://dm-booking-saas.vercel.app/api' : '/api';

    let questions = [];
    let projectName = '';
    let rejectType = 'text';
    let rejectValue = '';
    let consultationUrl = '';
    let pendingBooking = null;
    let selectedSlot = null;
    let availableSlots = [];
    let slotGroups = {};
    let calendarCursor = '';

    function api(action, payload) {
      return fetch(apiBase + '?action=' + encodeURIComponent(action) + '&tenant=' + encodeURIComponent(tenant), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ projectCode }, payload || {}))
      }).then(function (res) { return res.json(); });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderQuestions() {
      const box = document.getElementById('questions');
      if (skipForm) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = questions.map(function (q, index) {
        const required = q.isRequired !== '否';
        let html = '<div class="field" data-q="' + index + '">';
        html += '<label>' + escapeHtml(q.title) + (required ? ' *' : '') + '</label>';
        if (q.type === '單選' || q.type === '多選' || q.type === '複選') {
          const type = q.type === '單選' ? 'radio' : 'checkbox';
          (q.options || []).forEach(function (opt, optIndex) {
            html += '<label class="choice"><input type="' + type + '" name="q_' + index + '" value="' + escapeHtml(opt) + '"><span>' + escapeHtml(opt) + '</span></label>';
          });
        } else {
          html += '<textarea name="q_' + index + '" ' + (required ? 'required' : '') + '></textarea>';
        }
        html += '</div>';
        return html;
      }).join('');
    }

    function collectAnswers() {
      if (skipForm) return '';
      const answers = [];
      for (let i = 0; i < questions.length; i += 1) {
        const q = questions[i];
        const required = q.isRequired !== '否';
        let value = '';

        if (q.type === '單選') {
          const selected = document.querySelector('input[name="q_' + i + '"]:checked');
          value = selected ? selected.value : '';
        } else if (q.type === '多選' || q.type === '複選') {
          value = Array.from(document.querySelectorAll('input[name="q_' + i + '"]:checked')).map(function (el) { return el.value; }).join(', ');
        } else {
          value = (document.querySelector('[name="q_' + i + '"]') || {}).value || '';
        }

        if (required && !value.trim()) {
          throw new Error('請填寫：「' + q.title + '」。');
        }
        answers.push('Q: ' + q.title + '\nA: ' + (value || '未填寫'));

        if (q.rejectWord && value.indexOf(q.rejectWord) !== -1) answers.rejected = true;
      }
      const answerText = answers.join('\n\n');
      if (answers.rejected) {
        const err = new Error('reject');
        err.reject = true;
        err.answers = answerText;
        throw err;
      }
      return answerText;
    }

    function showReject(payload) {
      api('logRejected', payload).finally(function () {
        if (rejectType === 'url' && rejectValue) {
          location.href = rejectValue;
          return;
        }
        document.getElementById('formPanel').innerHTML = '<div class="complete"><h2>目前不適合預約</h2><p>' + escapeHtml(rejectValue || '謝謝你的填寫，目前暫時無法安排預約。') + '</p></div>';
      });
    }

    function loadSlots() {
      document.getElementById('bookingForm').classList.add('hidden');
      document.getElementById('slotsPanel').classList.remove('hidden');
      document.querySelector('.wrap').classList.add('booking-calendar');
      document.getElementById('slotStatus').textContent = '正在讀取可預約時間...';
      document.getElementById('slots').innerHTML = '';
      document.getElementById('calendarLayout').classList.add('hidden');
      selectedSlot = null;
      document.getElementById('confirmBtn').disabled = true;
      document.getElementById('confirmBtn').classList.add('hidden');

      api('getAvailableTimes', { projectCode }).then(function (slots) {
        if (!Array.isArray(slots) || !slots.length) {
          if (rescheduleToken) {
            document.getElementById('slotStatus').textContent = '目前沒有可供改期的時間，請聯繫顧問協助安排。';
          } else if (invitationToken) {
            document.getElementById('slotStatus').textContent = '目前暫時沒有可選時段，請稍後再開啟這封邀請信。';
          } else {
            document.getElementById('slotStatus').textContent = '目前沒有可預約時間，已幫你加入等候名單。';
            api('logMissed', pendingBooking);
          }
          return;
        }
        availableSlots = slots;
        slotGroups = {};
        slots.forEach(function (slot) {
          const fallbackDate = new Date(Number(slot.timestamp)).toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
          const dateKey = slot.dateKey || fallbackDate;
          if (!slotGroups[dateKey]) slotGroups[dateKey] = [];
          slotGroups[dateKey].push(slot);
        });
        calendarCursor = Object.keys(slotGroups).sort()[0].slice(0, 7);
        document.getElementById('slotStatus').textContent = '請先選擇日期，再選擇時間。';
        document.getElementById('calendarLayout').classList.remove('hidden');
        renderCalendar();
      });
    }

    function calendarMonths() {
      return Array.from(new Set(Object.keys(slotGroups).map(function (date) { return date.slice(0, 7); }))).sort();
    }

    function moveCalendarMonth(offset) {
      const months = calendarMonths();
      const index = months.indexOf(calendarCursor);
      const next = months[index + offset];
      if (!next) return;
      calendarCursor = next;
      renderCalendar();
    }

    function renderCalendar() {
      const parts = calendarCursor.split('-').map(Number);
      const year = parts[0];
      const month = parts[1];
      const firstDay = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
      const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
      document.getElementById('calendarMonth').textContent = year + ' 年 ' + month + ' 月';
      const cells = [];
      for (let blank = 0; blank < firstDay; blank += 1) {
        cells.push('<button type="button" class="calendar-day blank" disabled></button>');
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const dateKey = calendarCursor + '-' + String(day).padStart(2, '0');
        const enabled = Boolean(slotGroups[dateKey]?.length);
        cells.push('<button type="button" class="calendar-day' + (enabled ? ' available' : '') + '" ' +
          (enabled ? 'onclick="selectCalendarDate(&quot;' + dateKey + '&quot;)"' : 'disabled') + '>' + day + '</button>');
      }
      document.getElementById('calendarDays').innerHTML = cells.join('');
      const months = calendarMonths();
      const index = months.indexOf(calendarCursor);
      document.getElementById('prevMonth').disabled = index <= 0;
      document.getElementById('nextMonth').disabled = index >= months.length - 1;
    }

    function selectCalendarDate(dateKey) {
      document.querySelectorAll('.calendar-day').forEach(function (button) {
        button.classList.toggle('selected', button.textContent === String(Number(dateKey.slice(-2))) && dateKey.startsWith(calendarCursor));
      });
      selectedSlot = null;
      const slots = slotGroups[dateKey] || [];
      const first = slots[0] || {};
      document.getElementById('selectedDateTitle').textContent = first.dateLabel || dateKey;
      document.getElementById('slots').innerHTML = slots.map(function (slot) {
        const timeLabel = slot.timeLabel || String(slot.displayText || '').split(' ').pop();
        return '<button class="slot" type="button" data-ts="' + slot.timestamp + '">' + escapeHtml(timeLabel) + '</button>';
      }).join('');
      document.querySelectorAll('.slot').forEach(function (button) {
        button.addEventListener('click', function () {
          document.querySelectorAll('.slot').forEach(function (item) { item.classList.remove('selected'); });
          button.classList.add('selected');
          selectedSlot = Number(button.dataset.ts);
          document.getElementById('confirmBtn').disabled = false;
        });
      });
      document.getElementById('confirmBtn').classList.remove('hidden');
      document.getElementById('confirmBtn').disabled = true;
    }

    document.getElementById('prevMonth').addEventListener('click', function () { moveCalendarMonth(-1); });
    document.getElementById('nextMonth').addEventListener('click', function () { moveCalendarMonth(1); });

    document.getElementById('bookingForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const payload = {
        projectCode,
        name: document.getElementById('clientName').value.trim(),
        email: document.getElementById('clientEmail').value.trim(),
        phone: document.getElementById('clientPhone').value.trim(),
        invitationToken: invitationToken || '',
        quizResultId: quizResultId || ''
      };

      try {
        payload.answers = collectAnswers();
      } catch (error) {
        if (error.reject) {
          payload.answers = error.answers || '';
          showReject(payload);
          return;
        }
        alert(error.message);
        return;
      }

      pendingBooking = payload;
      if (!rescheduleToken) api('trackLead', pendingBooking).catch(function () {});
      loadSlots();
    });

    document.getElementById('backBtn').addEventListener('click', function () {
      document.getElementById('slotsPanel').classList.add('hidden');
      document.getElementById('bookingForm').classList.remove('hidden');
      document.querySelector('.wrap').classList.remove('booking-calendar');
    });

    document.getElementById('confirmBtn').addEventListener('click', function () {
      if (!selectedSlot || !pendingBooking) return;
      const btn = this;
      btn.disabled = true;
      btn.textContent = '正在建立視訊會議...';
      api('submitBooking', Object.assign({}, pendingBooking, { timestamp: selectedSlot })).then(function (res) {
        if (!res.success) {
          alert(res.message || '預約失敗，請重新選擇時段。');
          btn.disabled = false;
          btn.textContent = '確認預約';
          loadSlots();
          return;
        }
        document.getElementById('slotsPanel').classList.add('hidden');
        document.getElementById('donePanel').classList.remove('hidden');
        if (rescheduleToken) {
          document.getElementById('donePanel').innerHTML =
            '<h2 class="success">改期成功</h2><p>新的會議資訊已寄到你的 Email。</p>';
          return;
        }
        document.getElementById('donePanel').innerHTML =
          '<h2 class="success">預約成功</h2>' +
          '<p><strong>請先不要關閉此畫面！</strong></p>' +
          (consultationUrl
            ? '<p>畫面將在 <strong id="redirectSeconds">5</strong> 秒後前往「諮詢前注意事項」，請務必看完。</p>'
            : '<p>會議資訊已寄到你的 Email，可以關閉此畫面。</p>');
        if (consultationUrl) {
          let seconds = 5;
          const timer = setInterval(function () {
            seconds -= 1;
            const counter = document.getElementById('redirectSeconds');
            if (counter) counter.textContent = String(seconds);
            if (seconds <= 0) {
              clearInterval(timer);
              location.href = consultationUrl;
            }
          }, 1000);
        }
      });
    });

    function boot() {
      if (!tenant) {
        document.getElementById('loading').innerHTML = '<span class="error">安裝碼缺少 tenant。</span>';
        return;
      }
      api('getQuestions', { projectCode }).then(function (res) {
        if (res.error) {
          document.getElementById('loading').innerHTML = '<span class="error">' + escapeHtml(res.error) + '</span>';
          return;
        }
        projectName = res.projectName || '預約諮詢';
        rejectType = res.rejectType || 'text';
        rejectValue = res.rejectValue || '';
        consultationUrl = res.mainUrl || '';
        questions = res.questions || [];
        document.getElementById('title').textContent = projectName + '｜預約諮詢';
        if (res.bookingNotice) {
          document.getElementById('noticeText').innerHTML = escapeHtml(res.bookingNotice).replace(/\n/g, '<br>');
          document.getElementById('noticePanel').style.display = 'block';
          document.querySelector('.wrap').classList.add('has-notice');
        }
        renderQuestions();
        if (rescheduleToken) {
          api('getRescheduleData', { rescheduleToken: rescheduleToken }).then(function (appointment) {
            if (!appointment.success) throw new Error(appointment.message || '改期連結無效');
            pendingBooking = {
              projectCode: appointment.projectCode || projectCode,
              name: appointment.clientName,
              email: appointment.clientEmail,
              phone: appointment.clientPhone || '',
              answers: appointment.answers || '',
              rescheduleToken: rescheduleToken
            };
            document.getElementById('clientName').value = appointment.clientName || '';
            document.getElementById('clientEmail').value = appointment.clientEmail || '';
            document.getElementById('clientPhone').value = appointment.clientPhone || '';
            document.getElementById('rescheduleNotice').classList.remove('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('loading').classList.add('hidden');
            loadSlots();
          }).catch(function (error) {
            document.getElementById('loading').innerHTML = '<span class="error">' + escapeHtml(error.message || '改期連結無效') + '</span>';
          });
        } else if (invitationToken) {
          api('getBookingInviteData', { invitationToken: invitationToken }).then(function (invite) {
            if (!invite.success) throw new Error(invite.message || '邀請連結無效');
            document.getElementById('clientName').value = invite.clientName || '';
            document.getElementById('clientEmail').value = invite.clientEmail || '';
            document.getElementById('clientPhone').value = invite.clientPhone || '';
            document.getElementById('clientEmail').readOnly = true;
            document.getElementById('loading').classList.add('hidden');
            if (invite.requireForm) {
              document.getElementById('bookingForm').classList.remove('hidden');
            } else {
              pendingBooking = {
                projectCode: invite.projectCode || projectCode,
                name: invite.clientName || invite.clientEmail,
                email: invite.clientEmail,
                phone: invite.clientPhone || '',
                answers: invite.answers || '由後台直接發送時段選擇邀請。',
                invitationToken: invitationToken
              };
              document.getElementById('backBtn').classList.add('hidden');
              loadSlots();
            }
          }).catch(function (error) {
            document.getElementById('loading').innerHTML = '<span class="error">' + escapeHtml(error.message || '邀請連結無效') + '</span>';
          });
        } else {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('bookingForm').classList.remove('hidden');
          api('logPageView', { projectCode }).catch(function () {});
        }
      });
    }

    boot();
  </script>
</body>
</html>
