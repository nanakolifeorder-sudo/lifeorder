<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DM 預約系統後台</title>
  <style>
    :root {
      --blue: #1a73e8;
      --green: #1f9d55;
      --red: #e53935;
      --yellow: #f6b100;
      --purple: #7e57c2;
      --cyan: #00acc1;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --shadow: 0 8px 28px rgba(60, 64, 67, .08);
    }
    body[data-theme="dark"] {
      --bg: #111111;
      --panel: #1f1f1f;
      --panel-2: #292929;
      --ink: #f3f4f6;
      --muted: #b8bec8;
      --line: #3b3f46;
      --shadow: 0 10px 26px rgba(0, 0, 0, .25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    header {
      max-width: 1120px;
      margin: 22px auto 14px;
      padding: 18px 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1, h2, h3 { margin: 0; line-height: 1.25; }
    h1 { font-size: 22px; }
    h2 { font-size: 20px; color: var(--blue); margin-bottom: 14px; }
    h3 { font-size: 16px; margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 12px; }
    a { color: var(--blue); font-weight: 700; }
    main { max-width: 1120px; margin: 0 auto 36px; padding: 0 14px; }
    label { display: block; font-weight: 700; margin-bottom: 7px; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      color: var(--ink);
      background: var(--panel);
    }
    textarea { min-height: 94px; resize: vertical; }
    button {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    button.secondary { background: var(--panel); color: var(--blue); border-color: var(--blue); }
    button.danger { background: var(--red); }
    button.green { background: var(--green); }
    button.yellow { background: var(--yellow); color: #202124; }
    button.purple { background: var(--purple); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .ok { color: var(--green); font-weight: 700; }
    .bad { color: var(--red); font-weight: 700; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar select { width: auto; min-width: 132px; }
    .owner-scope {
      max-width: 1120px;
      margin: 0 auto 14px;
      padding: 14px 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }
    .owner-scope .scope-title { min-width: 120px; }
    .owner-scope label { font-size: 13px; margin-bottom: 5px; color: var(--muted); }
    .owner-scope select { min-width: 220px; }
    .login-wrap {
      max-width: 480px;
      margin: 80px auto;
      padding: 0 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .tabs, .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }
    .tab, .chip {
      width: auto;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .tab.active, .chip.active {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }
    .chip.waitlist.active { background: var(--yellow); color: #202124; }
    .chip.cancelled.active { background: var(--red); }
    .chip.past.active { background: var(--purple); }
    .row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      align-items: end;
    }
    .col-2 { grid-column: span 2; }
    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }
    .col-5 { grid-column: span 5; }
    .col-6 { grid-column: span 6; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }
    .list { display: grid; gap: 12px; }
    .item, .client-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .client-card { border-left: 6px solid var(--blue); }
    .client-card.waitlist { border-left-color: var(--yellow); }
    .client-card.rejected, .client-card.cancelled { border-left-color: var(--red); }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(26, 115, 232, .12);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }
    .answer-box {
      max-height: 150px;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      color: var(--muted);
      background: var(--panel);
      margin-top: 10px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    .stat strong { display: block; color: var(--blue); font-size: 28px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: top; }
    th { color: var(--muted); background: var(--panel-2); }
    .permission-grid { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 8px; }
    .checkline {
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      font-weight: 700;
    }
    .checkline input { width: auto; }
    .mini { font-size: 13px; color: var(--muted); }
    @media (max-width: 780px) {
      header { margin: 10px; align-items: flex-start; flex-direction: column; }
      .owner-scope { margin: 0 10px 14px; }
      main { padding: 0 10px; }
      .row { grid-template-columns: 1fr; }
      .row > * { grid-column: auto !important; }
      .stat-grid, .permission-grid { grid-template-columns: 1fr 1fr; }
      .card-top { flex-direction: column; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body data-theme="dark">
  <header id="appHeader" class="hidden">
    <div>
      <h1>歡迎回來，<span id="userName">DMtest</span></h1>
      <div class="muted" id="tenantLabel"></div>
    </div>
    <div class="toolbar">
      <select id="themeSelect" onchange="setTheme(this.value)">
        <option value="dark">深色畫面</option>
        <option value="light">淺色畫面</option>
      </select>
      <button class="secondary" onclick="refreshCurrent()">重新整理</button>
      <button class="danger" onclick="logout()">登出</button>
    </div>
  </header>

  <section class="owner-scope hidden" id="ownerScopeBar"></section>

  <section class="login-wrap" id="loginWrap">
    <div class="panel">
      <h2>登入後台</h2>
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="email" value="ncs1491311@gmail.com">
      <label style="margin-top:12px;">密碼</label>
      <input id="loginPassword" type="password" autocomplete="current-password" value="1111">
      <button style="width:100%; margin-top:16px;" onclick="login()">登入</button>
      <p id="loginMsg" class="bad"></p>
    </div>
  </section>

  <main id="app" class="hidden">
    <div class="tabs" id="tabs"></div>
    <section id="view"></section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    let tenant = (params.get('tenant') || params.get('t') || 'nicolle-demo').toLowerCase();
    let tenantDisplayName = 'DM Chen';
    function tokenKey() { return 'dm_saas_' + tenant + '_token'; }
    let token = localStorage.getItem(tokenKey()) || '';
    let currentUser = null;
    let currentView = 'crm';
    let crmMode = 'upcoming';
    let crmProject = 'ALL';
    let ownerProject = localStorage.getItem('dm_saas_' + tenant + '_project') || 'ALL';
    let ownerScope = { tenants: [], projects: [] };
    let scheduleConsultants = [];
    const cache = {};

    function api(action, payload) {
      return fetch('/api?action=' + encodeURIComponent(action) + '&tenant=' + encodeURIComponent(tenant), {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
          'Authorization': token ? 'Bearer ' + token : ''
        },
        body: JSON.stringify(payload || {})
      }).then(function (res) { return res.json(); }).then(function (data) {
        if (data && data.success === false) throw new Error(data.message || '操作失敗');
        return data;
      });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function field(id) {
      const node = document.getElementById(id);
      return node ? node.value.trim() : '';
    }

    function permissions() {
      return String(currentUser?.permissions || '').toUpperCase().split(/[,\s]+/).filter(Boolean);
    }

    function isSystemOwner() {
      return currentUser && currentUser.role === 'system_owner';
    }

    function isAdmin() {
      return currentUser && (currentUser.isAdmin || currentUser.role === 'system_owner' || currentUser.role === 'tenant_admin');
    }

    function can(feature) {
      return isAdmin() || permissions().includes(feature);
    }

    function roleLabel(role) {
      if (role === 'system_owner') return '最高權限系統管理員';
      if (role === 'tenant_admin') return '使用者管理員';
      return '團隊顧問';
    }

    function teamConsultantName(name) {
      const clean = String(name || '').trim();
      return clean ? tenantDisplayName + '團隊顧問 ' + clean : '';
    }

    function clearViewCache() {
      Object.keys(cache).forEach(function (key) { delete cache[key]; });
    }

    function scopedProjectCode() {
      return isSystemOwner() ? ownerProject : crmProject;
    }

    function projectMatchesScope(row) {
      if (!isSystemOwner() || ownerProject === 'ALL') return true;
      const text = String(row.projects || row.projectCodes || '').toUpperCase();
      return text.split(',').map(function (item) { return item.trim(); }).includes('ALL') || text.split(',').map(function (item) { return item.trim(); }).includes(ownerProject);
    }

    function setTheme(theme) {
      document.body.dataset.theme = theme;
      localStorage.setItem('dm_saas_theme', theme);
    }
    setTheme(localStorage.getItem('dm_saas_theme') || 'dark');
    document.getElementById('themeSelect').value = document.body.dataset.theme;

    function login() {
      api('verifyLogin', {
        email: field('loginEmail'),
        password: field('loginPassword')
      }).then(function (res) {
        token = res.authToken;
        localStorage.setItem(tokenKey(), token);
        currentUser = res;
        tenantDisplayName = res.tenantName || tenantDisplayName;
        bootApp();
      }).catch(function (err) {
        document.getElementById('loginMsg').textContent = err.message;
      });
    }

    function logout() {
      localStorage.removeItem(tokenKey());
      location.reload();
    }

    function bootApp() {
      tenantDisplayName = currentUser.tenantName || tenantDisplayName || 'DM Chen';
      if (isSystemOwner()) crmProject = ownerProject;
      document.getElementById('loginWrap').classList.add('hidden');
      document.getElementById('appHeader').classList.remove('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('userName').textContent = currentUser.name || 'DMtest';
      document.getElementById('tenantLabel').textContent = '使用者：' + tenantDisplayName + '｜權限：' + roleLabel(currentUser.role);
      renderTabs();
      loadOwnerScopeBar();
      showView('crm');
    }

    function loadOwnerScopeBar() {
      const bar = document.getElementById('ownerScopeBar');
      if (!isSystemOwner()) {
        bar.classList.add('hidden');
        return;
      }
      api('getOwnerScopeData', {}).then(function (res) {
        ownerScope = res;
        if (!ownerScope.projects.some(function (p) { return p.code === ownerProject; })) ownerProject = 'ALL';
        const tenantOptions = (res.tenants || []).map(function (item) {
          return '<option value="' + escapeHtml(item.slug) + '"' + (item.slug === tenant ? ' selected' : '') + '>' + escapeHtml(item.name || item.slug) + '</option>';
        }).join('');
        const projectOptions = '<option value="ALL">全部專案</option>' + (res.projects || []).map(function (item) {
          return '<option value="' + escapeHtml(item.code) + '"' + (item.code === ownerProject ? ' selected' : '') + '>' + escapeHtml(item.name || item.code) + '</option>';
        }).join('');
        bar.innerHTML =
          '<div class="scope-title"><strong>組織視角</strong><div class="mini">最高權限</div></div>' +
          '<div><label>使用者 / 團隊</label><select id="ownerTenantSelect" onchange="switchOwnerTenant(this.value)">' + tenantOptions + '</select></div>' +
          '<div><label>專案範圍</label><select id="ownerProjectSelect" onchange="switchOwnerProject(this.value)">' + projectOptions + '</select></div>';
        bar.classList.remove('hidden');
      }).catch(function () {
        bar.classList.add('hidden');
      });
    }

    function switchOwnerTenant(slug) {
      if (!slug || slug === tenant) return;
      localStorage.setItem('dm_saas_' + slug + '_token', token);
      location.href = '/admin?tenant=' + encodeURIComponent(slug);
    }

    function switchOwnerProject(code) {
      ownerProject = code || 'ALL';
      crmProject = ownerProject;
      localStorage.setItem('dm_saas_' + tenant + '_project', ownerProject);
      clearViewCache();
      showView(currentView);
    }

    function availableTabs() {
      return [
        { id: 'crm', label: '客戶總覽 CRM', ok: true },
        { id: 'schedule', label: '我的排班', ok: true },
        { id: 'consultants', label: tenantDisplayName + '團隊顧問', ok: isAdmin() },
        { id: 'projects', label: '專案管理', ok: can('PROJECTS') },
        { id: 'questions', label: '表單管理', ok: can('FORMS') },
        { id: 'emails', label: '信件管理', ok: can('EMAILS') },
        { id: 'analytics', label: '戰情數據', ok: can('ANALYTICS') },
        { id: 'createUser', label: '建立使用者', ok: isSystemOwner() }
      ].filter(function (tab) { return tab.ok; });
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = availableTabs().map(function (tab) {
        return '<button class="tab" data-view="' + tab.id + '" onclick="showView(&quot;' + tab.id + '&quot;)">' + escapeHtml(tab.label) + '</button>';
      }).join('');
    }

    function showView(name) {
      currentView = name;
      document.querySelectorAll('.tab').forEach(function (tab) {
        tab.classList.toggle('active', tab.dataset.view === name);
      });
      const map = {
        crm: loadCrm,
        schedule: loadSchedule,
        consultants: loadConsultants,
        projects: loadProjects,
        questions: loadQuestions,
        emails: loadEmails,
        analytics: loadAnalytics,
        createUser: loadCreateUser
      };
      (map[name] || loadCrm)();
    }

    function refreshCurrent() {
      delete cache[currentView];
      if (currentView === 'crm') delete cache.crm;
      showView(currentView);
    }

    function loading(title) {
      document.getElementById('view').innerHTML = '<div class="panel"><h2>' + escapeHtml(title) + '</h2><p>載入中...</p></div>';
    }

    function showError(err) {
      document.getElementById('view').innerHTML = '<div class="panel"><h2>發生錯誤</h2><p class="bad">' + escapeHtml(err.message || err) + '</p></div>';
    }

    function loadCrm() {
      if (cache.crm) {
        renderCrm(cache.crm);
        api('getConsultantAppointments', { projectCode: crmProject }).then(function (res) {
          cache.crm = res;
          renderCrm(res);
        }).catch(showError);
        return;
      }
      loading('客戶總覽 CRM');
      api('getConsultantAppointments', { projectCode: crmProject }).then(function (res) {
        cache.crm = res;
        renderCrm(res);
      }).catch(showError);
    }

    function appointmentBucket(item) {
      const status = String(item.status || '').toLowerCase();
      if (item.kind === 'waitlist') return 'waitlist';
      if (item.kind === 'rejected' || status.includes('取消') || status.includes('婉拒') || status.includes('cancel')) return 'cancelled';
      if (item.kind === 'appointment' && item.timeObj && item.timeObj < Date.now()) return 'past';
      return 'upcoming';
    }

    function statusChip(mode, label, count) {
      return '<button class="chip ' + mode + (crmMode === mode ? ' active' : '') + '" onclick="crmMode=&quot;' + mode + '&quot;; renderCrm(cache.crm);">' +
        escapeHtml(label) + ' <span class="badge">' + count + '</span></button>';
    }

    function loadCrmByProject(value) {
      crmProject = value || 'ALL';
      if (isSystemOwner()) {
        ownerProject = crmProject;
        localStorage.setItem('dm_saas_' + tenant + '_project', ownerProject);
        const scopeSelect = document.getElementById('ownerProjectSelect');
        if (scopeSelect) scopeSelect.value = ownerProject;
      }
      delete cache.crm;
      loadCrm();
    }

    function renderCrm(res) {
      const all = [].concat(res.data || [], res.rejected || [], res.waitlist || []);
      const counts = all.reduce(function (acc, item) {
        acc[appointmentBucket(item)] += 1;
        return acc;
      }, { upcoming: 0, past: 0, cancelled: 0, waitlist: 0 });
      const rows = all
        .filter(function (item) { return appointmentBucket(item) === crmMode; })
        .sort(function (a, b) { return (a.timeObj || 0) - (b.timeObj || 0); });
      const projectOptions = ['<option value="ALL">所有專案</option>'].concat((res.allProjects || []).map(function (p) {
        return '<option value="' + escapeHtml(p.code) + '"' + (crmProject === p.code ? ' selected' : '') + '>' + escapeHtml(p.name) + '</option>';
      })).join('');
      document.getElementById('view').innerHTML =
        '<div class="panel">' +
          '<div class="row">' +
            '<div class="col-8"><h2>客戶總覽 CRM</h2></div>' +
            '<div class="col-4"><label>專案篩選</label><select id="crmProject" onchange="loadCrmByProject(this.value)">' + projectOptions + '</select></div>' +
          '</div>' +
          '<div class="subtabs">' +
            statusChip('upcoming', '即將到來', counts.upcoming) +
            statusChip('past', '已過期 / 完成', counts.past) +
            statusChip('cancelled', '取消與婉拒', counts.cancelled) +
            statusChip('waitlist', '等候名單', counts.waitlist) +
          '</div>' +
        '</div>' +
        '<div class="list">' + (rows.length ? rows.map(clientCard).join('') : '<div class="panel"><p>目前沒有資料。</p></div>') + '</div>';
    }

    function clientCard(item) {
      const cls = 'client-card ' + appointmentBucket(item) + ' ' + (item.kind || '');
      const consultantBadge = item.consultant ? '<span class="badge">負責：' + escapeHtml(teamConsultantName(item.consultant)) + '</span>' : '';
      const actionButtons = item.kind === 'appointment'
        ? '<button class="danger" onclick="cancelAppointment(' + item.rowId + ')">取消會議</button>' +
          '<button class="yellow" onclick="alert(&quot;改期流程會在下一階段接上 Google Calendar。&quot;)">改期</button>' +
          '<button class="purple" onclick="alert(&quot;轉派流程會在下一階段接上顧問派單。&quot;)">轉派</button>'
        : '';
      return '<div class="' + cls + '">' +
        '<div class="card-top">' +
          '<div><h3>' + escapeHtml(item.meetTime || '未指定時間') + '</h3><div><strong>' + escapeHtml(item.clientName || '未命名客戶') + '</strong> ' + consultantBadge + '</div></div>' +
          '<span class="badge">' + escapeHtml(item.projectName || item.projectCode || '') + '</span>' +
        '</div>' +
        '<p>' + escapeHtml(item.clientPhone || '') + (item.clientEmail ? ' ｜ ' + escapeHtml(item.clientEmail) : '') + '</p>' +
        (item.meetLink ? '<p><a href="' + escapeHtml(item.meetLink) + '" target="_blank">開啟會議連結</a></p>' : '') +
        '<div class="answer-box">' + escapeHtml(item.answers || '沒有問卷內容') + '</div>' +
        (item.kind === 'appointment' ? crmEditor(item) : '') +
        '<div class="actions">' + actionButtons + '</div>' +
      '</div>';
    }

    function crmEditor(item) {
      return '<div class="row" style="margin-top:12px;">' +
        '<div class="col-3"><label>出席狀態</label><input id="att_' + item.rowId + '" value="' + escapeHtml(item.attendance || '') + '"></div>' +
        '<div class="col-3"><label>諮詢狀態</label><input id="deal_' + item.rowId + '" value="' + escapeHtml(item.dealStatus || '') + '"></div>' +
        '<div class="col-3"><label>報名方案</label><input id="plan_' + item.rowId + '" value="' + escapeHtml(item.plan || '') + '"></div>' +
        '<div class="col-3"><button onclick="saveCrm(' + item.rowId + ')">儲存</button></div>' +
        '<div class="col-12"><label>備註紀錄</label><textarea id="notes_' + item.rowId + '">' + escapeHtml(item.notes || '') + '</textarea></div>' +
      '</div>';
    }

    function saveCrm(rowId) {
      api('updateCRMRecord', {
        rowId: rowId,
        attendance: field('att_' + rowId),
        dealStatus: field('deal_' + rowId),
        plan: field('plan_' + rowId),
        notes: field('notes_' + rowId)
      }).then(function () {
        delete cache.crm;
        loadCrm();
      }).catch(function (err) { alert(err.message); });
    }

    function cancelAppointment(rowId) {

    function renderScheduleEditor(res) {
      const weekly = {};
      (res.weekly || []).forEach(function (rule) { weekly[rule.dayOfWeek] = rule; });
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const rows = days.map(function (day, i) {
        const rule = weekly[i] || {};
        return '<div class="row item">' +
          '<div class="col-2"><strong>星期' + day + '</strong></div>' +
          '<div class="col-3"><input type="time" id="w_start_' + i + '" value="' + escapeHtml(rule.start || '') + '"></div>' +
          '<div class="col-3"><input type="time" id="w_end_' + i + '" value="' + escapeHtml(rule.end || '') + '"></div>' +
          '<div class="col-2"><input type="time" id="w_start2_' + i + '" value="' + escapeHtml(rule.start2 || '') + '"></div>' +
          '<div class="col-2"><input type="time" id="w_end2_' + i + '" value="' + escapeHtml(rule.end2 || '') + '"></div>' +
        '</div>';
      }).join('');
      const specific = (res.specific || []).slice(0, 6);
      while (specific.length < 3) specific.push({});
      const specificRows = specific.map(function (rule, index) {
        return '<div class="row item">' +
          '<div class="col-4"><input type="date" id="sp_date_' + index + '" value="' + escapeHtml(String(rule.date || '').slice(0, 10)) + '"></div>' +
          '<div class="col-4"><input type="time" id="sp_start_' + index + '" value="' + escapeHtml(rule.start || '') + '"></div>' +
          '<div class="col-4"><input type="time" id="sp_end_' + index + '" value="' + escapeHtml(rule.end || '') + '"></div>' +
        '</div>';
      }).join('');
      const google = res.googleConnected
        ? '<span class="ok">已連結：' + escapeHtml(res.googleEmail || 'Google') + '</span>'
        : '<button class="secondary" onclick="connectGoogle(' + res.consultantId + ')">連結 Google Calendar / Meet / Gmail</button>';
      document.getElementById('scheduleEditor').innerHTML =
        '<div class="row">' +
          '<div class="col-3"><label>時區</label><input id="shiftTZ" value="' + escapeHtml(res.shiftTZ || 'Asia/Taipei') + '"></div>' +
          '<div class="col-2"><label>間隔分鐘</label><input id="interval" type="number" value="' + (res.settings?.interval || 60) + '"></div>' +
          '<div class="col-2"><label>前緩衝</label><input id="bufferBefore" type="number" value="' + (res.settings?.bufferBefore || 0) + '"></div>' +
          '<div class="col-2"><label>後緩衝</label><input id="bufferAfter" type="number" value="' + (res.settings?.bufferAfter || 0) + '"></div>' +
          '<div class="col-3">' + google + '</div>' +
        '</div>' +
        '<h3 style="margin-top:16px;">每週固定時段</h3>' + rows +
        '<h3 style="margin-top:16px;">指定日期加開</h3>' + specificRows +
        '<div class="actions"><button onclick="saveSchedule(' + res.consultantId + ')">儲存排班</button></div>';
    }

    function collectScheduleRules() {
      const weeklyRules = [];
      for (let i = 0; i < 7; i += 1) {
        const start = field('w_start_' + i);
        const end = field('w_end_' + i);
        if (start && end) weeklyRules.push({
          dayOfWeek: i,
          start: start,
          end: end,
          start2: field('w_start2_' + i),
          end2: field('w_end2_' + i)
        });
      }
      const specificRules = [];
      for (let i = 0; i < 6; i += 1) {
        const date = field('sp_date_' + i);
        const start = field('sp_start_' + i);
        const end = field('sp_end_' + i);
        if (date && start && end) specificRules.push({ date: date, start: start, end: end });
      }
      return { weeklyRules: weeklyRules, specificRules: specificRules };
    }

      loading('戰情數據');
      api('getAnalyticsData', { projectCode: scopedProjectCode() }).then(function (res) {
        const stats = res.stats || {};
        document.getElementById('view').innerHTML =
          '<div class="panel"><h2>戰情數據</h2><div class="stat-grid">' +
          statBox('頁面瀏覽', stats.views || 0) +
          statBox('預約數', stats.bookings || 0) +
          statBox('婉拒數', stats.rejected || 0) +
          statBox('等候名單', stats.waitlist || 0) +
          '</div></div>';
      }).catch(showError);
    }

    function statBox(label, value) {
      return '<div class="stat">' + escapeHtml(label) + '<strong>' + value + '</strong></div>';
    }

    function loadCreateUser() {
      document.getElementById('view').innerHTML =
        '<div class="panel"><h2>建立使用者</h2><div class="row">' +
          '<div class="col-3"><label>使用者代碼</label><input id="newTenant" placeholder="client-name"></div>' +
          '<div class="col-3"><label>使用者名稱 / 預設專案名稱</label><input id="newTenantName" value="DM Chen"></div>' +
          '<div class="col-2"><label>管理員名稱</label><input id="newAdminName" value="DMtest"></div>' +
          '<div class="col-2"><label>管理員 Email</label><input id="newAdminEmail" value="ncs1491311@gmail.com"></div>' +
          '<div class="col-2"><label>管理員密碼</label><input id="newAdminPassword" type="password" value="1111"></div>' +
          '<div class="col-12 actions"><button class="green" onclick="createUserTenant()">建立使用者</button><span id="createUserMsg"></span></div>' +
        '</div></div>' +
        '<div class="panel"><h2>舊系統資料匯入</h2><textarea id="legacyImportJson" style="min-height:220px;" placeholder="貼上由舊 Excel 轉出的匯入資料"></textarea>' +
        '<div class="actions"><button class="purple" onclick="importLegacy()">匯入到目前使用者</button><span id="legacyImportMsg"></span></div></div>';
    }

    function createUserTenant() {
      api('createTenantAsOwner', {
        tenant: field('newTenant').toLowerCase(),
        tenantName: field('newTenantName'),
        projectName: field('newTenantName') || '內部預約系統',
        adminName: field('newAdminName'),
        adminEmail: field('newAdminEmail'),
        adminPwd: field('newAdminPassword')
      }).then(function (res) {
        document.getElementById('createUserMsg').innerHTML = '<span class="ok">已建立</span> <a href="' + escapeHtml(res.adminUrl) + '">' + escapeHtml(res.adminUrl) + '</a>';
      }).catch(function (err) {
        document.getElementById('createUserMsg').innerHTML = '<span class="bad">' + escapeHtml(err.message) + '</span>';
      });
    }

    function chunks(items, size) {
      const result = [];
      for (let i = 0; i < items.length; i += size) result.push(items.slice(i, i + size));
      return result;
    }

    async function importLegacy() {
      let payload;
      try {
        payload = JSON.parse(document.getElementById('legacyImportJson').value);
      } catch (_err) {
        document.getElementById('legacyImportMsg').innerHTML = '<span class="bad">匯入資料不是正確 JSON</span>';
        return;
      }
      const msg = document.getElementById('legacyImportMsg');
      const counts = {
        projects: 0,
        questions: 0,
        consultants: 0,
        availability: 0,
        appointments: 0,
        rejected: 0,
        waitlist: 0,
        emailTemplates: 0,
        leads: 0
      };
      const stages = [
        { label: '清空舊資料', body: { stage: 'reset', tenantName: payload.tenantName, ownerName: payload.ownerName, ownerEmail: payload.ownerEmail } },
        { label: '專案', key: 'projects', body: { stage: 'projects', items: payload.projects || [] } },
        { label: '顧問', key: 'consultants', body: { stage: 'consultants', items: payload.consultants || [] } },
        { label: '婉拒', key: 'rejected', body: { stage: 'rejected', items: payload.rejected || [] } },
        { label: '等候', key: 'waitlist', body: { stage: 'waitlist', items: payload.waitlist || [] } },
        { label: '信件範本', key: 'emailTemplates', body: { stage: 'emailTemplates', tenantName: payload.tenantName, items: payload.emailTemplates || [] } },
        { label: '測驗名單', key: 'leads', body: { stage: 'leads', items: payload.leads || [] } }
      ];
      chunks(payload.questions || [], 20).forEach(function (items, index) {
        stages.splice(3 + index, 0, { label: '題庫 ' + (index + 1), key: 'questions', body: { stage: 'questions', items: items } });
      });
      const afterQuestions = 3 + chunks(payload.questions || [], 20).length;
      chunks(payload.availability || [], 20).forEach(function (items, index) {
        stages.splice(afterQuestions + index, 0, { label: '排班 ' + (index + 1), key: 'availability', body: { stage: 'availability', items: items } });
      });
      const afterAvailability = afterQuestions + chunks(payload.availability || [], 20).length;
      chunks(payload.appointments || [], 20).forEach(function (items, index) {
        stages.splice(afterAvailability + index, 0, { label: '預約 ' + (index + 1), key: 'appointments', body: { stage: 'appointments', items: items } });
      });

      let currentStageLabel = '';
      try {
        for (let i = 0; i < stages.length; i += 1) {
          const stage = stages[i];
          currentStageLabel = stage.label;
          msg.innerHTML = '<span class="ok">匯入中</span> ' + escapeHtml(stage.label) + '（' + (i + 1) + '/' + stages.length + '）';
          const res = await api('importLegacyData', stage.body);
          if (stage.key) counts[stage.key] += Number(res.count || 0);
          if (res.tenantName) tenantDisplayName = res.tenantName;
        }
        msg.innerHTML =
          '<span class="ok">匯入完成</span> 專案 ' + (counts.projects || 0) +
          '、題目 ' + (counts.questions || 0) +
          '、顧問 ' + (counts.consultants || 0) +
          '、預約 ' + (counts.appointments || 0) +
          '、等候 ' + (counts.waitlist || 0) +
          '、信件 ' + (counts.emailTemplates || 0);
        Object.keys(cache).forEach(function (key) { delete cache[key]; });
        bootApp();
      } catch (err) {
        msg.innerHTML = '<span class="bad">' + escapeHtml(currentStageLabel + '：' + err.message) + '</span>';
      }
    }

    if (token) {
      api('me', {}).then(function (res) {
        currentUser = res.user;
        tenantDisplayName = currentUser.tenantName || tenantDisplayName;
        bootApp();
      }).catch(function () {
        localStorage.removeItem(tokenKey());
      });
    }
  </script>
</body>
</html>
