        stages: Array.from(document.querySelectorAll('.qe-stage')).map(function (row, index) { return { stageKey: row.querySelector('.qe-stage-key').value.trim(), title: row.querySelector('.qe-stage-title').value.trim(), description: row.querySelector('.qe-stage-description').value.trim(), sortOrder: Number(row.querySelector('.qe-stage-sort').value || ((index + 1) * 10)) }; }).filter(function (row) { return row.stageKey && row.title; }),
        dimensions: dimensions,
        ranges: Array.from(document.querySelectorAll('.qe-range')).map(function (row, index) { return { dimensionKey: row.querySelector('.qe-range-dim').value, rangeKey: row.querySelector('.qe-range-key').value.trim(), label: row.querySelector('.qe-range-label').value.trim(), minScore: Number(row.querySelector('.qe-range-min').value || 0), maxScore: Number(row.querySelector('.qe-range-max').value || 0), title: row.querySelector('.qe-range-title').value.trim(), subtitle: row.querySelector('.qe-range-subtitle').value.trim(), body: row.querySelector('.qe-range-body').value.trim(), imageUrl: row.querySelector('.qe-range-image').value.trim(), sortOrder: (index + 1) * 10 }; }).filter(function (row) { return row.dimensionKey && row.rangeKey; }),
        questions: Array.from(document.querySelectorAll('.qe-question')).map(function (row, index) { return { questionNo: Number(row.querySelector('.qe-question-no').value || index + 1), stageKey: row.querySelector('.qe-question-stage').value, title: row.querySelector('.qe-question-title').value.trim(), helpText: row.querySelector('.qe-question-help').value.trim(), type: row.querySelector('.qe-question-type').value, isRequired: row.querySelector('.qe-question-required').value === 'true', sortOrder: Number(row.querySelector('.qe-question-sort').value || ((index + 1) * 10)), options: Array.from(row.querySelectorAll('.qe-option')).map(function (optionRow, optionIndex) { const scoreWeights = {}; optionRow.querySelectorAll('.qe-option-score').forEach(function (input) { scoreWeights[input.dataset.dim] = Number(input.value || 0); }); return { optionKey: optionRow.querySelector('.qe-option-key').value.trim(), label: optionRow.querySelector('.qe-option-label').value.trim(), description: optionRow.querySelector('.qe-option-description').value.trim(), scoreWeights: scoreWeights, sortOrder: (optionIndex + 1) * 10 }; }).filter(function (option) { return option.optionKey && option.label; }) }; }).filter(function (row) { return row.title; })

    }

    function addQuizStage() {

      rerenderQuizEditorWith(data);
    }

    function addQuizDimension() {
      const data = collectQuizEditorPayload();
      const next = data.dimensions.length + 1;
      data.dimensions.push({ dimensionKey: 'dimension-' + next, name: '新面向 ' + next, description: '', maxScore: 10, displayMaxScore: 100, displayScoreFormat: 'number', roundingMode: 'round', chartType: 'radar', sortOrder: next * 10 });
      rerenderQuizEditorWith(data);
    }

    function addQuizRange() {
      const data = collectQuizEditorPayload();

      data.ranges.push({ dimensionKey: dim, rangeKey: 'range-' + (data.ranges.length + 1), label: '新區間', minScore: 0, maxScore: 0, title: '', subtitle: '', body: '', imageUrl: '', sortOrder: (data.ranges.length + 1) * 10 });

      data.questions.push({ questionNo: data.questions.length + 1, stageKey: data.stages[0] ? data.stages[0].stageKey : '1', title: '', helpText: '', type: 'single', isRequired: true, sortOrder: (data.questions.length + 1) * 10, options: [] });

    function loadReportEditor() {
      loading('報告編輯器');
      api('getAdminProjectData', {}).then(function (projectRes) {
        const projectRows = isSystemOwner() && ownerProject !== 'ALL'
          ? (projectRes.projects || []).filter(function (p) { return p.code === ownerProject; })

    function reportBlockTypeOptions(current) {
      const types = [
        ['heading', '標題'], ['text', '文字'], ['list', '項目清單'], ['image', '圖片'],
        ['score_chart', '分數圖表'], ['score_table', '分數表'], ['button', '按鈕'], ['link', '連結'],
        ['booking_cta', '預約 CTA'], ['score_range_content', '依分數區間內容']
      ];
      return types.map(function (item) { return '<option value="' + item[0] + '"' + (current === item[0] ? ' selected' : '') + '>' + item[1] + '</option>'; }).join('');
    }

    function reportAppendFields(content) {
      const selected = Array.isArray(content.appendFields) ? content.appendFields : ['tenant', 'p', 'qrid'];
      const options = [['tenant', 'tenant'], ['p', '專案 p'], ['qrid', '測驗 qrid'], ['name', '姓名'], ['email', 'Email']];
      return '<div class="col-12"><label>附加參數</label><div class="project-checks">' + options.map(function (item) {
        return '<label class="checkline"><input class="rb-param" type="checkbox" value="' + item[0] + '"' + (selected.includes(item[0]) ? ' checked' : '') + '> ' + item[1] + '</label>';
      }).join('') + '</div><p class="mini">只有開啟「附加資料參數」時會加到網址後面。name / email 會把客戶資料帶到外部頁，需確認外部頁用途。</p></div>';
    }

    function reportBlockContentFields(block) {
      const content = block.content || {};
      const type = block.blockType || 'text';
      if (type === 'heading') return '<div class="col-12"><label>標題文字</label><input class="rb-text" value="' + escapeHtml(content.text || block.title || '') + '"></div>';
      if (type === 'text') return '<div class="col-12"><label>文字內容</label><textarea class="rb-text">' + escapeHtml(content.text || '') + '</textarea></div>';
      if (type === 'list') return '<div class="col-12"><label>項目清單</label><textarea class="rb-items" placeholder="一行一個項目">' + escapeHtml((content.items || []).join(String.fromCharCode(10))) + '</textarea></div>';
      if (type === 'image') return '<div class="col-8"><label>圖片網址</label><input class="rb-url" value="' + escapeHtml(content.url || '') + '"></div><div class="col-4"><label>替代文字</label><input class="rb-alt" value="' + escapeHtml(content.alt || '') + '"></div>';
      if (type === 'score_chart') return '<div class="col-6"><label>圖表類型</label><select class="rb-chart"><option value="radar"' + (content.chartType !== 'bar' ? ' selected' : '') + '>雷達圖</option><option value="bar"' + (content.chartType === 'bar' ? ' selected' : '') + '>長條圖</option></select></div>';

      if (type === 'booking_cta') return '<div class="col-3"><label>按鈕文字</label><input class="rb-label" value="' + escapeHtml(content.label || '預約一對一諮詢') + '"></div><div class="col-3"><label>連結模式</label><select class="rb-url-mode"><option value="system"' + (content.urlMode === 'custom' ? '' : ' selected') + '>系統預約頁</option><option value="custom"' + (content.urlMode === 'custom' ? ' selected' : '') + '>自訂網址</option></select></div><div class="col-4"><label>自訂 CTA URL</label><input class="rb-url" value="' + escapeHtml(content.url || '') + '" placeholder="https://..."></div><div class="col-2"><label>附加資料參數</label><select class="rb-append"><option value="false"' + (content.appendParams ? '' : ' selected') + '>否</option><option value="true"' + (content.appendParams ? ' selected' : '') + '>是</option></select></div>' + reportAppendFields(content);
      return '<div class="col-12"><p class="mini">此區塊會依分數區間自動顯示後台設定內容。</p></div>';
    }

    function reportBlockForm(block) {
      const key = block.blockKey || ('block-' + Date.now() + '-' + Math.floor(Math.random() * 1000));
      const type = block.blockType || 'text';
      return '<details class="item report-block-row" data-key="' + escapeHtml(key) + '" open>' +
        '<summary><span>' + escapeHtml(block.title || '未命名區塊') + '</span><span>' + escapeHtml(type) + '</span><span>' + (block.isVisible === false ? '隱藏' : '顯示') + '</span></summary>' +
        '<div class="details-body"><div class="row">' +
          '<div class="col-4"><label>區塊標題</label><input class="rb-title" value="' + escapeHtml(block.title || '') + '"></div>' +
          '<div class="col-3"><label>區塊類型</label><select class="rb-type" onchange="changeReportBlockType(this)">' + reportBlockTypeOptions(type) + '</select></div>' +
          '<div class="col-2"><label>顯示</label><select class="rb-visible"><option value="true"' + (block.isVisible !== false ? ' selected' : '') + '>顯示</option><option value="false"' + (block.isVisible === false ? ' selected' : '') + '>隱藏</option></select></div>' +
          '<div class="col-3"><label>排序</label><div class="block-tools"><button class="secondary" type="button" onclick="moveReportBlock(this,-1)">上移</button><button class="secondary" type="button" onclick="moveReportBlock(this,1)">下移</button><button class="danger" type="button" onclick="removeReportBlock(this)">刪除</button></div></div>' +
          '<div class="rb-content col-12"><div class="row">' + reportBlockContentFields(block) + '</div></div>' +
        '</div></div>' +
      '</details>';

        '<div class="report-editor-grid">' +
          '<div>' +
            '<div class="item"><div class="row">' +
              '<div class="col-6"><label>報告標題</label><input id="reportTitle" value="' + escapeHtml(settings.title || '你的檢測報告') + '"></div>' +
              '<div class="col-6"><label>副標題</label><input id="reportSubtitle" value="' + escapeHtml(settings.subtitle || '') + '"></div>' +
              '<div class="col-3"><label>顯示圖表</label><select id="reportShowChart"><option value="true"' + (settings.show_chart !== false ? ' selected' : '') + '>顯示</option><option value="false"' + (settings.show_chart === false ? ' selected' : '') + '>隱藏</option></select></div>' +
              '<div class="col-3"><label>分數卡</label><select id="reportShowCards"><option value="true"' + (settings.show_score_cards !== false ? ' selected' : '') + '>顯示</option><option value="false"' + (settings.show_score_cards === false ? ' selected' : '') + '>隱藏</option></select></div>' +

    function changeReportBlockType(select) {
      const row = select.closest('.report-block-row');
      const block = collectReportBlock(row, 0);
      block.blockType = select.value;
      row.outerHTML = reportBlockForm(block);
      refreshReportPreview();
    }

    function addReportBlock() {
      document.getElementById('reportBlocks').insertAdjacentHTML('beforeend', reportBlockForm({ blockType: 'text', title: '新增文字區塊', content: { text: '' }, isVisible: true }));
      refreshReportPreview();
    }

    function removeReportBlock(button) {
      button.closest('.report-block-row').remove();
      refreshReportPreview();
    }

    function moveReportBlock(button, direction) {
      const row = button.closest('.report-block-row');
      if (direction < 0 && row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
      if (direction > 0 && row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
      refreshReportPreview();
    }

    function collectReportBlock(row, index) {
      const type = row.querySelector('.rb-type').value;
      const content = {};
      if (type === 'heading' || type === 'text') content.text = row.querySelector('.rb-text')?.value || '';
      if (type === 'list') content.items = (row.querySelector('.rb-items')?.value || '').replace(/\r/g, '').split('\n').map(function (item) { return item.trim(); }).filter(Boolean);
      if (type === 'image') { content.url = row.querySelector('.rb-url')?.value || ''; content.alt = row.querySelector('.rb-alt')?.value || ''; }
      if (type === 'score_chart') content.chartType = row.querySelector('.rb-chart')?.value || 'radar';
      if (type === 'button' || type === 'link') {
        content.label = row.querySelector('.rb-label')?.value || '';
        content.url = row.querySelector('.rb-url')?.value || '';
        content.appendParams = row.querySelector('.rb-append')?.value === 'true';
        content.appendFields = Array.from(row.querySelectorAll('.rb-param:checked')).map(function (input) { return input.value; });
      }
      if (type === 'booking_cta') {
        content.label = row.querySelector('.rb-label')?.value || '預約一對一諮詢';
        content.urlMode = row.querySelector('.rb-url-mode')?.value || 'system';
        content.url = row.querySelector('.rb-url')?.value || '';
        content.appendParams = row.querySelector('.rb-append')?.value === 'true';
        content.appendFields = Array.from(row.querySelectorAll('.rb-param:checked')).map(function (input) { return input.value; });
      }
      return {
        blockKey: row.dataset.key,
        blockType: type,
        title: row.querySelector('.rb-title').value.trim(),
        content: content,
        sortOrder: (index + 1) * 10,
        isVisible: row.querySelector('.rb-visible').value !== 'false'
      };
    }

    function collectReportEditorPayload() {
      return {
        projectCode: field('reportProject'),
        versionCode: field('reportVersion') || 'A',
        settings: {
          title: field('reportTitle'),
          subtitle: field('reportSubtitle'),
          showChart: field('reportShowChart') !== 'false',
          showScoreCards: field('reportShowCards') !== 'false',
          showScoreTable: field('reportShowTable') !== 'false',
          bookingCtaLabel: field('reportCtaLabel') || '預約一對一諮詢'

        blocks: Array.from(document.querySelectorAll('.report-block-row')).map(collectReportBlock)

    function refreshReportPreview() {
      const target = document.getElementById('reportPreview');
      if (!target) return;
      const payload = collectReportEditorPayload();
      target.classList.toggle('mobile', field('reportPreviewMode') === 'mobile');
      const blockHtml = payload.blocks.filter(function (block) { return block.isVisible; }).map(function (block) {
        const c = block.content || {};
        if (block.blockType === 'heading') return '<h2>' + escapeHtml(c.text || block.title) + '</h2>';
        if (block.blockType === 'text') return '<p>' + escapeHtml(c.text || '').split('\n').join('<br>') + '</p>';
        if (block.blockType === 'list') return '<ul>' + (c.items || []).map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul>';

    function renderEmails(res) {
      const projectOptions = (res.projects || []).map(function (p) {
        return '<option value="' + escapeHtml(p.code) + '">' + escapeHtml(p.name) + '</option>';
      }).join('');
      if (emailProject !== 'ALL' && !(res.projects || []).some(function (project) { return project.code === emailProject; })) {
        emailProject = 'ALL';
      }
      const filterOptions = '<option value="ALL">所有專案</option>' + (res.projects || []).map(function (p) {
        return '<option value="' + escapeHtml(p.code) + '"' + (emailProject === p.code ? ' selected' : '') + '>' + escapeHtml(p.name) + '</option>';
      }).join('');
      const visibleTemplates = (res.templates || []).filter(function (row) { return templateEmailModule(row) === emailModule; });
      const visibleQueue = (res.queue || []).filter(function (item) { return queueEmailModule(item) === emailModule; });
      const triggerOrder = emailTriggersForModule(emailModule).map(function (item) { return item[0]; });
      const allTriggers = triggerOrder.concat(visibleTemplates.map(function (row) { return row.triggerName; }).filter(function (trigger, index, list) {
        return trigger && !triggerOrder.includes(trigger) && list.indexOf(trigger) === index;

      const sortedTemplates = visibleTemplates.slice().sort(function (a, b) {

        return timeDiff || Number(a.rowId || 0) - Number(b.rowId || 0);

        '<h3>新增信件範本</h3>' + emailTemplateForm({ projectCode: emailProject === 'ALL' ? (res.projects?.[0]?.code || '') : emailProject, module: emailModule, status: 'active', triggerName: defaultEmailTrigger(emailModule), timeParam: emailModule === 'quiz' ? 24 : 0, stopWhenBooked: true }, projectOptions) +
        '<h3 style="margin-top:20px;">已建立的自動信件</h3>' + groupedTemplates + '</div></div>' +
        '<div class="panel"><h2>名單狀態</h2><table><thead><tr><th>姓名</th><th>Email</th><th>專案</th><th>狀態</th></tr></thead><tbody>' + leads + '</tbody></table></div>' +
        '<div class="panel"><h2>寄信佇列</h2><table><thead><tr><th>Email</th><th>觸發</th><th>主旨</th><th>狀態</th><th>錯誤</th></tr></thead><tbody>' + queue + '</tbody></table></div>' +
        '<div class="panel"><h2>寄信告警</h2><table><thead><tr><th>等級</th><th>標題</th><th>內容</th></tr></thead><tbody>' + alerts + '</tbody></table></div>' +

      ];
      const booking = [
        ['預約時間', '{{time}}'],
        ['會議連結', '{{meetLink}}'],
        ['顧問姓名', '{{consultant}}'],
        ['改期專屬連結', '{{rescheduleLink}}']
      ];
      const quiz = [

      ];
      const tail = [['退訂連結', '{{unsubscribeLink}}']];
      return shared.concat(moduleName === 'quiz' ? quiz : booking, tail).map(function (item) {

    function safeEditorHtml(value) {
      const text = String(value || '');
      if (!/<[a-z][\s\S]*>/i.test(text)) {
        return text ? '<p>' + escapeHtml(text).replace(/\n/g, '<br>') + '</p>' : '<p><br></p>';
      }
      const doc = new DOMParser().parseFromString(text, 'text/html');
      doc.querySelectorAll('script,iframe,object,embed,form,input,button,meta,link,style').forEach(function (node) {
        node.remove();
      });
      doc.body.querySelectorAll('*').forEach(function (node) {
        Array.from(node.attributes).forEach(function (attr) {
          if (/^on/i.test(attr.name)) node.removeAttribute(attr.name);
          if ((attr.name === 'href' || attr.name === 'src') && /^\s*javascript:/i.test(attr.value)) node.removeAttribute(attr.name);
        });
      });
      return doc.body.innerHTML || '<p><br></p>';
    }

    function initializeEmailEditors(rows) {
      const bodyById = {};
      rows.forEach(function (row) { bodyById[String(row.rowId)] = row.body || ''; });
      document.querySelectorAll('.email-row').forEach(function (node) {
        const editor = node.querySelector('.e-body');
        editor.innerHTML = safeEditorHtml(bodyById[node.dataset.id] || '');
      });
    }

    function emailEditorFor(control) {
      return control.closest('.email-row').querySelector('.e-body');
    }

    function rememberEmailSelection(editor) {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      if (editor.contains(range.commonAncestorContainer)) editor._savedRange = range.cloneRange();
    }

    function restoreEmailSelection(editor) {
      editor.focus();
      if (!editor._savedRange) return;
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(editor._savedRange);
    }

    function formatEmail(control, command) {
      const editor = emailEditorFor(control);
      restoreEmailSelection(editor);
      document.execCommand(command, false, null);
      rememberEmailSelection(editor);
    }

    function addEmailLink(control) {
      const url = prompt('請輸入完整連結網址：', 'https://');
      if (!url) return;
      const editor = emailEditorFor(control);
      restoreEmailSelection(editor);
      document.execCommand('createLink', false, url);
      editor.querySelectorAll('a').forEach(function (link) {
        link.target = '_blank';
        link.rel = 'noopener';
      });
      rememberEmailSelection(editor);
    }

    function applyEmailColor(control) {
      const editor = emailEditorFor(control);
      restoreEmailSelection(editor);
      document.execCommand('foreColor', false, control.value);
      rememberEmailSelection(editor);
    }

    function chooseEmailImage(control) {
      const row = control.closest('.email-row');
      const editor = row.querySelector('.e-body');
      rememberEmailSelection(editor);
      row.querySelector('.e-image-input').click();
    }

    function compressEmailImage(file) {
      return new Promise(function (resolve, reject) {
        if (!file || file.size > 2.5 * 1024 * 1024) {
          reject(new Error('單張原始圖片不可超過 2.5MB。'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = function () { reject(new Error('無法讀取圖片。')); };
        reader.onload = function () {
          const image = new Image();
          image.onerror = function () { reject(new Error('圖片格式無法使用。')); };
          image.onload = function () {
            const scale = Math.min(1, 1200 / Math.max(image.width, image.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            const bytes = Math.ceil((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75);
            if (bytes > 768 * 1024) {
              reject(new Error('圖片壓縮後仍超過 750KB，請先裁切或縮小。'));
              return;
            }
            resolve(dataUrl);
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function insertEmailImage(input) {
      const row = input.closest('.email-row');
      const editor = row.querySelector('.e-body');
      if (editor.querySelectorAll('img').length >= 4) {
        alert('每封信最多放 4 張圖片。');
        input.value = '';
        return;
      }
      compressEmailImage(input.files?.[0]).then(function (dataUrl) {
        restoreEmailSelection(editor);
        document.execCommand('insertHTML', false, '<img src="' + dataUrl + '" alt="信件圖片" style="max-width:100%;height:auto;">');
        rememberEmailSelection(editor);
      }).catch(function (err) {
        alert(err.message);
      }).finally(function () {
        input.value = '';
      });
    }

    function insertEmailVariable(control, value) {
      const editor = emailEditorFor(control);
      restoreEmailSelection(editor);
      document.execCommand('insertText', false, value);
      rememberEmailSelection(editor);
    }

    function saveEmailTemplate(button) {
      const row = button.closest('.email-row');
      api('saveEmailTemplate', {
        rowId: row.dataset.id === 'new' ? '' : row.dataset.id,

        name: row.querySelector('.e-name').value,
        triggerName: row.querySelector('.e-trigger').value,
        timeParam: Number(row.querySelector('.e-time').value || 0),
        senderName: row.querySelector('.e-sender').value,
        subject: row.querySelector('.e-subject').value,
        body: row.querySelector('.e-body').innerHTML,

        stopWhenBooked: row.querySelector('.e-stop').value !== 'false',
        module: row.dataset.module || emailModule
      }).then(function () {
        alert('已儲存');
        loadEmails();
      }).catch(function (err) { alert(err.message); });

    function loadAnalytics() {

    function statBox(label, value) {
      return '<div class="stat">' + escapeHtml(label) + '<strong>' + value + '</strong></div>';

    function usageCard(label, used, limit, unit, note) {
      const percent = limit ? Math.min(100, Math.round(used / limit * 100)) : 0;
      const cls = percent >= 90 ? 'danger' : (percent >= 70 ? 'warn' : '');
      return '<div class="stat"><h3>' + escapeHtml(label) + '</h3><strong>' + escapeHtml(used + ' / ' + limit + ' ' + unit) + '</strong>' +
        '<div class="usage-meter"><span class="' + cls + '" style="width:' + percent + '%"></span></div><p class="mini" style="margin-top:8px;">' + escapeHtml(note || '') + '</p></div>';
    }

    function loadSystemUsage() {
      loading('系統用量');
      api('getSystemUsage', {}).then(function (res) {
        const dbMb = Number(res.databaseMb || 0);
        const imageMb = Number(res.emailImageMb || 0);
        document.getElementById('view').innerHTML =
          '<div class="panel"><h2>系統用量</h2><p>這裡顯示本系統可直接量到的資料；Vercel 與 Supabase 平台帳單仍以官方 Usage 頁為準。</p>' +
            '<div class="stat-grid">' +
              usageCard('Supabase 資料庫', dbMb, 500, 'MB', '免費方案到 500MB；70% 開始提醒。') +
              usageCard('信件範本與圖片', imageMb, 10, 'MB', '目前使用者的信件範本總上限 10MB。') +
              statBox('本月已寄信', res.emailsSentMonth || 0) +
              statBox('寄送失敗', res.emailsFailedMonth || 0) +
            '</div>' +
          '</div>' +
          '<div class="panel"><h2>全系統規模</h2><div class="stat-grid">' +
            statBox('使用者', res.tenants || 0) +
            statBox('專案', res.projects || 0) +
            statBox('團隊帳號', res.consultants || 0) +
            statBox('預約紀錄', res.appointments || 0) +
          '</div></div>' +
          '<div class="panel"><h2>外部平台檢查</h2><table><thead><tr><th>平台</th><th>免費額度重點</th><th>查看位置</th></tr></thead><tbody>' +
            '<tr><td>Vercel</td><td>Functions、CPU 時間、傳輸量</td><td><a href="https://vercel.com/dashboard/usage" target="_blank" rel="noopener">開啟 Usage</a></td></tr>' +
            '<tr><td>Supabase</td><td>資料庫 500MB、檔案 1GB、傳輸 5GB</td><td><a href="https://supabase.com/dashboard/org/ymrbowkvryacgoewugog/usage" target="_blank" rel="noopener">開啟 Usage</a></td></tr>' +
            '<tr><td>Google Cloud</td><td>Gmail API 配額與錯誤</td><td><a href="https://console.cloud.google.com/apis/dashboard" target="_blank" rel="noopener">開啟 API 儀表板</a></td></tr>' +
          '</tbody></table></div>';
      }).catch(showError);
    }

    function loadUserManagement() {
      loading('使用者管理');
      api('getOwnerScopeData', {}).then(renderUserManagement).catch(showError);
    }

    function renderUserManagement(res) {
      ownerScope = res;
      const users = (res.tenants || []).map(function (item) {
        return '<div class="item user-row" data-tenant="' + escapeHtml(item.slug) + '">' +
          '<div class="row">' +
            '<div class="col-3"><label>使用者名稱</label><input class="u-name" value="' + escapeHtml(item.name || '') + '"></div>' +
            '<div class="col-3"><label>管理員名稱</label><input class="u-owner-name" value="' + escapeHtml(item.owner_name || '') + '"></div>' +
            '<div class="col-4"><label>主要聯絡 Email</label><input class="u-owner-email" value="' + escapeHtml(item.owner_email || '') + '"></div>' +
            '<div class="col-2"><label>使用者代碼</label><input class="u-slug" value="' + escapeHtml(item.slug) + '" pattern="[a-z0-9][a-z0-9-]{1,48}"><div class="mini">小寫英文、數字與連字號</div></div>' +
            '<div class="col-12 user-summary">' +
              '<span class="badge">專案 ' + Number(item.project_count || 0) + '</span>' +
              '<span class="badge">團隊帳號 ' + Number(item.consultant_count || 0) + '</span>' +
              '<span class="badge">預約紀錄 ' + Number(item.appointment_count || 0) + '</span>' +
              (item.slug === tenant ? '<span class="badge">目前檢視中</span>' : '') +
            '</div>' +
            '<div class="col-12 actions"><button onclick="saveManagedUser(this)">儲存使用者資料</button>' +
              (item.slug === tenant ? '' : '<button class="secondary" onclick="switchOwnerTenant(&quot;' + escapeHtml(item.slug) + '&quot;)">進入後台</button>') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      document.getElementById('view').innerHTML =
        '<div class="panel"><h2>使用者管理</h2><p>管理所有已開通團隊；進入後台後可管理該團隊的專案、顧問與客戶。</p><div class="list">' +
          (users || '<p>目前還沒有使用者。</p>') +
        '</div></div>' +
        '<div class="panel"><h2>建立使用者</h2><div class="row">' +
          '<div class="col-3"><label>使用者代碼</label><input id="newTenant" placeholder="client-name"></div>' +
          '<div class="col-3"><label>使用者名稱 / 預設專案名稱</label><input id="newTenantName" value="DM Chen"></div>' +
          '<div class="col-2"><label>管理員名稱</label><input id="newAdminName" value="DMtest"></div>' +
          '<div class="col-2"><label>管理員 Email</label><input id="newAdminEmail" value="ncs1491311@gmail.com"></div>' +
          '<div class="col-2"><label>管理員密碼</label><input id="newAdminPassword" type="password" value="1111"></div>' +
          '<div class="col-12 actions"><button class="green" onclick="createUserTenant()">建立使用者</button><span id="createUserMsg"></span></div>' +
        '</div></div>' +
        '<div class="panel"><h2>舊系統資料匯入</h2><textarea id="legacyImportJson" style="min-height:220px;" placeholder="貼上由舊 Excel 轉出的匯入資料"></textarea>' +
        '<div class="actions"><button class="purple" onclick="importLegacy()">匯入到目前使用者</button><span id="legacyImportMsg"></span></div></div>';
    }

    function saveManagedUser(button) {
      const row = button.closest('.user-row');
      button.disabled = true;
      api('saveTenantAsOwner', {
        targetTenant: row.dataset.tenant,
        newTenant: row.querySelector('.u-slug').value.trim().toLowerCase(),
        tenantName: row.querySelector('.u-name').value.trim(),
        ownerName: row.querySelector('.u-owner-name').value.trim(),
        ownerEmail: row.querySelector('.u-owner-email').value.trim()
      }).then(function (res) {
        const newTenant = res.user?.slug || row.dataset.tenant;
        if (row.dataset.tenant === tenant && newTenant !== tenant) {
          localStorage.setItem('dm_saas_' + newTenant + '_token', token);
          localStorage.removeItem(tokenKey());
          location.href = '/admin?tenant=' + encodeURIComponent(newTenant);
          return;
        }
        if (row.dataset.tenant === tenant) {
          tenantDisplayName = row.querySelector('.u-name').value.trim() || tenantDisplayName;
          currentUser.tenantName = tenantDisplayName;
          document.getElementById('tenantLabel').textContent = '使用者：' + tenantDisplayName + '｜權限：' + roleLabel(currentUser.role);
          renderTabs();
        }
        alert('使用者資料已儲存');
        loadOwnerScopeBar();
        loadUserManagement();
      }).catch(function (err) {
        button.disabled = false;
        alert(err.message);
      });
    }

    function createUserTenant() {
      api('createTenantAsOwner', {
        tenant: field('newTenant').toLowerCase(),
        tenantName: field('newTenantName'),
        projectName: field('newTenantName') || '內部預約系統',
        adminName: field('newAdminName'),
        adminEmail: field('newAdminEmail'),
        adminPwd: field('newAdminPassword')
      }).then(function (res) {
        document.getElementById('createUserMsg').innerHTML = '<span class="ok">已建立</span> <a href="' + escapeHtml(res.adminUrl) + '">' + escapeHtml(res.adminUrl) + '</a>';
      }).catch(function (err) {
        document.getElementById('createUserMsg').innerHTML = '<span class="bad">' + escapeHtml(err.message) + '</span>';
      });
    }

    function chunks(items, size) {
      const result = [];
      for (let i = 0; i < items.length; i += size) result.push(items.slice(i, i + size));
      return result;
    }

    async function importLegacy() {
      let payload;
      try {
        payload = JSON.parse(document.getElementById('legacyImportJson').value);
      } catch (_err) {
        document.getElementById('legacyImportMsg').innerHTML = '<span class="bad">匯入資料不是正確 JSON</span>';
        return;
      }
      const msg = document.getElementById('legacyImportMsg');
      const counts = {
        projects: 0,
        questions: 0,
        consultants: 0,
        availability: 0,
        appointments: 0,
        rejected: 0,
        waitlist: 0,
        emailTemplates: 0,
        leads: 0
      };
      const stages = [
        { label: '清空舊資料', body: { stage: 'reset', tenantName: payload.tenantName, ownerName: payload.ownerName, ownerEmail: payload.ownerEmail } },
        { label: '專案', key: 'projects', body: { stage: 'projects', items: payload.projects || [] } },
        { label: '顧問', key: 'consultants', body: { stage: 'consultants', items: payload.consultants || [] } },
        { label: '婉拒', key: 'rejected', body: { stage: 'rejected', items: payload.rejected || [] } },
        { label: '等候', key: 'waitlist', body: { stage: 'waitlist', items: payload.waitlist || [] } },
        { label: '信件範本', key: 'emailTemplates', body: { stage: 'emailTemplates', tenantName: payload.tenantName, items: payload.emailTemplates || [] } },
        { label: '測驗名單', key: 'leads', body: { stage: 'leads', items: payload.leads || [] } }
      ];
      chunks(payload.questions || [], 20).forEach(function (items, index) {
        stages.splice(3 + index, 0, { label: '題庫 ' + (index + 1), key: 'questions', body: { stage: 'questions', items: items } });
      });
      const afterQuestions = 3 + chunks(payload.questions || [], 20).length;
      chunks(payload.availability || [], 20).forEach(function (items, index) {
        stages.splice(afterQuestions + index, 0, { label: '排班 ' + (index + 1), key: 'availability', body: { stage: 'availability', items: items } });
      });
      const afterAvailability = afterQuestions + chunks(payload.availability || [], 20).length;
      chunks(payload.appointments || [], 20).forEach(function (items, index) {
        stages.splice(afterAvailability + index, 0, { label: '預約 ' + (index + 1), key: 'appointments', body: { stage: 'appointments', items: items } });
      });

      let currentStageLabel = '';
      try {
        for (let i = 0; i < stages.length; i += 1) {
          const stage = stages[i];
          currentStageLabel = stage.label;
          msg.innerHTML = '<span class="ok">匯入中</span> ' + escapeHtml(stage.label) + '（' + (i + 1) + '/' + stages.length + '）';
          const res = await api('importLegacyData', stage.body);
          if (stage.key) counts[stage.key] += Number(res.count || 0);
          if (res.tenantName) tenantDisplayName = res.tenantName;
        }
        msg.innerHTML =
          '<span class="ok">匯入完成</span> 專案 ' + (counts.projects || 0) +
          '、題目 ' + (counts.questions || 0) +
          '、顧問 ' + (counts.consultants || 0) +
          '、預約 ' + (counts.appointments || 0) +
          '、等候 ' + (counts.waitlist || 0) +
          '、信件 ' + (counts.emailTemplates || 0);
        Object.keys(cache).forEach(function (key) { delete cache[key]; });
        bootApp();
      } catch (err) {
        msg.innerHTML = '<span class="bad">' + escapeHtml(currentStageLabel + '：' + err.message) + '</span>';
      }
    }

    if (token) {
      api('me', {}).then(function (res) {
        currentUser = res.user;
        tenantDisplayName = currentUser.tenantName || tenantDisplayName;
        bootApp();
      }).catch(function () {
        localStorage.removeItem(tokenKey());
        document.getElementById('authLoading').classList.add('hidden');
        document.getElementById('loginWrap').classList.remove('hidden');
      });
    } else {
      document.getElementById('authLoading').classList.add('hidden');
      document.getElementById('loginWrap').classList.remove('hidden');
    }
  </script>
</body>
</html>
