<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DM 預約系統後台</title>
  <style>
    :root {
      --blue: #1a73e8;
      --green: #1f9d55;
      --red: #e53935;
      --yellow: #f6b100;
      --purple: #7e57c2;
      --cyan: #00acc1;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --ink: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --shadow: 0 8px 28px rgba(60, 64, 67, .08);
    }
    body[data-theme="dark"] {
      --bg: #111111;
      --panel: #1f1f1f;
      --panel-2: #292929;
      --ink: #f3f4f6;
      --muted: #b8bec8;
      --line: #3b3f46;
      --shadow: 0 10px 26px rgba(0, 0, 0, .25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    header {
      max-width: 1120px;
      margin: 22px auto 14px;
      padding: 18px 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    body.admin-ready header {
      max-width: none;
      margin: 0;
      border-width: 0 0 1px;
      border-radius: 0;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    h1, h2, h3 { margin: 0; line-height: 1.25; }
    h1 { font-size: 22px; }
    h2 { font-size: 20px; color: var(--blue); margin-bottom: 14px; }
    h3 { font-size: 16px; margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 12px; }
    a { color: var(--blue); font-weight: 700; }
    main { max-width: 1120px; margin: 0 auto 36px; padding: 0 14px; }
    main.app-shell {
      max-width: none;
      margin: 0;
      padding: 18px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    main.app-shell.sidebar-collapsed { grid-template-columns: 76px minmax(0, 1fr); }
    .sidebar {
      position: sticky;
      top: 86px;
      min-height: calc(100vh - 104px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .sidebar-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 4px 12px; border-bottom:1px solid var(--line); margin-bottom:10px; }
    .sidebar-title { font-weight:800; color:var(--ink); line-height:1.35; }
    .sidebar-toggle { width:36px; height:36px; padding:0; flex:0 0 36px; }
    .nav-group { margin:12px 0; }
    .nav-group-title { color:var(--muted); font-size:12px; font-weight:800; letter-spacing:0; padding:0 8px 6px; }
    .nav-items { display:grid; gap:6px; }
    .workspace { min-width:0; }
    main.sidebar-collapsed .sidebar { padding:10px; }
    main.sidebar-collapsed .sidebar-title,
    main.sidebar-collapsed .nav-group-title,
    main.sidebar-collapsed .tab-label { display:none; }
    main.sidebar-collapsed .sidebar-head { justify-content:center; padding:4px 0 10px; }
    main.sidebar-collapsed .tab { justify-content:center; padding:10px 0; }
    .tab-mark { width:28px; height:28px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; background:rgba(26,115,232,.12); color:var(--blue); font-weight:800; flex:0 0 28px; }
    label { display: block; font-weight: 700; margin-bottom: 7px; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      color: var(--ink);
      background: var(--panel);
    }
    body[data-theme="dark"] input[type="time"],
    body[data-theme="dark"] input[type="date"] {
      color-scheme: dark;
    }
    textarea { min-height: 94px; resize: vertical; }
    button {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    button.secondary { background: var(--panel); color: var(--blue); border-color: var(--blue); }
    button.danger { background: var(--red); }
    button.green { background: var(--green); }
    button.yellow { background: var(--yellow); color: #202124; }
    button.purple { background: var(--purple); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .ok { color: var(--green); font-weight: 700; }
    .bad { color: var(--red); font-weight: 700; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar select { width: auto; min-width: 132px; }
    .owner-scope {
      max-width: 1120px;
      margin: 0 auto 14px;
      padding: 14px 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }
    .owner-scope .scope-title { min-width: 120px; }
    .owner-scope label { font-size: 13px; margin-bottom: 5px; color: var(--muted); }
    .owner-scope select { min-width: 220px; }
    .login-wrap {
      max-width: 480px;
      margin: 80px auto;
      padding: 0 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .tabs, .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }
    .app-shell .tabs { display:block; margin:0; }
    .tab, .chip {
      width: auto;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .app-shell .tab {
      width:100%;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      padding:10px;
      text-align:left;
      white-space:normal;
    }
    .tab.active, .chip.active {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }
    .chip.waitlist.active { background: var(--yellow); color: #202124; }
    .chip.cancelled.active { background: var(--red); }
    .chip.past.active { background: var(--purple); }
    .row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      align-items: end;
    }
    .col-2 { grid-column: span 2; }
    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }
    .col-5 { grid-column: span 5; }
    .col-6 { grid-column: span 6; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }
    .list { display: grid; gap: 12px; }
    .item, .client-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .client-card { border-left: 6px solid var(--blue); display: grid; gap: 12px; }
    .client-card.lead, .client-card.contact { border-left-color: var(--green); }
    .name-link { border:0; background:transparent; color:var(--blue); padding:0; white-space:normal; text-align:left; font:inherit; font-weight:800; }
    .crm-card-title { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .crm-batch-toolbar { display:grid; grid-template-columns:auto auto minmax(220px,1fr) minmax(220px,1fr) auto; gap:10px; align-items:end; }
    .crm-batch-toolbar button { width:auto; }
    .crm-batch-summary { margin-top:8px; }
    .crm-card-title h3 { margin:0; color:var(--ink); }
    .crm-card-meta { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .crm-meta-item { border:1px solid var(--line); border-radius:8px; padding:10px; background:var(--panel); min-width:0; }
    .crm-meta-item .mini { margin-bottom:4px; }
    .crm-meta-item strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .crm-answer-list { display:grid; gap:6px; }
    .crm-answer-line { color:var(--muted); line-height:1.5; }
    .crm-answer-line strong { color:var(--ink); }
    .detail-section { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
    .detail-hero { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:start; }
    .detail-identity { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .detail-contact-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:12px; }
    .detail-pill-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .section-title-row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .section-title-row h3 { margin:0; }
    .client-card.waitlist { border-left-color: var(--yellow); }
    .client-card.rejected, .client-card.cancelled { border-left-color: var(--red); }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(26, 115, 232, .12);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }
    .answer-box {
      max-height: 150px;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      color: var(--muted);
      background: var(--panel);
      margin-top: 10px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    .stat strong { display: block; color: var(--blue); font-size: 28px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px; text-align: left; vertical-align: top; }
    th { color: var(--muted); background: var(--panel-2); }
    .permission-grid { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 8px; }
    .checkline {
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      font-weight: 700;
    }
    .checkline input { width: auto; }
    .mini { font-size: 13px; color: var(--muted); }
    .user-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .editor-toolbar, .variable-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .editor-toolbar { border-radius: 6px 6px 0 0; }
    .variable-bar {
      border-top: 0;
      border-bottom: 0;
      padding-top: 6px;
      padding-bottom: 6px;
    }
    .editor-toolbar button, .variable-bar button {
      width: auto;
      min-width: 36px;
      padding: 7px 10px;
      background: var(--panel);
      color: var(--ink);
      border-color: var(--line);
    }
    .variable-bar button { color: var(--blue); }
    .editor-toolbar input[type="color"] {
      width: 34px;
      height: 32px;
      padding: 3px;
      cursor: pointer;
    }
    .rich-editor {
      min-height: 210px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 0 0 6px 6px;
      background: #fff;
      color: #202124;
      line-height: 1.6;
      overflow: auto;
    }
    .rich-editor:focus {
      outline: 2px solid rgba(26, 115, 232, .28);
      outline-offset: -2px;
    }
    .rich-editor p { color: inherit; margin: 0 0 10px; }
    .record-heading {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    details.item { padding: 0; overflow: hidden; }
    details.item > summary {
      display: grid;
      grid-template-columns: 130px minmax(180px, 1fr) 100px;
      gap: 14px;
      align-items: center;
      padding: 16px;
      cursor: pointer;
      font-weight: 700;
      list-style-position: inside;
    }
    details.item > summary:hover { background: var(--panel); }
    details.item > .details-body {
      padding: 0 16px 16px;
      border-top: 1px solid var(--line);
    }
    .copy-field { display: flex; gap: 7px; align-items: center; }
    .copy-field input { min-width: 0; }
    .copy-field button { flex: 0 0 auto; }
    .option-editor { display: grid; gap: 7px; }
    .question-row .row { align-items: start; }
    .module-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 0; }
    .module-tabs .chip { margin:0; }
    .module-section { display:none; }
    .module-section.active { display:block; }
    .report-editor-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr); gap:16px; align-items:start; }
    .report-block-row summary { grid-template-columns: 1fr 140px 120px; }
    .preview-frame { border:1px solid var(--line); border-radius:8px; background:var(--panel-2); padding:16px; min-height:420px; }
    .preview-frame.mobile { max-width:390px; margin:0 auto; }
    .preview-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; margin-bottom:12px; }
    .preview-radar { width:100%; max-width:320px; aspect-ratio:1; display:block; margin:0 auto; }
    .preview-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .preview-score { border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--panel-2); }
    .preview-cta { display:inline-flex; min-height:42px; align-items:center; justify-content:center; padding:10px 14px; border-radius:6px; background:var(--blue); color:#fff; font-weight:700; text-decoration:none; }
    .block-tools { display:flex; gap:6px; flex-wrap:wrap; }
    .block-tools button { padding:7px 9px; }
    @media (max-width:860px) { .report-editor-grid { grid-template-columns:1fr; } .preview-grid { grid-template-columns:1fr; } }
    .question-row .q-options-wrap {
      padding-top: 2px;
      border-top: 1px solid var(--line);
      margin-top: 2px;
    }
    .question-row .option-editor {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .option-row { display: flex; gap: 7px; align-items: center; }
    .option-row input { min-width: 0; }
    .option-row button {
      width: 38px;
      height: 38px;
      padding: 0;
      flex: 0 0 38px;
    }
    .warning-box {
      margin: 14px 0;
      padding: 12px;
      border: 1px solid var(--yellow);
      border-radius: 6px;
      background: rgba(246, 177, 0, .1);
      color: var(--ink);
      line-height: 1.5;
    }
    .project-checks {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 8px;
    }
    .booking-base-row input[type="radio"] {
      width: 20px;
      height: 20px;
      margin-top: 10px;
    }
    .email-purpose-group {
      border-top: 1px solid var(--line);
      padding: 0;
    }
    .email-purpose-group > summary {
      cursor: pointer;
      padding: 14px 4px;
      color: var(--blue);
      font-weight: 800;
      list-style-position: inside;
    }
    .email-purpose-group > .email-purpose-body { padding: 0 0 12px; }
    .rich-editor img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 10px 0;
      border-radius: 6px;
    }
    .invite-box {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .usage-meter {
      height: 10px;
      overflow: hidden;
      border-radius: 5px;
      background: var(--line);
      margin-top: 8px;
    }
    .usage-meter span {
      display: block;
      height: 100%;
      background: var(--green);
    }
    .usage-meter span.warn { background: var(--yellow); }
    .usage-meter span.danger { background: var(--red); }
    dialog {
      width: min(920px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    dialog::backdrop { background: rgba(0,0,0,.58); }
    .dialog-body { padding: 20px; }
    @media (max-width: 780px) {
      header { margin: 10px; align-items: flex-start; flex-direction: column; }
      body.admin-ready header { margin:0; }
      .owner-scope { margin: 0 10px 14px; }
      main { padding: 0 10px; }
      main.app-shell, main.app-shell.sidebar-collapsed { grid-template-columns:1fr; padding:10px; }
      .sidebar { position:static; min-height:0; }
      .app-shell .tabs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      main.sidebar-collapsed .sidebar-title, main.sidebar-collapsed .nav-group-title, main.sidebar-collapsed .tab-label { display:inline; }
      main.sidebar-collapsed .sidebar-head { justify-content:space-between; padding:6px 4px 12px; }
      main.sidebar-collapsed .tab { justify-content:flex-start; padding:10px; }
      .row { grid-template-columns: 1fr; }
      .row > * { grid-column: auto !important; }
      .stat-grid, .permission-grid, .crm-card-meta, .detail-contact-grid { grid-template-columns: 1fr 1fr; }
      .crm-batch-toolbar { grid-template-columns:1fr; }
      .project-checks, .question-row .option-editor { grid-template-columns: 1fr; }
      .card-top { flex-direction: column; }
      table { display: block; overflow-x: auto; }
      details.item > summary { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>
<body data-theme="dark">
  <header id="appHeader" class="hidden">
    <div>
      <h1>歡迎回來，<span id="userName">DMtest</span></h1>
      <div class="muted" id="tenantLabel"></div>
    </div>
    <div class="toolbar">
      <select id="themeSelect" onchange="setTheme(this.value)">
        <option value="dark">深色畫面</option>
        <option value="light">淺色畫面</option>
      </select>
      <button class="secondary" onclick="refreshCurrent()">重新整理</button>
      <button class="danger" onclick="logout()">登出</button>
    </div>
  </header>

  <section class="owner-scope hidden" id="ownerScopeBar"></section>

  <section class="login-wrap" id="authLoading">
    <div class="panel" style="text-align:center;">
      <strong>正在載入使用者視角...</strong>
    </div>
  </section>

  <section class="login-wrap hidden" id="loginWrap">
    <div class="panel">
      <h2>登入後台</h2>
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="email" value="ncs1491311@gmail.com">
      <label style="margin-top:12px;">密碼</label>
      <input id="loginPassword" type="password" autocomplete="current-password" value="1111">
      <button style="width:100%; margin-top:16px;" onclick="login()">登入</button>
      <p id="loginMsg" class="bad"></p>
    </div>
  </section>

  <main id="app" class="hidden app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title">後台功能</div>
        <button class="secondary sidebar-toggle" title="收合側欄" onclick="toggleSidebar()">☰</button>
      </div>
      <div class="tabs" id="tabs"></div>
    </aside>
    <section class="workspace" id="view"></section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const isLocalPreview = location.protocol === 'file:' ||
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1';
    const apiBase = isLocalPreview ? 'https://dm-booking-saas.vercel.app/api' : '/api';
    let tenant = (params.get('tenant') || params.get('t') || 'dm-test').toLowerCase();
    let tenantDisplayName = 'DM Chen';
    function tokenKey() { return 'dm_saas_' + tenant + '_token'; }
    let token = localStorage.getItem(tokenKey()) || '';
    let currentUser = null;
    let currentView = 'crm';
    let crmMode = 'upcoming';
    let crmProject = 'ALL';
    let crmTagFilter = 'ALL';
    let crmPipelineFilter = 'ALL';
    let crmSearch = '';
    let crmSelectedContacts = {};
    let emailProject = 'ALL';
    let emailModule = 'booking';
    let quizEditorTab = 'settings';
    let sidebarCollapsed = localStorage.getItem('dm_saas_sidebar_collapsed') === '1';
    let ownerProject = localStorage.getItem('dm_saas_' + tenant + '_project') || 'ALL';
    let ownerScope = { tenants: [], projects: [] };
    let scheduleConsultants = [];
    let adminProjects = [];
    const cache = {};

    function api(action, payload) {
      return fetch(apiBase + '?action=' + encodeURIComponent(action) + '&tenant=' + encodeURIComponent(tenant), {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
          'Authorization': token ? 'Bearer ' + token : ''
        },
        body: JSON.stringify(payload || {})
      }).then(function (res) { return res.json(); }).then(function (data) {
        if (data && data.success === false) throw new Error(data.message || '操作失敗');
        return data;
      });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function field(id) {
      const node = document.getElementById(id);
      return node ? node.value.trim() : '';
    }

    function selectedOption(value, current, label) {
      return '<option value="' + escapeHtml(value) + '"' + (String(value) === String(current) ? ' selected' : '') + '>' + escapeHtml(label || value) + '</option>';
    }

    function timeZoneOptions(current) {
      return [
        ['Asia/Taipei', '台北（UTC+8）'],
        ['Asia/Tokyo', '東京（UTC+9）'],
        ['Asia/Hong_Kong', '香港（UTC+8）'],
        ['Asia/Singapore', '新加坡（UTC+8）'],
        ['America/Los_Angeles', '美西（洛杉磯）'],
        ['America/New_York', '美東（紐約）'],
        ['Europe/London', '英國（倫敦）'],
        ['Australia/Sydney', '澳洲（雪梨）']
      ].map(function (item) { return selectedOption(item[0], current || 'Asia/Taipei', item[1]); }).join('');
    }

    function videoToolOptions(current) {
      return [
        ['Google Meet', 'Google Meet']
      ].map(function (item) { return selectedOption(item[0], current || 'Google Meet', item[1]); }).join('');
    }

    function permissions() {
      return String(currentUser?.permissions || '').toUpperCase().split(/[,\s]+/).filter(Boolean);
    }

    function isSystemOwner() {
      return currentUser && currentUser.role === 'system_owner';
    }

    function isAdmin() {
      return currentUser && (currentUser.isAdmin || currentUser.role === 'system_owner' || currentUser.role === 'tenant_admin');
    }

    function can(feature) {
      return isAdmin() || permissions().includes(feature);
    }

    function roleLabel(role) {
      if (role === 'system_owner') return '最高權限系統管理員';
      if (role === 'tenant_admin') return '使用者管理員';
      return '團隊顧問';
    }

    function teamConsultantName(name) {
      const clean = String(name || '').trim();
      return clean ? tenantDisplayName + '團隊顧問 ' + clean : '';
    }

    function clearViewCache() {
      Object.keys(cache).forEach(function (key) { delete cache[key]; });
    }

    function scopedProjectCode() {
      return isSystemOwner() ? ownerProject : crmProject;
    }

    function projectMatchesScope(row) {
      if (!isSystemOwner() || ownerProject === 'ALL') return true;
      const text = String(row.projects || row.projectCodes || '').toUpperCase();
      return text.split(',').map(function (item) { return item.trim(); }).includes('ALL') || text.split(',').map(function (item) { return item.trim(); }).includes(ownerProject);
    }

    function setTheme(theme) {
      document.body.dataset.theme = theme;
      localStorage.setItem('dm_saas_theme', theme);
    }
    setTheme(localStorage.getItem('dm_saas_theme') || 'dark');
    document.getElementById('themeSelect').value = document.body.dataset.theme;

    function login() {
      api('verifyLogin', {
        email: field('loginEmail'),
        password: field('loginPassword')
      }).then(function (res) {
        token = res.authToken;
        localStorage.setItem(tokenKey(), token);
        currentUser = res;
        tenantDisplayName = res.tenantName || tenantDisplayName;
        bootApp();
      }).catch(function (err) {
        document.getElementById('loginMsg').textContent = err.message;
      });
    }

    function logout() {
      localStorage.removeItem(tokenKey());
      location.reload();
    }

    function bootApp() {
      tenantDisplayName = currentUser.tenantName || tenantDisplayName || 'DM Chen';
      if (isSystemOwner()) crmProject = ownerProject;
      const loginWrap = document.getElementById('loginWrap');
      if (loginWrap) loginWrap.remove();
      const authLoading = document.getElementById('authLoading');
      if (authLoading) authLoading.remove();
      document.body.classList.add('admin-ready');
      document.getElementById('appHeader').classList.remove('hidden');
      document.getElementById('app').classList.remove('hidden');
      applySidebarState();
      document.getElementById('userName').textContent = currentUser.name || 'DMtest';
      document.getElementById('tenantLabel').textContent = '使用者：' + tenantDisplayName + '｜權限：' + roleLabel(currentUser.role);
      renderTabs();
      loadOwnerScopeBar();
      showView('crm');
    }

    function loadOwnerScopeBar() {
      const bar = document.getElementById('ownerScopeBar');
      if (!isSystemOwner()) {
        bar.classList.add('hidden');
        return;
      }
      api('getOwnerScopeData', {}).then(function (res) {
        ownerScope = res;
        if (!ownerScope.projects.some(function (p) { return p.code === ownerProject; })) ownerProject = 'ALL';
        const tenantOptions = (res.tenants || []).map(function (item) {
          return '<option value="' + escapeHtml(item.slug) + '"' + (item.slug === tenant ? ' selected' : '') + '>' + escapeHtml(item.name || item.slug) + '</option>';
        }).join('');
        const projectOptions = '<option value="ALL">全部專案</option>' + (res.projects || []).map(function (item) {
          return '<option value="' + escapeHtml(item.code) + '"' + (item.code === ownerProject ? ' selected' : '') + '>' + escapeHtml(item.name || item.code) + '</option>';
        }).join('');
        bar.innerHTML =
          '<div class="scope-title"><strong>組織視角</strong><div class="mini">最高權限</div></div>' +
          '<div><label>使用者 / 團隊</label><select id="ownerTenantSelect" onchange="switchOwnerTenant(this.value)">' + tenantOptions + '</select></div>' +
          '<div><label>專案範圍</label><select id="ownerProjectSelect" onchange="switchOwnerProject(this.value)">' + projectOptions + '</select></div>';
        bar.classList.remove('hidden');
      }).catch(function () {
        bar.classList.add('hidden');
      });
    }

    function switchOwnerTenant(slug) {
      if (!slug || slug === tenant) return;
      localStorage.setItem('dm_saas_' + slug + '_token', token);
      location.href = '/admin?tenant=' + encodeURIComponent(slug);
    }

    function switchOwnerProject(code) {
      ownerProject = code || 'ALL';
      crmProject = ownerProject;
      localStorage.setItem('dm_saas_' + tenant + '_project', ownerProject);
      clearViewCache();
      showView(currentView);
    }

    function availableTabs() {
      return [
        { id: 'crm', group: '客戶管理', mark: '客', label: '客戶 CRM', ok: true },
        { id: 'analytics', group: '客戶管理', mark: '數', label: '作答 / 戰情數據', ok: can('ANALYTICS') },
        { id: 'schedule', group: '預約系統', mark: '排', label: '排班系統', ok: true },
        { id: 'consultants', group: '預約系統', mark: '顧', label: '顧問管理', ok: isAdmin() },
        { id: 'questions', group: '預約系統', mark: '表', label: '預約表單', ok: can('FORMS') },
        { id: 'emails', group: '預約系統', mark: '信', label: '提醒 / 跟進信', ok: can('EMAILS') },
        { id: 'quizEditor', group: '測驗系統', mark: '題', label: '題目與分數規則', ok: can('FORMS') },
        { id: 'reportEditor', group: '測驗系統', mark: '報', label: '檢測報告編輯器', ok: can('FORMS') },
        { id: 'projects', group: '系統設定', mark: '專', label: '專案管理', ok: can('PROJECTS') },
        { id: 'usage', group: '系統設定', mark: '用', label: '系統用量', ok: isSystemOwner() },
        { id: 'users', group: '系統設定', mark: '帳', label: '帳號 / 權限管理', ok: isSystemOwner() }
      ].filter(function (tab) { return tab.ok; });
    }

    function renderTabs() {
      const groups = [];
      availableTabs().forEach(function (tab) {
        let group = groups.find(function (item) { return item.name === tab.group; });
        if (!group) { group = { name: tab.group, tabs: [] }; groups.push(group); }
        group.tabs.push(tab);
      });
      document.getElementById('tabs').innerHTML = groups.map(function (group) {
        return '<div class="nav-group"><div class="nav-group-title">' + escapeHtml(group.name) + '</div><div class="nav-items">' +
          group.tabs.map(function (tab) {
            return '<button class="tab" title="' + escapeHtml(tab.label) + '" data-view="' + tab.id + '" onclick="showView(&quot;' + tab.id + '&quot;)"><span class="tab-mark">' + escapeHtml(tab.mark) + '</span><span class="tab-label">' + escapeHtml(tab.label) + '</span></button>';

    function applySidebarState() {
      const app = document.getElementById('app');
      if (app) app.classList.toggle('sidebar-collapsed', sidebarCollapsed);
    }

    function toggleSidebar() {
      sidebarCollapsed = !sidebarCollapsed;
      localStorage.setItem('dm_saas_sidebar_collapsed', sidebarCollapsed ? '1' : '0');
      applySidebarState();
    }

    function showView(name) {
      currentView = name;
      document.querySelectorAll('.tab').forEach(function (tab) {
        tab.classList.toggle('active', tab.dataset.view === name);
      });
      const map = {
        crm: loadCrm,
        schedule: loadSchedule,
        consultants: loadConsultants,
        projects: loadProjects,
        questions: loadQuestions,
        quizEditor: loadQuizEditor,
        reportEditor: loadReportEditor,
        emails: loadEmails,
        analytics: loadAnalytics,
        usage: loadSystemUsage,
        users: loadUserManagement
      };
      (map[name] || loadCrm)();
    }

    function refreshCurrent() {
      delete cache[currentView];
      if (currentView === 'crm') delete cache.crm;
      showView(currentView);
    }

    function loading(title) {
      document.getElementById('view').innerHTML = '<div class="panel"><h2>' + escapeHtml(title) + '</h2><p>載入中...</p></div>';
    }

    function showError(err) {
      document.getElementById('view').innerHTML = '<div class="panel"><h2>發生錯誤</h2><p class="bad">' + escapeHtml(err.message || err) + '</p></div>';
    }

    function loadCrm() {
      if (cache.crm) {
        renderCrm(cache.crm);
        api('getConsultantAppointments', { projectCode: crmProject }).then(function (res) {
          cache.crm = res;
          renderCrm(res);
        }).catch(showError);
        return;
      }
      loading('客戶總覽 CRM');
      api('getConsultantAppointments', { projectCode: crmProject }).then(function (res) {
        cache.crm = res;
        renderCrm(res);
      }).catch(showError);
    }

    function crmPipelineValue(item) {
      const raw = String(item.lifecycleStage || item.status || '').trim().toLowerCase();
      const aliases = { pending: 'lead', new_lead: 'lead', follow_up: 'unbooked', lost: 'rejected', canceled: 'cancelled', won: 'completed' };
      return aliases[raw] || raw;
    }

    function appointmentBucket(item) {
      const status = String(item.status || '').toLowerCase();
      const stage = crmPipelineValue(item);
      if (item.kind === 'waitlist' || stage === 'waitlist') return 'waitlist';
      if (item.kind === 'rejected' || stage === 'rejected' || stage === 'cancelled' || status.includes('取消') || status.includes('婉拒') || status.includes('cancel')) return 'cancelled';
      if (item.kind === 'appointment' && item.timeObj && item.timeObj < Date.now()) return 'past';
      if (item.kind === 'appointment') return 'upcoming';
      return 'unbooked';
    }

    function statusChip(mode, label, count) {
      return '<button class="chip ' + mode + (crmMode === mode ? ' active' : '') + '" onclick="crmMode=&quot;' + mode + '&quot;; renderCrm(cache.crm);">' +
        escapeHtml(label) + ' <span class="badge">' + count + '</span></button>';
    }

    function loadCrmByProject(value) {
      crmProject = value || 'ALL';
      if (isSystemOwner()) {
        ownerProject = crmProject;
        localStorage.setItem('dm_saas_' + tenant + '_project', ownerProject);
        const scopeSelect = document.getElementById('ownerProjectSelect');
        if (scopeSelect) scopeSelect.value = ownerProject;
      }
      delete cache.crm;
      loadCrm();
    }

    function renderCrm(res) {
      window.crmCardItems = {};
      const all = [].concat(res.data || [], res.leads || [], res.contacts || [], res.rejected || [], res.waitlist || []);
      const counts = all.reduce(function (acc, item) {
        acc[appointmentBucket(item)] += 1;
        return acc;
      }, { upcoming: 0, past: 0, cancelled: 0, waitlist: 0, unbooked: 0 });
      const rows = all
        .filter(function (item) { return appointmentBucket(item) === crmMode; })
        .filter(crmMatchesFilters)
        .sort(function (a, b) { return crmMode === 'upcoming' ? (a.timeObj || 0) - (b.timeObj || 0) : (b.timeObj || 0) - (a.timeObj || 0); });
      const projectOptions = ['<option value="ALL">所有專案</option>'].concat((res.allProjects || []).map(function (p) {
        return '<option value="' + escapeHtml(p.code) + '"' + (crmProject === p.code ? ' selected' : '') + '>' + escapeHtml(p.name) + '</option>';
      })).join('');
      const tagOptions = ['<option value="ALL">所有標籤</option>'].concat((res.crmTags || []).map(function (tag) {
        return '<option value="' + escapeHtml(tag) + '"' + (crmTagFilter === tag ? ' selected' : '') + '>' + escapeHtml(tag) + '</option>';
      })).join('');
      document.getElementById('view').innerHTML =
        '<div class="panel">' +
          '<div class="row">' +
            '<div class="col-2"><h2>客戶總覽 CRM</h2></div>' +
            '<div class="col-2"><label>專案篩選</label><select id="crmProject" onchange="loadCrmByProject(this.value)">' + projectOptions + '</select></div>' +
            '<div class="col-2"><label>標籤篩選</label><select id="crmTagFilter" onchange="crmTagFilter=this.value; renderCrm(cache.crm);">' + tagOptions + '</select></div>' +
            '<div class="col-3"><label>流程篩選</label><select id="crmPipelineFilter" onchange="crmPipelineFilter=this.value; renderCrm(cache.crm);">' + crmPipelineOptions(crmPipelineFilter, true) + '</select></div>' +
            '<div class="col-3"><label>搜尋</label><input id="crmSearch" value="' + escapeHtml(crmSearch) + '" placeholder="姓名 / Email / 電話 / 答案" oninput="crmSearch=this.value; renderCrm(cache.crm);"></div>' +
          '</div>' +
          '<div class="stat-grid">' +
            statBox('今天作答', res.crmOverview?.todayQuizResponses || 0) +
            statBox('今天預約', res.crmOverview?.todayBookings || 0) +
            statBox('未預約名單', res.crmOverview?.unbookedCount || counts.unbooked) +
            statBox('即將到來行程', res.crmOverview?.upcomingCount || counts.upcoming) +
          '</div>' +
          '<div class="subtabs">' +
            statusChip('upcoming', '即將到來', counts.upcoming) +
            statusChip('unbooked', '未預約名單', counts.unbooked) +
            statusChip('past', '已過期 / 完成', counts.past) +
            statusChip('cancelled', '取消與婉拒', counts.cancelled) +
            statusChip('waitlist', '等候名單', counts.waitlist) +
          '</div>' +
          crmImportPanel(res) +
        '</div>' +
        crmBatchPanel(rows) +
        '<div class="list">' + (rows.length ? rows.map(clientCard).join('') : '<div class="panel"><p>目前沒有資料。</p></div>') + '</div>';
    }

    function crmBatchPanel(rows) {
      window.crmVisibleRows = rows || [];

      const selectedIds = Object.keys(crmSelectedContacts).filter(function (id) { return crmSelectedContacts[id]; });

        '<div><label>批次狀態</label><select id="crmBatchStatus">' + statusOptions + '</select></div>' +

    function batchUpdateCrmContacts() {
      const ids = Object.keys(crmSelectedContacts).filter(function (id) { return crmSelectedContacts[id]; }).map(Number);
      if (!ids.length) { alert('請先選擇名單。'); return; }
      const tags = splitCrmTags(field('crmBatchTags'));
      const lifecycleStage = field('crmBatchStatus');
      if (!tags.length && !lifecycleStage) { alert('請輸入標籤或選擇狀態。'); return; }
      api('batchUpdateCRMContacts', { contactIds: ids, addTags: tags, lifecycleStage: lifecycleStage }).then(function (res) {
        alert('批次更新完成：' + (res.summary?.updated || 0) + ' 筆');
        crmSelectedContacts = {};
        delete cache.crm;
        loadCrm();
      }).catch(function (err) { alert(err.message); });

    function csvEscape(value) {
      const text = String(value || '');
      return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
    }

    function exportCrmRows() {
      const rows = window.crmVisibleRows || [];
      if (!rows.length) { alert('目前沒有可匯出的結果。'); return; }
      const header = ['姓名', 'Email', '電話', '專案', '狀態', '標籤', '備註'];
      const body = rows.map(function (row) {
        return [row.clientName, row.clientEmail, row.clientPhone, row.projectName || row.projectCode, crmStatusLabel(row.lifecycleStage || row.status), (row.tags || []).join(';'), row.contactNotes || row.answers || ''].map(csvEscape).join(',');
      });
      const newline = String.fromCharCode(10);
      const blob = new Blob(['\ufeff' + header.join(',') + newline + body.join(newline)], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'crm-export-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function crmImportPanel(res) {
      const projectOptions = (res.allProjects || []).map(function (p) {
        return '<option value="' + escapeHtml(p.code) + '"' + ((crmProject !== 'ALL' && crmProject === p.code) ? ' selected' : '') + '>' + escapeHtml(p.name) + '</option>';
      }).join('');
      return '<details class="item" style="margin-top:14px;"><summary><span>匯入 CRM 名單</span><span>CSV / TSV / 試算表貼上</span></summary>' +
        '<div class="details-body"><div class="row">' +
          '<div class="col-4"><label>預設專案</label><select id="crmImportProject">' + projectOptions + '</select></div>' +
          '<div class="col-4"><label>選擇檔案</label><input id="crmImportFile" type="file" accept=".csv,.tsv,.txt" onchange="loadCrmImportFile(this)"></div>' +
          '<div class="col-4"><button onclick="importCrmContacts()">匯入名單</button></div>' +
          '<div class="col-12"><label>貼上資料</label><textarea id="crmImportText" placeholder="姓名,Email,電話,來源,標籤,備註&#10;王小明,test@example.com,0900000000,Google表單,980診斷;高意願,第一次匯入"></textarea><p class="mini">支援欄位：姓名、Email、電話、來源、標籤、備註、專案代碼。標籤可用分號或逗號分隔。</p></div>' +
          '<div class="col-12"><p id="crmImportResult" class="mini"></p></div>' +
        '</div></div></details>';
    }

    function parseDelimitedRows(text) {
      const source = String(text || '').replace(/^\ufeff/, '').trim();
      if (!source) return [];
      const delimiter = source.includes('\t') ? '\t' : ',';
      const rows = [];
      let row = [];
      let cell = '';
      let quoted = false;
      for (let i = 0; i < source.length; i += 1) {
        const ch = source[i];
        const next = source[i + 1];
        if (ch === '"') {
          if (quoted && next === '"') { cell += '"'; i += 1; }
          else quoted = !quoted;
        } else if (ch === delimiter && !quoted) {
          row.push(cell.trim()); cell = '';
        } else if ((ch === '\n' || ch === '\r') && !quoted) {
          if (ch === '\r' && next === '\n') i += 1;
          row.push(cell.trim());
          if (row.some(Boolean)) rows.push(row);
          row = []; cell = '';
        } else {
          cell += ch;
        }
      }
      row.push(cell.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    function crmImportCell(row, headers, names) {
      for (const name of names) {
        const index = headers.findIndex(function (header) { return header.toLowerCase() === String(name).toLowerCase(); });
        if (index >= 0) return row[index] || '';
      }
      return '';
    }

    function parseCrmImportText(text) {
      const rows = parseDelimitedRows(text);
      if (rows.length < 2) return [];
      const headers = rows[0].map(function (header) { return String(header || '').trim(); });
      return rows.slice(1).map(function (row) {
        return {
          name: crmImportCell(row, headers, ['姓名', 'name', 'clientName', '客戶姓名']),
          email: crmImportCell(row, headers, ['Email', 'email', '電子郵件', '信箱']),
          phone: crmImportCell(row, headers, ['電話', 'phone', 'clientPhone', '手機']),
          source: crmImportCell(row, headers, ['來源', 'source']),
          tags: splitCrmTags(crmImportCell(row, headers, ['標籤', 'tags', 'tag']).replace(/[;；]/g, ',')),
          notes: crmImportCell(row, headers, ['備註', 'notes', 'note']),
          projectCode: crmImportCell(row, headers, ['專案代碼', 'projectCode', 'project', '專案'])
        };
      }).filter(function (row) { return row.email; });
    }

    function loadCrmImportFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () { document.getElementById('crmImportText').value = reader.result || ''; };
      reader.readAsText(file, 'utf-8');
    }

    function importCrmContacts() {
      const rows = parseCrmImportText(field('crmImportText'));
      const target = document.getElementById('crmImportResult');
      if (!rows.length) {
        target.textContent = '沒有可匯入資料，請確認第一列是欄位名稱且包含 Email。';
        return;
      }
      target.textContent = '匯入中...';
      api('importCRMContacts', { projectCode: field('crmImportProject'), rows: rows }).then(function (res) {
        const summary = res.summary || {};
        target.textContent = '匯入完成：成功 ' + (summary.imported || 0) + ' 筆，略過 ' + (summary.skipped || 0) + ' 筆。' + ((summary.errors || []).length ? ' ' + summary.errors.slice(0, 3).join('；') : '');
        delete cache.crm;
        return api('getConsultantAppointments', { projectCode: crmProject });
      }).then(function (res) {
        cache.crm = res;
        renderCrm(res);
      }).catch(function (err) {
        target.textContent = err.message || String(err);
      });
    }
    function crmMatchesFilters(item) {
      const tags = Array.isArray(item.tags) ? item.tags : [];
      if (crmTagFilter !== 'ALL' && !tags.includes(crmTagFilter)) return false;
      if (crmPipelineFilter !== 'ALL' && crmPipelineValue(item) !== crmPipelineFilter) return false;
      const needle = String(crmSearch || '').trim().toLowerCase();
      if (!needle) return true;
      return [item.clientName, item.clientEmail, item.clientPhone, item.projectName, item.projectCode, item.answers, item.status, crmPipelineLabel(crmPipelineValue(item))]
        .concat(tags)
        .some(function (value) { return String(value || '').toLowerCase().includes(needle); });
    }

    function renderTagPills(tags) {
      if (!tags || !tags.length) return '';
      return '<div class="subtabs" style="margin:8px 0 4px;">' + tags.map(function (tag) {
        return '<span class="badge">' + escapeHtml(tag) + '</span>';
      }).join('') + '</div>';
    }

    function splitCrmTags(value) {
      const seen = new Set();
      return String(value || '').split(/[,，\n]/).map(function (tag) { return tag.trim(); }).filter(Boolean).filter(function (tag) {
        const key = tag.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0, 20);
    }

    function crmTagOptionsHtml(tags) {
      return (tags || []).map(function (tag) { return '<option value="' + escapeHtml(tag) + '">'; }).join('');
    }

    function crmAnswerPreview(item) {
      const text = String(item.answers || '').trim();
      if (!text) return (item.kind === 'lead' ? '測驗或表單資料可在客戶資料卡查看。' : '沒有問卷內容');
      try {
        const parsed = JSON.parse(text);
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
          const entries = Object.entries(parsed).slice(0, 4);
          return entries.map(function (entry) {
            const value = Array.isArray(entry[1]) ? entry[1].join('、') : entry[1];
            return '<div class="crm-answer-line"><strong>題目 ' + escapeHtml(entry[0]) + '</strong>：' + escapeHtml(value) + '</div>';
          }).join('');
        }
      } catch (_err) {}
      return escapeHtml(text).split('\n').slice(0, 4).join('<br>');
    }

    function clientCard(item) {
      const key = String(item.kind || 'row') + '_' + String(item.rowId || item.crmContactId || item.clientEmail || Math.random());
      window.crmCardItems[key] = item;
      const cls = 'client-card ' + appointmentBucket(item) + ' ' + (item.kind || '');
      const consultantBadge = item.consultant ? '<span class="badge">負責：' + escapeHtml(teamConsultantName(item.consultant)) + '</span>' : '';
      const isUpcoming = appointmentBucket(item) === 'upcoming';
      const rescheduleBadge = String(item.status || '').includes('已發送改期')
        ? '<span class="badge" style="color:#b06000;background:rgba(246,177,0,.16);">已發送改期邀請</span>'
        : '';
      const stageValue = crmPipelineValue(item);
      const stageBadge = stageValue ? '<span class="badge">' + escapeHtml(crmPipelineLabel(stageValue)) + '</span>' : '';
      const kindBadge = '';
      const actionButtons = item.kind === 'appointment' && isUpcoming
        ? '<button class="danger" onclick="cancelAppointment(' + item.rowId + ')">取消會議</button>' +
          '<button class="yellow" onclick="openAdminReschedule(' + item.rowId + ',&quot;' + escapeHtml(item.projectCode || '') + '&quot;)">改期</button>' +
          '<button class="purple" onclick="openTransfer(' + item.rowId + ',' + Number(item.consultantId || 0) + ',&quot;' + escapeHtml(item.projectCode || '') + '&quot;)">轉派</button>' +
          '<button class="secondary" onclick="sendSelfReschedule(' + item.rowId + ')">發送自選改期</button>'
        : (item.kind === 'waitlist'
          ? '<button class="secondary" onclick="sendWaitlistInvite(' + item.rowId + ')">發送時段選擇</button>'
          : '');

      const projectLabel = item.projectName || item.projectCode || '未指定專案';

      return '<div class="' + cls + '">' +
        '<div class="card-top">' +

            '<p class="mini">' + escapeHtml(item.clientPhone || '無電話') + (item.clientEmail ? ' ｜ ' + escapeHtml(item.clientEmail) : '') + '</p>' +
          '</div>' +
          '<span class="badge">' + escapeHtml(projectLabel) + '</span>' +
        '</div>' +
        '<div class="crm-card-meta">' +
          '<div class="crm-meta-item"><div class="mini">預約狀態</div><strong>' + escapeHtml(primaryTime) + '</strong></div>' +
          '<div class="crm-meta-item"><div class="mini">負責顧問</div><strong>' + escapeHtml(ownerLabel) + '</strong></div>' +
          '<div class="crm-meta-item"><div class="mini">來源專案</div><strong>' + escapeHtml(projectLabel) + '</strong></div>' +
          '<div class="crm-meta-item"><div class="mini">流程</div><strong>' + escapeHtml(crmPipelineLabel(stageValue || 'lead')) + '</strong></div>' +
        '</div>' +
        renderTagPills(item.tags || []) +
        '<div class="answer-box"><div class="mini">表單 / 測驗摘要</div><div class="crm-answer-list">' + crmAnswerPreview(item) + '</div></div>' +
        (item.meetLink ? '<p><a href="' + escapeHtml(item.meetLink) + '" target="_blank">開啟會議連結</a></p>' : '') +
        (item.kind === 'appointment' && crmMode === 'past' ? crmEditor(item) : '') +
        '<div class="actions"><button class="secondary" onclick="openClientDetail(&quot;' + escapeHtml(key) + '&quot;)">查看客戶資料卡</button>' + actionButtons + '</div>' +
      '</div>';
    }

    function compactDate(value) {
      return value ? new Date(value).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false }) : '';
    }

    function detailDialog() {
      let dialog = document.getElementById('clientDetailDialog');
      if (!dialog) {
        document.body.insertAdjacentHTML('beforeend', '<dialog id="clientDetailDialog"><div class="dialog-body"></div></dialog>');
        dialog = document.getElementById('clientDetailDialog');
        dialog.addEventListener('click', function (event) {
          const rect = dialog.getBoundingClientRect();
          const clickedBackdrop = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
          if (clickedBackdrop) dialog.close();
        });
      }
      return dialog;
    }

    function openClientDetail(key) {
      const item = window.crmCardItems ? window.crmCardItems[key] : null;
      if (!item) return;
      const dialog = detailDialog();
      dialog.querySelector('.dialog-body').innerHTML = '<h2>客戶資料卡</h2><p>載入中...</p>';
      dialog.showModal();
      api('getCRMContactDetail', { contactId: item.crmContactId || 0, email: item.clientEmail || '', projectCode: item.projectCode || 'P01' })
        .then(renderClientDetail)
        .catch(function (err) { dialog.querySelector('.dialog-body').innerHTML = '<h2>客戶資料卡</h2><p class="bad">' + escapeHtml(err.message || err) + '</p><div class="actions"><button class="secondary" onclick="detailDialog().close()">關閉</button></div>'; });
    }

    function renderScoreItems(items) {
      if (!items || !items.length) return '<p class="mini">沒有分數資料。</p>';
      return '<div class="stat-grid">' + items.map(function (score) {
        return '<div class="stat"><div class="mini">' + escapeHtml(score.name || score.key) + '</div><strong>' + escapeHtml(score.displayScore) + (score.displayMax ? '/' + escapeHtml(score.displayMax) : '') + '</strong><div class="mini">原始：' + escapeHtml(score.rawScore) + (score.rawMax ? '/' + escapeHtml(score.rawMax) : '') + (score.rangeKey ? '｜區間：' + escapeHtml(score.rangeKey) : '') + '</div></div>';
      }).join('') + '</div>';
    }

    function renderAnswerRows(answers) {
      if (!answers || !answers.length) return '<p class="mini">沒有作答明細。</p>';
      return '<table><thead><tr><th>題號</th><th>題目</th><th>答案</th></tr></thead><tbody>' + answers.map(function (answer) {
        return '<tr><td>' + escapeHtml(answer.questionNo) + '</td><td>' + escapeHtml(answer.questionTitle || '') + '</td><td>' + escapeHtml(answer.answerText || '') + '</td></tr>';
      }).join('') + '</tbody></table>';
    }

    function renderHistoryList(items, emptyText, rowFn) {
      if (!items || !items.length) return '<p class="mini">' + escapeHtml(emptyText) + '</p>';
      return '<div class="list">' + items.map(rowFn).join('') + '</div>';
    }

    function crmDetailMeta(label, value) {
      return '<div class="crm-meta-item"><div class="mini">' + escapeHtml(label) + '</div><strong>' + escapeHtml(value || '無資料') + '</strong></div>';
    }

    function sectionTitle(title, note) {
      return '<div class="section-title-row"><h3>' + escapeHtml(title) + '</h3>' + (note ? '<span class="mini">' + escapeHtml(note) + '</span>' : '') + '</div>';
    }

    function renderClientDetail(res) {
      const dialog = detailDialog();
      const contact = res.contact || {};
      const summary = res.crmSummary || {};
      const latest = res.latestQuiz || null;
      const answers = latest ? (res.answersByResponse || {})[String(latest.id)] || [] : [];
      const lifecycleLabel = crmPipelineLabel(summary.lifecycleStage || contact.lifecycle_stage || 'lead');
      const projectLabel = summary.projectCode || contact.project_code || '未指定';
      const tagPills = renderTagPills(contact.tags || []);
      dialog.querySelector('.dialog-body').innerHTML =
        '<div class="detail-hero">' +
          '<div>' +
            '<div class="detail-identity"><h2>' + escapeHtml(contact.name || '客戶資料卡') + '</h2><span class="badge">' + escapeHtml(lifecycleLabel) + '</span><span class="badge">' + escapeHtml(projectLabel) + '</span></div>' +
            '<div class="detail-contact-grid">' + crmDetailMeta('電話', contact.phone || '') + crmDetailMeta('Email', contact.email || '') + crmDetailMeta('最新狀態', lifecycleLabel) + '</div>' +
            tagPills +
          '</div>' +
          '<button class="secondary" onclick="detailDialog().close()">關閉</button>' +
        '</div>' +
        '<div class="stat-grid">' + statBox('測驗次數', summary.quizCount || 0) + statBox('預約紀錄', summary.appointmentCount || 0) + statBox('Email 紀錄', summary.emailCount || 0) + statBox('點擊紀錄', summary.clickCount || 0) + '</div>' +
        '<div class="detail-section">' + sectionTitle('基本資料', '最近互動') + '<div class="crm-card-meta">' + crmDetailMeta('專案', projectLabel) + crmDetailMeta('最新測驗', compactDate(summary.latestQuizAt)) + crmDetailMeta('最新預約', compactDate(summary.latestAppointmentAt)) + crmDetailMeta('CRM 狀態', lifecycleLabel) + '</div></div>' +
        '<div class="detail-section">' + sectionTitle('名單分類', '標籤用來做歸類，流程狀態用來追蹤進度') + '<div class="row"><div class="col-5"><label>標籤</label><input id="crmDetailTags" list="crmKnownTags" value="' + escapeHtml((contact.tags || []).join(', ')) + '" placeholder="例如：980診斷, 高意願, 企業包班"><datalist id="crmKnownTags">' + crmTagOptionsHtml(cache.crm?.crmTags || []) + '</datalist><p class="mini">多個標籤可用逗號分隔。</p></div><div class="col-3"><label>流程狀態</label><select id="crmDetailStage">' + crmPipelineOptions(summary.lifecycleStage || contact.lifecycle_stage || 'lead', false).replace('<option value="">不變更狀態</option>', '') + '</select></div><div class="col-4"><button onclick="saveClientLabels(' + Number(contact.id || 0) + ')">儲存分類</button></div><div class="col-12"><label>內部備註</label><textarea id="crmDetailNotes">' + escapeHtml(contact.notes || '') + '</textarea></div></div></div>' +
        '<div class="detail-section">' + sectionTitle('測驗紀錄', '') + (latest ? '<p>版本：' + escapeHtml(latest.versionCode || '') + '｜作答時間：' + escapeHtml(compactDate(latest.submittedAt)) + '</p><div class="actions"><a target="_blank" href="' + escapeHtml(latest.reportUrl || '') + '">開啟報告連結</a></div>' + renderScoreItems(latest.scoreItems || []) : '<p class="mini">沒有測驗紀錄。</p>') + '</div>' +
        '<div class="detail-section">' + sectionTitle('作答詳情', '') + renderAnswerRows(answers) + '</div>' +
        '<div class="detail-section">' + sectionTitle('報告結果', '') + renderHistoryList(latest ? latest.matchedContent || [] : [], '沒有報告區間內容。', function (item) { return '<div class="item"><strong>' + escapeHtml(item.dimensionName || item.dimensionKey || '') + '｜' + escapeHtml(item.label || '') + '</strong><p>' + escapeHtml(item.title || '') + '</p><p>' + escapeHtml(item.body || '') + '</p></div>'; }) + '</div>' +
        '<div class="detail-section">' + sectionTitle('預約紀錄', '') + renderHistoryList(res.appointmentHistory || [], '沒有預約紀錄。', function (item) { return '<div class="item"><strong>' + escapeHtml(compactDate(item.startAt)) + '</strong><p>' + escapeHtml(item.status || '') + '｜' + escapeHtml(item.consultantName || '') + '</p>' + (item.meetLink ? '<p><a target="_blank" href="' + escapeHtml(item.meetLink) + '">會議連結</a></p>' : '') + '</div>'; }) + '</div>' +
        '<div class="detail-section">' + sectionTitle('Email 發送歷程', '') + renderHistoryList(res.emailHistory || [], '沒有 Email 紀錄。', function (item) { return '<div class="item"><strong>' + escapeHtml(item.subject || '') + '</strong><p>' + escapeHtml(item.status || '') + '｜' + escapeHtml(item.triggerName || '') + '｜' + escapeHtml(compactDate(item.sentAt || item.scheduledAt || item.createdAt)) + '</p></div>'; }) + '</div>' +
        '<div class="detail-section">' + sectionTitle('點擊歷程', '') + renderHistoryList(res.clickEvents || [], '沒有點擊紀錄。', function (item) { return '<div class="item"><strong>' + escapeHtml(item.title || item.type || '') + '</strong><p>' + escapeHtml(item.body || '') + '</p><p class="mini">' + escapeHtml(compactDate(item.occurredAt)) + '</p></div>'; }) + '</div>' +
        '<div class="detail-section">' + sectionTitle('客戶歷程', '') + renderHistoryList(res.normalizedTimeline || [], '沒有歷程紀錄。', function (item) { return '<div class="item"><strong>' + escapeHtml(item.title || item.type || '') + '</strong><p>' + escapeHtml(item.body || '') + '</p><p class="mini">' + escapeHtml(item.category || '') + '｜' + escapeHtml(compactDate(item.occurredAt)) + '</p></div>'; }) + '</div>';
    }
    function saveClientLabels(contactId) {
      if (!contactId) return;
      const tags = splitCrmTags(field('crmDetailTags'));
      const notes = field('crmDetailNotes');
      const lifecycleStage = field('crmDetailStage');
      api('saveCRMContactLabels', { contactId: contactId, tags: tags, notes: notes, lifecycleStage: lifecycleStage }).then(function (res) {
        delete cache.crm;
        return Promise.all([
          api('getCRMContactDetail', { contactId: contactId }),
          api('getConsultantAppointments', { projectCode: crmProject })
        ]);
      }).then(function (results) {
        cache.crm = results[1];
        renderCrm(cache.crm);
        renderClientDetail(results[0]);
      }).catch(function (err) { alert(err.message); });
    }
    function attendanceOptions(current) {
      const value = ['出席', '未出席'].includes(String(current || '')) ? current : '';
      return [
        ['', '-- 待確認 --'],
        ['出席', '出席'],
        ['未出席', '未出席']
      ].map(function (option) {
        return '<option value="' + option[0] + '"' + (value === option[0] ? ' selected' : '') + '>' + option[1] + '</option>';
      }).join('');
    }

    function crmEditor(item) {
      return '<h3 class="record-heading">會後紀錄</h3><div class="row">' +
        '<div class="col-3"><label>出席狀態</label><select id="att_' + item.rowId + '">' + attendanceOptions(item.attendance) + '</select></div>' +
        '<div class="col-5"><label>報名方案</label><input id="plan_' + item.rowId + '" value="' + escapeHtml(item.plan || '') + '"></div>' +
        '<div class="col-4"><button onclick="saveCrm(' + item.rowId + ')">儲存會後紀錄</button></div>' +
        '<div class="col-12"><label>備註紀錄</label><textarea id="notes_' + item.rowId + '">' + escapeHtml(item.notes || '') + '</textarea></div>' +
      '</div>';
    }

    function saveCrm(rowId) {
      api('updateCRMRecord', {
        rowId: rowId,
        attendance: field('att_' + rowId),
        plan: field('plan_' + rowId),
        notes: field('notes_' + rowId)
      }).then(function () {
        delete cache.crm;
        loadCrm();
      }).catch(function (err) { alert(err.message); });
    }

    function cancelAppointment(rowId) {
      if (!confirm('確定取消這場會議？')) return;
      api('handleAppointmentAction', { rowId: rowId, actionType: 'cancel' }).then(function () {
        delete cache.crm;
        loadCrm();
      }).catch(function (err) { alert(err.message); });
    }

    function sendSelfReschedule(rowId) {
      if (!confirm('確定要發送這位客戶的自選改期連結？')) return;
      api('sendSelfRescheduleLink', { rowId: rowId }).then(function (res) {
        alert(res.message || '自選改期連結已寄出');
        delete cache.crm;
        loadCrm();
      }).catch(function (err) { alert(err.message); });
    }

    function actionDialog(title, body, confirmLabel, onConfirm) {
      let dialog = document.getElementById('actionDialog');
      if (!dialog) {
        document.body.insertAdjacentHTML('beforeend', '<dialog id="actionDialog"><div class="dialog-body"></div></dialog>');
        dialog = document.getElementById('actionDialog');
      }
      dialog.querySelector('.dialog-body').innerHTML =
        '<h2>' + escapeHtml(title) + '</h2>' + body +
        '<div class="actions"><button id="dialogConfirm">' + escapeHtml(confirmLabel) + '</button><button class="secondary" id="dialogCancel" type="button">取消</button></div>';
      dialog.querySelector('#dialogCancel').onclick = function () { dialog.close(); };
      dialog.querySelector('#dialogConfirm').onclick = onConfirm;
      dialog.showModal();
      return dialog;
    }

    function openAdminReschedule(rowId, projectCode) {
      api('getAvailableTimes', { projectCode: projectCode }).then(function (slots) {
        if (!Array.isArray(slots) || !slots.length) throw new Error('目前沒有可供改期的時段。');
        const grouped = {};
        slots.forEach(function (slot) {
          const dateKey = slot.dateKey || new Date(Number(slot.timestamp)).toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
          if (!grouped[dateKey]) grouped[dateKey] = [];
          grouped[dateKey].push(slot);
        });
        const dates = Object.keys(grouped).sort();
        const dateOptions = dates.map(function (dateKey) {
          const label = grouped[dateKey][0]?.dateLabel || dateKey;
          return '<option value="' + escapeHtml(dateKey) + '">' + escapeHtml(label) + '</option>';
        }).join('');
        const dialog = actionDialog(
          '直接改期',
          '<div class="row"><div class="col-6"><label>先選日期</label><select id="rescheduleDate">' + dateOptions + '</select></div>' +
          '<div class="col-6"><label>再選時間</label><select id="rescheduleTime"></select></div></div>',
          '確認改期',
          function () {
          const button = dialog.querySelector('#dialogConfirm');
          const timestamp = Number(dialog.querySelector('#rescheduleTime').value);
          if (!timestamp) {
            alert('請選擇新的時間。');
            return;
          }
          button.disabled = true;
          api('handleAppointmentAction', {
            rowId: rowId,
            actionType: 'reschedule',
            timestamp: timestamp
          }).then(function (res) {
            dialog.close();
            alert(res.message || '改期完成');
            delete cache.crm;
            loadCrm();
          }).catch(function (err) {
            button.disabled = false;
            alert(err.message);
          });
        });
        const renderTimes = function () {
          const dateKey = dialog.querySelector('#rescheduleDate').value;
          dialog.querySelector('#rescheduleTime').innerHTML = (grouped[dateKey] || []).map(function (slot) {
            return '<option value="' + Number(slot.timestamp) + '">' + escapeHtml(slot.timeLabel || slot.displayText) + '</option>';
          }).join('');
        };
        dialog.querySelector('#rescheduleDate').onchange = renderTimes;
        renderTimes();
      }).catch(function (err) { alert(err.message); });
    }

    function openTransfer(rowId, currentConsultantId, projectCode) {
      const consultants = (cache.crm?.allConsultants || []).filter(function (consultant) {
        const projects = Array.isArray(consultant.project_codes) ? consultant.project_codes : ['ALL'];
        const connected = String(consultant.meet_tool || '').includes('Microsoft')
          ? consultant.microsoft_connected
          : consultant.google_connected;
        return Number(consultant.id) !== Number(currentConsultantId) &&
          consultant.accepting && connected && (projects.includes('ALL') || projects.includes(projectCode));
      });
      if (!consultants.length) {
        alert('目前沒有其他可轉派的顧問。');
        return;
      }
      const options = consultants.map(function (consultant) {
        return '<option value="' + Number(consultant.id) + '">' + escapeHtml(teamConsultantName(consultant.name)) + '</option>';
      }).join('');
      const dialog = actionDialog('轉派顧問', '<label>接手顧問</label><select id="transferConsultant">' + options + '</select>', '確認轉派', function () {
        const button = dialog.querySelector('#dialogConfirm');
        button.disabled = true;
        api('handleAppointmentAction', {
          rowId: rowId,
          actionType: 'transfer',
          targetConsultantId: Number(dialog.querySelector('#transferConsultant').value)
        }).then(function (res) {
          dialog.close();
          alert(res.message || '轉派完成');
          delete cache.crm;

    function renderScheduleEditor(res) {
      const weekly = {};
      (res.weekly || []).forEach(function (rule) { weekly[rule.dayOfWeek] = rule; });
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const rows = days.map(function (day, i) {
        const rule = weekly[i] || {};
        return '<div class="row item">' +
          '<div class="col-2"><strong>星期' + day + '</strong></div>' +
          '<div class="col-3"><input type="time" id="w_start_' + i + '" value="' + escapeHtml(rule.start || '') + '"></div>' +
          '<div class="col-3"><input type="time" id="w_end_' + i + '" value="' + escapeHtml(rule.end || '') + '"></div>' +
          '<div class="col-2"><input type="time" id="w_start2_' + i + '" value="' + escapeHtml(rule.start2 || '') + '"></div>' +
          '<div class="col-2"><input type="time" id="w_end2_' + i + '" value="' + escapeHtml(rule.end2 || '') + '"></div>' +
        '</div>';
      }).join('');
      const specific = (res.specific || []).slice(0, 6);
      while (specific.length < 3) specific.push({});
      const specificRows = specific.map(function (rule, index) {
        return '<div class="row item">' +
          '<div class="col-4"><input type="date" id="sp_date_' + index + '" value="' + escapeHtml(String(rule.date || '').slice(0, 10)) + '"></div>' +
          '<div class="col-4"><input type="time" id="sp_start_' + index + '" value="' + escapeHtml(rule.start || '') + '"></div>' +
          '<div class="col-4"><input type="time" id="sp_end_' + index + '" value="' + escapeHtml(rule.end || '') + '"></div>' +
        '</div>';
      }).join('');
      const google = res.googleConnected
        ? '<span class="ok">Google Calendar、Meet 與 Gmail 已連結：' + escapeHtml(res.googleEmail || 'Google') + '</span>'
        : '<button class="secondary" onclick="connectGoogle(' + res.consultantId + ')">連結 Google Calendar / Meet / Gmail</button>';
      const microsoft = res.microsoftEnabled ? (res.microsoftConnected
        ? '<span class="ok">Microsoft Calendar 與 Teams 已連結：' + escapeHtml(res.microsoftEmail || 'Microsoft') + '</span>'
        : '<button class="secondary" onclick="connectMicrosoft(' + res.consultantId + ')">連結 Microsoft Calendar / Teams</button>') : '';
      let scheduleWarning = '';
      if (!res.accepting) {
        scheduleWarning = '<div class="warning-box"><strong>目前不會顯示預約時段：</strong>「接收新預約」是關閉狀態。請改成「是」並儲存排班。</div>';
      } else if (res.meetTool === 'Google Meet' && !res.googleConnected) {
        scheduleWarning = '<div class="warning-box"><strong>目前不會顯示預約時段：</strong>請先連結 Google Calendar。</div>';
      } else if (res.meetTool === 'Microsoft Teams' && !res.microsoftConnected) {
        scheduleWarning = '<div class="warning-box"><strong>目前不會顯示預約時段：</strong>請先連結 Microsoft Calendar。</div>';

      } else if (!(res.weekly || []).length && !(res.specific || []).length) {
        scheduleWarning = '<div class="warning-box"><strong>目前不會顯示預約時段：</strong>請至少設定一組完整的開始與結束時間。</div>';
      }
      document.getElementById('scheduleEditor').innerHTML =
        '<div class="row">' +
          '<div class="col-2"><label>接收新預約</label><select id="scheduleAccepting">' + selectedOption('true', String(Boolean(res.accepting)), '是') + selectedOption('false', String(Boolean(res.accepting)), '否') + '</select></div>' +
          '<div class="col-3"><label>視訊工具</label><select id="scheduleMeetTool">' + videoToolOptions(res.meetTool) + '</select></div>' +
          '<div class="col-3"><label>時區</label><select id="shiftTZ">' + timeZoneOptions(res.shiftTZ) + '</select></div>' +
          '<div class="col-2"><label>間隔分鐘</label><input id="interval" type="number" value="' + (res.settings?.interval || 60) + '"></div>' +
          '<div class="col-2"><label>前緩衝</label><input id="bufferBefore" type="number" value="' + (res.settings?.bufferBefore || 0) + '"></div>' +
          '<div class="col-2"><label>後緩衝</label><input id="bufferAfter" type="number" value="' + (res.settings?.bufferAfter || 0) + '"></div>' +
          '<div class="col-3"><label>最早可預約（幾天後）</label><input id="minDays" type="number" min="0" max="365" value="' + (res.settings?.minDays ?? 1) + '"><div class="mini">0 代表今天，1 代表明天</div></div>' +
          '<div class="col-3"><label>開放到未來第幾天</label><input id="maxDays" type="number" min="1" max="365" value="' + (res.settings?.maxDays ?? 14) + '"><div class="mini">例如 30 代表顯示未來 30 天</div></div>' +
        '</div>' +
        scheduleWarning +
        '<div class="actions">' + google + microsoft + '</div>' +
        '<h3 style="margin-top:16px;">每週固定時段</h3>' + rows +
        '<h3 style="margin-top:16px;">指定日期加開</h3>' + specificRows +
        '<div class="actions"><button onclick="saveSchedule(' + res.consultantId + ')">儲存排班</button></div>';
    }

    function collectScheduleRules() {
      const weeklyRules = [];
      for (let i = 0; i < 7; i += 1) {
        const start = field('w_start_' + i);
        const end = field('w_end_' + i);
        if (start && end) weeklyRules.push({
          dayOfWeek: i,
          start: start,
          end: end,
          start2: field('w_start2_' + i),
          end2: field('w_end2_' + i)
        });
      }
      const specificRules = [];
      for (let i = 0; i < 6; i += 1) {
        const date = field('sp_date_' + i);
        const start = field('sp_start_' + i);
        const end = field('sp_end_' + i);
        if (date && start && end) specificRules.push({ date: date, start: start, end: end });
      }
      return { weeklyRules: weeklyRules, specificRules: specificRules };
    }

    function saveSchedule(consultantId) {
      const rules = collectScheduleRules();
      const minDays = Number(field('minDays'));
      const maxDays = Number(field('maxDays'));
      if (!Number.isFinite(minDays) || !Number.isFinite(maxDays) || minDays < 0 || maxDays < minDays) {
        alert('預約開放區間不正確：最晚天數必須大於或等於最早天數。');
        return;
      }
      api('saveConsultantWeeklyAndSettings', {
        consultantId: consultantId,
        accepting: field('scheduleAccepting') === 'true',
        meetTool: field('scheduleMeetTool'),
        shiftTZ: field('shiftTZ'),
        settings: {
          interval: Number(field('interval') || 60),
          bufferBefore: Number(field('bufferBefore') || 0),
          bufferAfter: Number(field('bufferAfter') || 0),
          minDays: minDays,
          maxDays: maxDays
        },
        weeklyRules: rules.weeklyRules,
        specificRules: rules.specificRules
      }).then(function () {
        alert('已儲存');
        loadSchedule();
      }).catch(function (err) { alert(err.message); });
    }

    function roleValue(row) {
      const token = String(row.sysRole || '').toUpperCase();

    function projectPermissionChecks(value, projects) {
      const selected = String(value || 'ALL').toUpperCase().split(',').map(function (code) { return code.trim(); }).filter(Boolean);
      const allSelected = selected.includes('ALL');
      const items = [['ALL', '全部專案']].concat((projects || []).map(function (project) {
        return [project.code, project.name || project.code];
      }));
      return '<div class="project-checks">' + items.map(function (item) {
        const checked = item[0] === 'ALL' ? allSelected : (!allSelected && selected.includes(item[0]));
        return '<label class="checkline"><input class="c-project-check" type="checkbox" value="' + escapeHtml(item[0]) + '"' +
          (checked ? ' checked' : '') + ' onchange="toggleConsultantProject(this)"> ' + escapeHtml(item[1]) + '</label>';
      }).join('') + '</div>';
    }

    function toggleConsultantProject(input) {
      const row = input.closest('.consultant-row');
      const all = row.querySelector('.c-project-check[value="ALL"]');
      if (input.value === 'ALL' && input.checked) {
        row.querySelectorAll('.c-project-check:not([value="ALL"])').forEach(function (checkbox) { checkbox.checked = false; });
      } else if (input.value !== 'ALL' && input.checked) {
        all.checked = false;

      if (!checked.length) all.checked = true;

    function copyBookingUrl(button) {
      const input = button.closest('.copy-field').querySelector('input');
      const copied = function () {
        const original = button.textContent;
        button.textContent = '已複製';
        setTimeout(function () { button.textContent = original; }, 1200);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(input.value).then(copied).catch(function () {
          input.select();
          document.execCommand('copy');
          copied();
        });
        return;
      }
      input.select();
      document.execCommand('copy');
      copied();
    }

    function loadQuizImportFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      reader.onload = function () { document.getElementById('quizImportText').value = reader.result || ''; };
      reader.readAsText(file, 'utf-8');

    function quizImportCell(row, headers, names) {
      for (const name of names) {
        const index = headers.findIndex(function (header) { return String(header || '').trim().toLowerCase() === String(name || '').trim().toLowerCase(); });
        if (index >= 0) return row[index] || '';
      }
      return '';
    }

    function normalizeQuizQuestionType(value) {
      const raw = String(value || '').trim().toLowerCase();
      if (['multiple', 'checkbox', '複選', '多選'].includes(raw)) return 'multiple';
      if (['short_text', 'short', '短答', '簡答'].includes(raw)) return 'short_text';
      if (['long_text', 'long', '長答', '詳答'].includes(raw)) return 'long_text';
      return 'single';
    }

    function importQuizQuestions() {
      const target = document.getElementById('quizImportResult');
      const rows = parseDelimitedRows(field('quizImportText'));
      if (rows.length < 2) { if (target) target.textContent = '沒有可匯入資料，請確認第一列是欄位名稱。'; return; }
      const headers = rows[0].map(function (header) { return String(header || '').trim(); });
      const data = collectQuizEditorPayload();
      const stageMap = new Map(data.stages.map(function (stage) { return [String(stage.stageKey || '').toLowerCase(), stage]; }));
      data.stages.forEach(function (stage) { if (stage.title) stageMap.set(String(stage.title).toLowerCase(), stage); });
      const questionMap = new Map();
      rows.slice(1).forEach(function (row, rowIndex) {
        const questionNo = Number(quizImportCell(row, headers, ['題號', 'questionNo', 'no']) || rowIndex + 1);
        const questionTitle = quizImportCell(row, headers, ['題目', 'question', 'title']);
        const stageRaw = quizImportCell(row, headers, ['階段', 'stage', 'stageKey']) || '1';
        const stageTitle = quizImportCell(row, headers, ['階段標題', 'stageTitle']) || stageRaw;
        const stageKey = String(stageRaw).trim() || '1';
        if (!stageMap.has(stageKey.toLowerCase()) && !stageMap.has(stageTitle.toLowerCase())) {
          const stage = { stageKey: stageKey, title: stageTitle, description: '', sortOrder: (data.stages.length + 1) * 10 };
          data.stages.push(stage);
          stageMap.set(stageKey.toLowerCase(), stage);
          stageMap.set(stageTitle.toLowerCase(), stage);
        }
        if (!questionTitle) return;
        const questionKey = String(questionNo) + '::' + questionTitle;
        let question = questionMap.get(questionKey);
        if (!question) {
          question = {
            questionNo: questionNo,
            stageKey: (stageMap.get(stageKey.toLowerCase()) || stageMap.get(stageTitle.toLowerCase()) || {}).stageKey || stageKey,
            title: questionTitle,
            helpText: quizImportCell(row, headers, ['補充說明', 'helpText', 'description']),
            type: normalizeQuizQuestionType(quizImportCell(row, headers, ['題型', 'type'])),
            isRequired: !['false', '否', '非必填', '0'].includes(String(quizImportCell(row, headers, ['必填', 'required']) || 'true').trim().toLowerCase()),
            sortOrder: questionNo * 10,
            options: []
          };
          questionMap.set(questionKey, question);
        }
        const optionLabel = quizImportCell(row, headers, ['選項文字', 'option', 'optionLabel', '答案']);
        if (!optionLabel && ['short_text', 'long_text'].includes(question.type)) return;
        if (!optionLabel) return;
        const optionIndex = question.options.length;
        const scoreWeights = {};
        (data.dimensions || []).forEach(function (dim) {
          const rawScore = quizImportCell(row, headers, [dim.dimensionKey, dim.name, '分數_' + dim.name, '加分_' + dim.name]);
          scoreWeights[dim.dimensionKey] = Number(rawScore || 0);
        });
        question.options.push({
          optionKey: quizImportCell(row, headers, ['選項代碼', 'optionKey', 'code']) || String.fromCharCode(65 + optionIndex),
          label: optionLabel,
          description: quizImportCell(row, headers, ['選項說明', 'optionDescription']),
          scoreWeights: scoreWeights,
          sortOrder: (optionIndex + 1) * 10
        });
      });
      data.questions = Array.from(questionMap.values()).sort(function (a, b) { return a.questionNo - b.questionNo; });
      quizEditorTab = 'questions';

    function collectQuizEditorPayload() {

      return {
