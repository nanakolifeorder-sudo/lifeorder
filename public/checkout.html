<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>人生秩序完整版｜付款資訊</title>
  <style>:root{--ink:#16333a;--muted:#617177;--paper:#f7f1e4;--gold:#c79a3c;--blue:#2d60b4;--line:#d8d0be}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',Arial,sans-serif;line-height:1.55}.wrap{width:min(620px,calc(100% - 32px));margin:56px auto}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:30px;box-shadow:0 10px 28px rgba(22,51,58,.08)}h1{font-size:30px;margin:0 0 8px}p{color:var(--muted)}.price{font-size:28px;color:var(--gold);font-weight:800;margin:22px 0}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;font-weight:800;cursor:pointer}.note{font-size:13px}.error{color:#b42318;min-height:24px;margin-top:14px}</style>
</head>
<body><main class="wrap"><section class="panel"><h1 id="title">人生秩序完整版</h1><p id="description">完成付款後，即可開始完整版測驗。</p><div class="price" id="price">NT$980</div><form id="checkoutForm"><label for="name">姓名</label><input id="name" autocomplete="name" required><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="phone">手機號碼</label><input id="phone" inputmode="numeric" autocomplete="tel" placeholder="請輸入 09xxxxxxxx" pattern="09[0-9]{8}" maxlength="10" required><button id="submitButton" type="submit">前往藍新安全付款</button><div id="error" class="error" role="alert"></div></form><p class="note">付款資訊由藍新金流安全處理，Life Order 不會保存信用卡資料。</p></section></main><script>
const params=new URLSearchParams(location.search);const testToken=params.get('test')||'';const isTest=Boolean(testToken);const productCode=isTest?'LO-FULL-TEST-1':'LO-FULL-980';
if(isTest){document.title='人生秩序完整版｜付款測試';document.getElementById('title').textContent='人生秩序完整版付款測試';document.getElementById('description').textContent='此為受保護的流程測試，付款成功後會導向完整版測驗。';document.getElementById('price').textContent='NT$1';}if(!isTest){fetch('/api?action=getPublicCheckoutPageSettings&tenant=lifeorder').then(response=>response.json()).then(result=>{const settings=result.settings||{};if(!result.success)return;document.getElementById('title').textContent=settings.checkoutTitle||document.getElementById('title').textContent;document.getElementById('description').textContent=settings.checkoutDescription||document.getElementById('description').textContent;document.title=(settings.checkoutTitle||'人生秩序完整版')+'｜付款資訊';}).catch(()=>{});}
const form=document.getElementById('checkoutForm');const button=document.getElementById('submitButton');const error=document.getElementById('error');
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';button.disabled=true;button.textContent='正在建立付款訂單…';try{const response=await fetch('/api?action=createLifeOrderPayment&tenant=lifeorder',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({productCode,testToken,name:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value})});const result=await response.json();if(!result.success)throw new Error(result.message||'目前無法建立付款訂單。');const payment=result.payment;const target=document.createElement('form');target.method='post';target.action=payment.gatewayUrl;Object.entries(payment.fields).forEach(([key,value])=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=value;target.appendChild(input)});document.body.appendChild(target);target.submit()}catch(err){error.textContent=err.message||'目前無法建立付款訂單。';button.disabled=false;button.textContent='前往藍新安全付款'}});
</script></body></html>
