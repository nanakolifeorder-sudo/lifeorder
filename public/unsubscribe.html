<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>退訂信件 | DM Booking SaaS</title>  <style>
    :root{--blue:#1a73e8;--ink:#202124;--muted:#5f6368;--line:#dadce0;--soft:#f8fafc}
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Arial,'Noto Sans TC',sans-serif;line-height:1.7}
    main{max-width:860px;margin:0 auto;padding:40px 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 8px 30px rgba(60,64,67,.08)}
    h1{color:var(--blue);font-size:30px;margin:0 0 14px}h2{font-size:21px;margin:28px 0 10px}p,li{color:var(--muted)}a{color:var(--blue);font-weight:700}.nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.nav a{padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;text-decoration:none}.muted{color:var(--muted);font-size:14px}.ok{color:#188038;font-weight:700}.bad{color:#d93025;font-weight:700}input,button{font:inherit;border-radius:6px;padding:12px}input{width:100%;border:1px solid var(--line)}button{border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}
  </style></head><body><main><section class="panel"><h1>退訂信件</h1><p>按下按鈕後，系統會停止寄送非必要跟進信件。</p><p id="msg" class="muted">正在讀取退訂資訊...</p><button id="btn" type="button">確認退訂</button><div class="nav"><a href="/">回首頁</a><a href="/privacy.html">隱私權政策</a></div></section></main><script>const p=new URLSearchParams(location.search);const tenant=(p.get('tenant')||'').toLowerCase();const token=p.get('token')||'';const msg=document.getElementById('msg');const btn=document.getElementById('btn');if(!tenant||!token){msg.textContent='退訂連結缺少必要資訊。';msg.className='bad';btn.disabled=true;}else{msg.textContent='請確認是否要退訂這個預約系統的後續提醒信。'}btn.onclick=function(){btn.disabled=true;btn.textContent='處理中...';fetch('/api?action=unsubscribeEmail&tenant='+encodeURIComponent(tenant),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:token})}).then(r=>r.json()).then(r=>{if(!r.success)throw new Error(r.message||'退訂失敗');msg.textContent='已完成退訂。';msg.className='ok';btn.textContent='已退訂';}).catch(e=>{msg.textContent=e.message||'退訂失敗';msg.className='bad';btn.disabled=false;btn.textContent='重新送出';});};</script></body></html>
