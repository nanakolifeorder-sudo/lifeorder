<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>檢測報告</title>
  <style>
    :root { --blue:#1a73e8; --green:#188038; --ink:#202124; --muted:#5f6368; --line:#dadce0; --soft:#f8fafc; --bg:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,'Noto Sans TC',sans-serif; line-height:1.7; }
    main { max-width:980px; margin:0 auto; padding:28px 16px 64px; }
    .hero, .section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:26px; box-shadow:0 8px 28px rgba(60,64,67,.08); margin-bottom:16px; }
    h1 { font-size:30px; margin:0 0 8px; color:var(--blue); }
    h2 { font-size:22px; margin:0 0 12px; }
    h3 { font-size:18px; margin:0 0 6px; }
    p { color:var(--muted); margin:0 0 10px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .score-snapshot { display:grid; grid-template-columns:minmax(320px,.95fr) minmax(360px,1.05fr); gap:24px; align-items:center; margin-top:14px; }
    .score-list { display:grid; grid-template-columns:1fr; gap:10px; }
    .score { border:1px solid var(--line); border-radius:8px; padding:14px 16px; background:var(--soft); }
    .score p { margin-top:10px; font-size:14px; }
    .chart-wrap { display:flex; justify-content:center; align-items:center; }
    .radar { width:100%; max-width:420px; aspect-ratio:1; }
    .radar-grid { fill:none; stroke:#d7dee8; stroke-width:1; }
    .radar-axis { stroke:#e5eaf1; stroke-width:1; }
    .radar-shape { fill:rgba(26,115,232,.22); stroke:var(--blue); stroke-width:2.5; }
    .radar-dot { fill:var(--blue); stroke:#fff; stroke-width:2; }
    .radar-label { fill:var(--ink); font-size:12px; font-weight:700; }
    .score-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
    .score-value { font-size:28px; font-weight:800; color:var(--blue); }
    .meter { height:8px; background:#e8eaed; border-radius:999px; overflow:hidden; margin-top:10px; }
    .meter span { display:block; height:100%; background:var(--green); width:0; }
    .content { border-top:1px solid var(--line); padding-top:16px; margin-top:16px; }
    .diagnosis-group { border-top:1px solid var(--line); padding-top:18px; margin-top:18px; }
    .diagnosis-group:first-child { border-top:0; padding-top:0; margin-top:0; }
    .diagnosis-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .diagnosis-card { border:1px solid var(--line); border-radius:8px; padding:16px; background:#fff; }
    .diagnosis-card h4 { margin:0 0 8px; font-size:17px; }
    .age-content { margin-top:16px; padding:16px 18px; border-left:4px solid var(--blue); background:#f8fbff; border-radius:8px; }
    .age-content h4 { margin:4px 0 8px; font-size:18px; }
    .age-content p:last-child { margin-bottom:0; }
    .age-kicker { color:var(--blue); font-size:13px; font-weight:700; margin:0 0 4px; }
    .age-action-list { margin:10px 0 0; padding-left:20px; color:var(--muted); }
    .guide { margin-top:22px; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr); gap:16px; }
    .guide-box { border:1px solid var(--line); border-radius:8px; padding:18px; background:#fff; }
    .guide-box h3 { margin-bottom:10px; }
    .legend { display:grid; gap:8px; }
    .legend-row { display:grid; grid-template-columns:72px 1fr; gap:10px; align-items:start; color:var(--muted); }
    .legend-chip { height:14px; border-radius:999px; margin-top:6px; }
    .guide-steps { display:grid; gap:10px; }
    .guide-step { display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:start; color:var(--muted); }
    .step-no { width:28px; height:28px; border-radius:999px; background:#eef4ff; color:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:800; }
    .axis-strip { margin-top:16px; border:1px solid var(--line); border-radius:8px; padding:14px; background:#fff; }
    .axis-list { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px 12px; margin-top:10px; }
    .axis-item { color:var(--muted); font-size:14px; }
    .timeline { display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:6px; }
    .time-item { min-width:126px; border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; }
    .time-item strong { display:block; color:var(--ink); }
    .time-item span { color:var(--muted); font-size:13px; }
    .report-block { background:#fff; border:1px solid var(--line); border-radius:8px; padding:22px; box-shadow:0 8px 28px rgba(60,64,67,.08); margin-bottom:16px; }
    .content strong, .report-block strong { color:#174ea6; font-weight:800; }
    .report-highlight { background:linear-gradient(transparent 58%, rgba(251,188,5,.35) 58%); padding:0 2px; }
    #scoreChart .content { border-top:0; padding-top:0; margin-top:0; }
    #scoreChart .score-chart { height:100%; display:flex; flex-direction:column; justify-content:center; }
    .report-image { width:100%; max-height:320px; object-fit:cover; border-radius:8px; border:1px solid var(--line); margin:8px 0 14px; }
    .button { border:0; border-radius:6px; background:var(--blue); color:#fff; font:inherit; font-weight:700; padding:13px 18px; cursor:pointer; text-decoration:none; display:inline-flex; justify-content:center; align-items:center; min-height:46px; }
    .button.secondary { background:#fff; color:var(--blue); border:1px solid var(--line); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; }
    .muted { color:var(--muted); font-size:14px; }
    .error { color:#d93025; font-weight:700; }
    .hidden { display:none !important; }
    @media (max-width:720px) { main{padding:16px 12px 44px}.hero,.section{padding:18px}.grid,.score-snapshot,.guide,.diagnosis-grid{grid-template-columns:1fr}.axis-list{grid-template-columns:repeat(2,minmax(0,1fr))}.button{width:100%}.radar{max-width:100%} }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1 id="title">檢測報告</h1>
      <p id="subtitle">正在讀取你的檢測結果...</p>
      <p class="muted" id="meta"></p>
      <div class="actions hidden" id="topActions"></div>
    </section>

    <section class="section hidden" id="scoreSection">
      <h2>分數總覽</h2>
      <p>每一項滿分 100 分。分數越接近 100，代表這一塊的資料、決定與安排越明確；自己處理時比較不需要反覆確認，身邊重要的人在必要時也比較能接手。</p>
      <div class="score-snapshot">
        <div id="scoreChart"></div>
        <div class="score-list" id="scores"></div>
      </div>
      <div id="lifeOrderGuide"></div>
    </section>

    <section class="section hidden" id="contentSection">
      <h2>診斷內容</h2>
      <div id="matchedContent"></div>
    </section>

    <section class="section hidden" id="blocksSection">
      <div id="blocks"></div>
    </section>

    <section class="section" id="loading">載入中...</section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const isLocalPreview = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const tenant = (params.get('tenant') || params.get('t') || (isLocalPreview ? 'dm-test' : '')).toLowerCase();
    const projectCode = (params.get('p') || 'P01').toUpperCase();
    const qrid = params.get('qrid') || params.get('quizResultId') || params.get('rid') || '';
    const apiBase = isLocalPreview ? 'https://dm-booking-saas.vercel.app/api' : '/api';

    function escapeHtml(value) {
      return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function api(action, payload) {
      return fetch(apiBase + '?action=' + encodeURIComponent(action) + '&tenant=' + encodeURIComponent(tenant), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ projectCode, qrid }, payload || {}))
      }).then(function (res) { return res.json(); });
    }

    function bookingUrl() {
      return '/booking?tenant=' + encodeURIComponent(tenant) + '&p=' + encodeURIComponent(projectCode) + '&qrid=' + encodeURIComponent(qrid);
    }

    function appendReportParams(url, content) {
      const fields = Array.isArray(content.appendFields) && content.appendFields.length
        ? content.appendFields
        : ['tenant', 'p', 'qrid'];
      if (!content.appendParams) return url;
      try {
        const result = new URL(url, location.origin);
        const report = window.__reportResult || {};
        const values = {
          tenant: tenant,
          p: projectCode,
          qrid: qrid,
          name: report.clientName || '',
          email: report.clientEmail || ''
        };
        fields.forEach(function (key) {
          if (values[key]) result.searchParams.set(key, values[key]);
        });
        return result.pathname.startsWith('/') && result.origin === location.origin ? result.pathname + result.search + result.hash : result.href;
      } catch (_error) {
        return url;
      }
    }

    function reportLinkAttrs(block, href, label) {
      return ' href="' + escapeHtml(href || '#') + '" data-block-key="' + escapeHtml(block.blockKey || '') + '" data-block-type="' + escapeHtml(block.blockType || '') + '" data-link-label="' + escapeHtml(label || block.title || '') + '" onclick="return followReportLink(event,this)"';
    }

    function followReportLink(event, link) {
      event.preventDefault();
      const href = link.href;
      api('trackReportClick', {
        blockKey: link.dataset.blockKey || '',
        blockType: link.dataset.blockType || 'link',
        label: link.dataset.linkLabel || link.textContent || '',
        targetUrl: href
      }).catch(function () {}).finally(function () {
        location.href = href;
      });
      return false;
    }

    function renderInlineText(value) {
      return escapeHtml(value).replace(/\*\*([^*]+)\*\*/g, '<strong class="report-highlight">$1</strong>');
    }

    function renderRichText(value) {
      const text = String(value || '').replace(/\r\n/g, '\n').trim();
      if (!text) return '';
      return text.split(/\n{2,}/).map(function (part) {
        const paragraph = part.replace(/\n+/g, ' ').replace(/\s{2,}/g, ' ').trim();
        return paragraph ? '<p>' + renderInlineText(paragraph) + '</p>' : '';
      }).join('');
    }

    function scoreItems(summary) {
      const scores = summary.scores || {};
      const maxScores = summary.max_scores || {};
      const displayScores = summary.display_scores || {};
      const displayMaxScores = summary.display_max_scores || {};
      const dimensions = Array.isArray(summary.dimensions) ? summary.dimensions : [];
      const keys = dimensions.length ? dimensions.map(function (item) { return item.key; }) : Object.keys(scores);
      return keys.filter(Boolean).map(function (key) {
        const dim = dimensions.find(function (item) { return item.key === key; }) || {};
        const score = Number(scores[key] || 0);
        const max = Number(dim.maxScore || maxScores[key] || 0);
        const displayScore = displayScores[key] === undefined ? score : displayScores[key];
        const displayMax = displayMaxScores[key] === undefined ? max : displayMaxScores[key];
        return {
          key: key,
          name: dim.name || key,
          score: score,
          max: max,
          displayScore: displayScore,
          displayMax: displayMax,
          pct: max > 0 ? Math.max(0, Math.min(1, score / max)) : 0
        };
      });
    }

    function renderScores(summary, settings) {
      const chartTarget = document.getElementById('scoreChart');
      if (chartTarget) chartTarget.innerHTML = !settings || settings.show_chart !== false ? renderRadarChart(summary, { title: '人生秩序雷達圖' }) : '';
      if (settings && settings.show_score_cards === false) return;
      const items = scoreItems(summary);
      if (!items.length) return;
      document.getElementById('scoreSection').classList.remove('hidden');
      const descriptions = {
        external: '外在秩序牽涉物品、空間、文件、帳號、密碼、保單、帳戶與資產資料。這一塊越明確，日常事情越容易一次處理完。',
        internal: '內在秩序牽涉關係、願望、價值觀與優先順序。這一塊越明確，你越容易知道哪些事要先安排，哪些責任需要重新分配。',
        continuity: '延續秩序牽涉家人接手、寵物照顧、百年安排、重要紀錄與想留下的心意。這一塊越明確，臨時變動來臨時，身邊的人越容易照著你的意思處理。'
      };
      document.getElementById('scores').innerHTML = items.map(function (item) {
        return '<div class="score"><div class="score-head"><h3>' + escapeHtml(item.name) + '</h3><span class="score-value">' + item.displayScore + (item.displayMax ? '/' + item.displayMax : '') + '</span></div><div class="meter"><span style="width:' + Math.round(item.pct * 100) + '%"></span></div><p>' + escapeHtml(descriptions[item.key] || item.description || '') + '</p></div>';
      }).join('');
      renderLifeOrderGuide(items);
    }


    function renderLifeOrderGuide(items) {
      const target = document.getElementById('lifeOrderGuide');
      if (!target) return;
      const axisNames = (items || []).map(function (item, index) { return '<span class="axis-item">' + (index + 1) + ' ' + escapeHtml(item.name) + '</span>'; }).join('');
      target.innerHTML = '<div class="guide">' +
        '<article class="guide-box"><h3>如何閱讀這張圖</h3><div class="guide-steps">' +
          '<div class="guide-step"><span class="step-no">1</span><p><strong>先看形狀。</strong> 雷達圖不是要追求完美圓，而是看哪些面向明顯凹下去，哪些面向已經能支撐你。</p></div>' +
          '<div class="guide-step"><span class="step-no">2</span><p><strong>再看落差。</strong> 同樣 60 分，有些是已經能用但還沒固定，有些是遇到臨時狀況就會卡住。</p></div>' +
          '<div class="guide-step"><span class="step-no">3</span><p><strong>最後決定順序。</strong> 先處理最容易造成生活摩擦、家人接手困難或長期懸念的那一塊。</p></div>' +
        '</div></article>' +
        '<article class="guide-box"><h3>分數說明</h3><div class="legend">' +
          '<div class="legend-row"><span class="legend-chip" style="background:#4f9a8a"></span><p><strong>80-100</strong> 已有秩序，可以維護與交代。</p></div>' +
          '<div class="legend-row"><span class="legend-chip" style="background:#88a957"></span><p><strong>60-79</strong> 有基礎，但需要固定成做法。</p></div>' +
          '<div class="legend-row"><span class="legend-chip" style="background:#e6a23c"></span><p><strong>30-59</strong> 需要關注，先建立基本秩序。</p></div>' +
          '<div class="legend-row"><span class="legend-chip" style="background:#dd6b75"></span><p><strong>0-29</strong> 失序感較高，優先處理最卡的一件事。</p></div>' +
        '</div></article>' +
      '</div>' +
      '<div class="axis-strip"><h3>11 個面向</h3><div class="axis-list">' + axisNames + '</div></div>' +
      '<div class="axis-strip"><h3>生命時間軸</h3><div class="timeline">' +
        '<div class="time-item"><strong>0-20歲</strong><span>探索期</span></div>' +
        '<div class="time-item"><strong>20-30歲</strong><span>奠基期</span></div>' +
        '<div class="time-item"><strong>30-45歲</strong><span>成長期</span></div>' +
        '<div class="time-item"><strong>45-60歲</strong><span>收穫期</span></div>' +
        '<div class="time-item"><strong>60-75歲</strong><span>豐盛期</span></div>' +
        '<div class="time-item"><strong>75歲以上</strong><span>傳承期</span></div>' +
      '</div></div>';
    }

    function polygonPoints(items, radius, center) {
      const count = Math.max(items.length, 3);
      return items.map(function (item, index) {
        const angle = -Math.PI / 2 + (Math.PI * 2 * index / count);
        const distance = radius * item.pct;
        return {
          x: center + Math.cos(angle) * distance,
          y: center + Math.sin(angle) * distance,
          axisX: center + Math.cos(angle) * radius,
          axisY: center + Math.sin(angle) * radius,
          labelX: center + Math.cos(angle) * (radius + 22),
          labelY: center + Math.sin(angle) * (radius + 22),
          value: item
        };
      });
    }

    function renderRadarChart(summary, config) {
      const items = scoreItems(summary);
      if (items.length < 3) return '';
      const center = 160;
      const radius = 104;
      const rings = [0.25, 0.5, 0.75, 1].map(function (level) {
        const points = polygonPoints(items.map(function () { return { pct: level }; }), radius, center);
        return '<polygon class="radar-grid" points="' + points.map(function (point) { return point.x.toFixed(1) + ',' + point.y.toFixed(1); }).join(' ') + '"></polygon>';
      }).join('');
      const points = polygonPoints(items, radius, center);
      const shape = points.map(function (point) { return point.x.toFixed(1) + ',' + point.y.toFixed(1); }).join(' ');
      const axes = points.map(function (point) { return '<line class="radar-axis" x1="' + center + '" y1="' + center + '" x2="' + point.axisX.toFixed(1) + '" y2="' + point.axisY.toFixed(1) + '"></line>'; }).join('');
      const labels = points.map(function (point) {
        const anchor = point.labelX < center - 8 ? 'end' : (point.labelX > center + 8 ? 'start' : 'middle');
        return '<text class="radar-label" x="' + point.labelX.toFixed(1) + '" y="' + point.labelY.toFixed(1) + '" text-anchor="' + anchor + '" dominant-baseline="middle">' + escapeHtml(point.value.name) + '</text>';
      }).join('');
      const dots = points.map(function (point) { return '<circle class="radar-dot" cx="' + point.x.toFixed(1) + '" cy="' + point.y.toFixed(1) + '" r="4"></circle>'; }).join('');
      return '<article class="content score-chart"><h2>' + escapeHtml(config.title || '多面向分數圖') + '</h2><div class="chart-wrap"><svg class="radar" viewBox="0 0 320 320" role="img" aria-label="多面向分數雷達圖">' + rings + axes + '<polygon class="radar-shape" points="' + shape + '"></polygon>' + dots + labels + '</svg></div></article>';
    }

    function renderAgeContent(ageContent) {
      if (!ageContent || (!ageContent.title && !ageContent.body && !ageContent.actionText)) return '';
      return '<div class="age-content">' +
        '<p class="age-kicker">' + escapeHtml(ageContent.ageGroupLabel || '目前年齡層') + '補充</p>' +
        (ageContent.title ? '<h4>' + escapeHtml(ageContent.title) + '</h4>' : '') +
        renderRichText(ageContent.body || '') +
        (ageContent.actionText ? '<p><strong>下一步：</strong>' + renderInlineText(ageContent.actionText) + '</p>' : '') +
      '</div>';
    }

    function renderMatchedContent(items) {
      if (!Array.isArray(items) || !items.length) return;
      document.getElementById('contentSection').classList.remove('hidden');
      const order = ['low', 'mid', 'high'];
      const labels = { low: '目前最需要注意', mid: '已有基礎，下一步要固定', high: '狀態清楚，適合整理成可交代' };
      const groups = order.map(function (key) { return { key: key, items: items.filter(function (item) { return item.rangeKey === key; }) }; }).filter(function (group) { return group.items.length; });
      document.getElementById('matchedContent').innerHTML = groups.map(function (group) {
        const cards = group.items.map(function (item) {
          const heading = item.dimensionName || item.dimensionKey || '診斷';
          return '<article class="diagnosis-card"><h4>' + escapeHtml(heading) + '</h4>' +
            (item.subtitle ? '<p><strong>' + escapeHtml(item.subtitle) + '</strong></p>' : '') +
            renderRichText(item.body || '') +
          '</article>';
        }).join('');
        return '<section class="diagnosis-group"><h3>' + escapeHtml(labels[group.key] || group.items[0].label || '診斷') + '</h3><div class="diagnosis-grid">' + cards + '</div>' + renderAgeGroupSummary(group) + '</section>';
      }).join('');
    }

    function renderAgeGroupSummary(group) {
      const withAge = (group.items || []).filter(function (item) { return item.ageContent && (item.ageContent.body || item.ageContent.actionText); });
      if (!withAge.length) return '';
      const first = withAge[0].ageContent || {};
      const names = withAge.map(function (item) { return item.dimensionName || item.dimensionKey; }).filter(Boolean).join('、');
      const actions = withAge.slice(0, 5).map(function (item) {
        const action = item.ageContent && item.ageContent.actionText ? item.ageContent.actionText : '';
        return action ? '<li><strong>' + escapeHtml(item.dimensionName || item.dimensionKey || '') + '：</strong>' + renderInlineText(action.replace(/^[^：]{2,18}：/, '')) + '</li>' : '';
      }).join('');
      return '<article class="age-content"><p class="age-kicker">' + escapeHtml(first.ageGroupLabel || '目前年齡層') + '補充</p>' +
        '<h4>' + escapeHtml((first.ageGroupLabel || '這個階段') + '，先看這幾個面向怎麼落地') + '</h4>' +
        '<p>這一組落在「' + escapeHtml(group.items[0].label || '') + '」的面向包含：' + escapeHtml(names) + '。年齡補充不是重新評分，而是幫你判斷同樣的分數，放在現在的人生階段，哪些事情比較值得先安排。</p>' +
        (actions ? '<ul class="age-action-list">' + actions + '</ul>' : '') +
      '</article>';
    }

    function reportTemplateVars(summary) {
      const scores = summary.display_scores || summary.scores || {};
      const levels = summary.levels || {};
      return {
        external_score: scores.external ?? '',
        internal_score: scores.internal ?? '',
        continuity_score: scores.continuity ?? '',
        external_level: levels.external || '',
        internal_level: levels.internal || '',
        continuity_level: levels.continuity || '',
        main_order: summary.main_order_title || summary.main_order || '',
        main_order_title: summary.main_order_title || '',
        main_order_score: summary.main_order_score ?? '',
        main_order_level: summary.main_order_level || '',
        daily_scenario_copy: summary.daily_scenario_copy || ''
      };
    }

    function applyReportTemplates(value) {
      const vars = reportTemplateVars(window.__scoreSummary || {});
      if (typeof value === 'string') return value.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, function (_match, key) { return String(vars[key] ?? ''); });
      if (Array.isArray(value)) return value.map(applyReportTemplates);
      if (value && typeof value === 'object') {
        const next = {};
        Object.keys(value).forEach(function (key) { next[key] = applyReportTemplates(value[key]); });
        return next;
      }
      return value;
    }

    function reportBlockVisible(block) {
      const rule = block.visibilityRule || block.visibility_rule || {};
      if (!rule || typeof rule !== 'object' || !Object.keys(rule).length) return true;
      const summary = window.__scoreSummary || {};
      const mainOrder = summary.main_order || '';
      if (rule.mainOrder && String(rule.mainOrder) !== String(mainOrder)) return false;
      if (rule.main_order && String(rule.main_order) !== String(mainOrder)) return false;
      if (rule.level && String(rule.level) !== String(summary.main_order_level || '')) return false;
      if (rule.dimensionKey && !Object.prototype.hasOwnProperty.call(summary.display_scores || summary.scores || {}, rule.dimensionKey)) return false;
      if (rule.rangeKey) {
        const dimensionKey = rule.dimensionKey || rule.dimension_key || mainOrder;
        if (String((summary.matched_ranges || {})[dimensionKey] || '') !== String(rule.rangeKey)) return false;
      }
      return true;
    }

    function prepareReportBlock(block) {
      return applyReportTemplates(block || {});
    }

    function renderBlocks(blocks) {
      const filtered = (blocks || [])
        .filter(function (block) { return !['score_table', 'score_range_content'].includes(block.blockType); })
        .filter(reportBlockVisible)
        .map(prepareReportBlock);
      if (!filtered.length) return;
      document.getElementById('blocksSection').classList.remove('hidden');
      document.getElementById('blocks').innerHTML = filtered.map(function (block) {
        const content = block.content || {};
        let html = '';
        if (block.blockType === 'score_chart') return renderRadarChart(window.__scoreSummary || {}, Object.assign({ title: block.title }, content));
        if (block.blockType === 'heading') html = '<h2>' + escapeHtml(content.text || block.title || '') + '</h2>';
        else if (block.blockType === 'text') html = (block.title ? '<h2>' + escapeHtml(block.title) + '</h2>' : '') + renderRichText(content.text || '');
        else if (block.blockType === 'list') html = (block.title ? '<h2>' + escapeHtml(block.title) + '</h2>' : '') + '<ul>' + (content.items || []).map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul>';
        else if (block.blockType === 'image') html = (block.title ? '<h2>' + escapeHtml(block.title) + '</h2>' : '') + '<img class="report-image" src="' + escapeHtml(content.url || '') + '" alt="' + escapeHtml(content.alt || '') + '">';
        else if (block.blockType === 'button' || block.blockType === 'link') {
          const label = content.label || block.title || '了解更多';
          const href = appendReportParams(content.url || '#', content);
          html = '<p><a class="button secondary"' + reportLinkAttrs(block, href, label) + '>' + escapeHtml(label) + '</a></p>';
        } else if (block.blockType === 'booking_cta') {
          const label = content.label || '預約一對一諮詢';
          const href = content.urlMode === 'custom' && content.url ? appendReportParams(content.url, content) : bookingUrl();
          html = '<p><a class="button"' + reportLinkAttrs(block, href, label) + '>' + escapeHtml(label) + '</a></p>';
        }
        return html ? '<article class="report-block">' + html + '</article>' : '';
      }).join('');
    }

    function boot() {
      if (!tenant || !qrid) {
        document.getElementById('loading').innerHTML = '<span class="error">報告連結缺少 tenant 或 qrid。</span>';
        return;
      }
      api('getQuizResult', {}).then(function (res) {
        if (!res.success) throw new Error(res.message || '找不到測驗結果。');
        window.__reportResult = res;
        const snapshot = res.reportSnapshot || {};
        const settings = snapshot.result_settings || {};
        const summary = res.scoreSummary || snapshot.score_summary || {};
        document.getElementById('title').textContent = settings.title || '你的檢測報告';
        document.getElementById('subtitle').textContent = settings.subtitle || (res.clientName ? res.clientName + '，以下是你的檢測結果。' : '以下是你的檢測結果。');
        document.getElementById('meta').textContent = '版本 ' + (res.versionCode || '') + '｜' + new Date(res.submittedAt).toLocaleString('zh-TW', { hour12:false });
        document.getElementById('topActions').innerHTML = '';
        window.__scoreSummary = summary;
        const reportBlocks = (snapshot.blocks || []).slice();
        renderScores(summary, settings);
        renderMatchedContent(snapshot.matched_content || []);
        renderBlocks(reportBlocks);
        document.getElementById('loading').classList.add('hidden');
      }).catch(function (error) {
        document.getElementById('loading').innerHTML = '<span class="error">' + escapeHtml(error.message || '載入失敗') + '</span>';
      });
    }
    boot();
  </script>
</body>
</html>
