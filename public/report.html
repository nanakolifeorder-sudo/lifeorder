<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>檢測報告</title>
  <style>
    :root { --blue:#1a73e8; --green:#188038; --ink:#202124; --muted:#5f6368; --line:#dadce0; --soft:#f8fafc; --bg:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,'Noto Sans TC',sans-serif; line-height:1.7; }
    main { max-width:980px; margin:0 auto; padding:28px 16px 64px; }
    .hero, .section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:26px; box-shadow:0 8px 28px rgba(60,64,67,.08); margin-bottom:16px; }
    h1 { font-size:30px; margin:0 0 8px; color:var(--blue); }
    h2 { font-size:22px; margin:0 0 12px; }
    h3 { font-size:18px; margin:0 0 6px; }
    p { color:var(--muted); margin:0 0 10px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .score { border:1px solid var(--line); border-radius:8px; padding:16px; background:var(--soft); }
    .chart-wrap { display:grid; grid-template-columns:minmax(260px,420px) minmax(0,1fr); gap:20px; align-items:center; }
    .radar { width:100%; max-width:420px; aspect-ratio:1; }
    .radar-grid { fill:none; stroke:#d7dee8; stroke-width:1; }
    .radar-axis { stroke:#e5eaf1; stroke-width:1; }
    .radar-shape { fill:rgba(26,115,232,.22); stroke:var(--blue); stroke-width:2.5; }
    .radar-dot { fill:var(--blue); stroke:#fff; stroke-width:2; }
    .radar-label { fill:var(--ink); font-size:12px; font-weight:700; }
    .legend { display:grid; gap:10px; }
    .legend-item { border:1px solid var(--line); border-radius:8px; background:var(--soft); padding:10px 12px; }
    .legend-item strong { display:flex; justify-content:space-between; gap:12px; color:var(--ink); }
    .score-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
    .score-value { font-size:28px; font-weight:800; color:var(--blue); }
    .meter { height:8px; background:#e8eaed; border-radius:999px; overflow:hidden; margin-top:10px; }
    .meter span { display:block; height:100%; background:var(--green); width:0; }
    .content { border-top:1px solid var(--line); padding-top:16px; margin-top:16px; }
    .report-image { width:100%; max-height:320px; object-fit:cover; border-radius:8px; border:1px solid var(--line); margin:8px 0 14px; }
    .button { border:0; border-radius:6px; background:var(--blue); color:#fff; font:inherit; font-weight:700; padding:13px 18px; cursor:pointer; text-decoration:none; display:inline-flex; justify-content:center; align-items:center; min-height:46px; }
    .button.secondary { background:#fff; color:var(--blue); border:1px solid var(--line); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; }
    .muted { color:var(--muted); font-size:14px; }
    .error { color:#d93025; font-weight:700; }
    .hidden { display:none !important; }
    @media (max-width:720px) { main{padding:16px 12px 44px}.hero,.section{padding:18px}.grid,.chart-wrap{grid-template-columns:1fr}.button{width:100%}.radar{max-width:100%} }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1 id="title">檢測報告</h1>
      <p id="subtitle">正在讀取你的檢測結果...</p>
      <p class="muted" id="meta"></p>
      <div class="actions hidden" id="topActions"></div>
    </section>

    <section class="section hidden" id="scoreSection">
      <h2>分數總覽</h2>
      <div class="grid" id="scores"></div>
    </section>

    <section class="section hidden" id="contentSection">
      <h2>診斷內容</h2>
      <div id="matchedContent"></div>
    </section>

    <section class="section hidden" id="blocksSection">
      <div id="blocks"></div>
    </section>

    <section class="section" id="loading">載入中...</section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const isLocalPreview = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const tenant = (params.get('tenant') || params.get('t') || (isLocalPreview ? 'dm-test' : '')).toLowerCase();
    const projectCode = (params.get('p') || 'P01').toUpperCase();
    const qrid = params.get('qrid') || params.get('quizResultId') || params.get('rid') || '';
    const apiBase = isLocalPreview ? 'https://dm-booking-saas.vercel.app/api' : '/api';

    function escapeHtml(value) {
      return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function api(action, payload) {
      return fetch(apiBase + '?action=' + encodeURIComponent(action) + '&tenant=' + encodeURIComponent(tenant), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ projectCode, qrid }, payload || {}))
      }).then(function (res) { return res.json(); });
    }

    function bookingUrl() {
      return '/booking?tenant=' + encodeURIComponent(tenant) + '&p=' + encodeURIComponent(projectCode) + '&qrid=' + encodeURIComponent(qrid);
    }

    function appendReportParams(url, content) {
      const fields = Array.isArray(content.appendFields) && content.appendFields.length
        ? content.appendFields
        : ['tenant', 'p', 'qrid'];
      if (!content.appendParams) return url;
      try {
        const result = new URL(url, location.origin);
        const report = window.__reportResult || {};
        const values = {
          tenant: tenant,
          p: projectCode,
          qrid: qrid,
          name: report.clientName || '',
          email: report.clientEmail || ''
        };
        fields.forEach(function (key) {
          if (values[key]) result.searchParams.set(key, values[key]);
        });
        return result.pathname.startsWith('/') && result.origin === location.origin ? result.pathname + result.search + result.hash : result.href;
      } catch (_error) {
        return url;
      }
    }

    function reportLinkAttrs(block, href, label) {
      return ' href="' + escapeHtml(href || '#') + '" data-block-key="' + escapeHtml(block.blockKey || '') + '" data-block-type="' + escapeHtml(block.blockType || '') + '" data-link-label="' + escapeHtml(label || block.title || '') + '" onclick="return followReportLink(event,this)"';
    }

    function followReportLink(event, link) {
      event.preventDefault();
      const href = link.href;
      api('trackReportClick', {
        blockKey: link.dataset.blockKey || '',
        blockType: link.dataset.blockType || 'link',
        label: link.dataset.linkLabel || link.textContent || '',
        targetUrl: href
      }).catch(function () {}).finally(function () {
        location.href = href;
      });
      return false;
    }

    function scoreItems(summary) {
      const scores = summary.scores || {};
      const maxScores = summary.max_scores || {};
      const displayScores = summary.display_scores || {};
      const displayMaxScores = summary.display_max_scores || {};
      const dimensions = Array.isArray(summary.dimensions) ? summary.dimensions : [];
      const keys = dimensions.length ? dimensions.map(function (item) { return item.key; }) : Object.keys(scores);
      return keys.filter(Boolean).map(function (key) {
        const dim = dimensions.find(function (item) { return item.key === key; }) || {};
        const score = Number(scores[key] || 0);
        const max = Number(dim.maxScore || maxScores[key] || 0);
        const displayScore = displayScores[key] === undefined ? score : displayScores[key];
        const displayMax = displayMaxScores[key] === undefined ? max : displayMaxScores[key];
        return {
          key: key,
          name: dim.name || key,
          score: score,
          max: max,
          displayScore: displayScore,
          displayMax: displayMax,
          pct: max > 0 ? Math.max(0, Math.min(1, score / max)) : 0
        };
      });
    }

    function renderScores(summary) {
      const items = scoreItems(summary);
      if (!items.length) return;
      document.getElementById('scoreSection').classList.remove('hidden');
      document.getElementById('scores').innerHTML = items.map(function (item) {
        return '<div class="score"><div class="score-head"><h3>' + escapeHtml(item.name) + '</h3><span class="score-value">' + item.displayScore + (item.displayMax ? '/' + item.displayMax : '') + '</span></div><div class="meter"><span style="width:' + Math.round(item.pct * 100) + '%"></span></div></div>';
      }).join('');
    }

    function polygonPoints(items, radius, center) {
      const count = Math.max(items.length, 3);
      return items.map(function (item, index) {
        const angle = -Math.PI / 2 + (Math.PI * 2 * index / count);
        const distance = radius * item.pct;
        return {
          x: center + Math.cos(angle) * distance,
          y: center + Math.sin(angle) * distance,
          axisX: center + Math.cos(angle) * radius,
          axisY: center + Math.sin(angle) * radius,
          labelX: center + Math.cos(angle) * (radius + 22),
          labelY: center + Math.sin(angle) * (radius + 22),
          value: item
        };
      });
    }

    function renderRadarChart(summary, config) {
      const items = scoreItems(summary);
      if (items.length < 3) return '';
      const center = 160;
      const radius = 104;
      const rings = [0.25, 0.5, 0.75, 1].map(function (level) {
        const points = polygonPoints(items.map(function () { return { pct: level }; }), radius, center);
        return '<polygon class="radar-grid" points="' + points.map(function (point) { return point.x.toFixed(1) + ',' + point.y.toFixed(1); }).join(' ') + '"></polygon>';
      }).join('');
      const points = polygonPoints(items, radius, center);
      const shape = points.map(function (point) { return point.x.toFixed(1) + ',' + point.y.toFixed(1); }).join(' ');
      const axes = points.map(function (point) { return '<line class="radar-axis" x1="' + center + '" y1="' + center + '" x2="' + point.axisX.toFixed(1) + '" y2="' + point.axisY.toFixed(1) + '"></line>'; }).join('');
      const labels = points.map(function (point) {
        const anchor = point.labelX < center - 8 ? 'end' : (point.labelX > center + 8 ? 'start' : 'middle');
        return '<text class="radar-label" x="' + point.labelX.toFixed(1) + '" y="' + point.labelY.toFixed(1) + '" text-anchor="' + anchor + '" dominant-baseline="middle">' + escapeHtml(point.value.name) + '</text>';
      }).join('');
      const dots = points.map(function (point) { return '<circle class="radar-dot" cx="' + point.x.toFixed(1) + '" cy="' + point.y.toFixed(1) + '" r="4"></circle>'; }).join('');
      const legend = items.map(function (item) {
        return '<div class="legend-item"><strong><span>' + escapeHtml(item.name) + '</span><span>' + item.score + (item.max ? '/' + item.max : '') + '</span></strong><div class="meter"><span style="width:' + Math.round(item.pct * 100) + '%"></span></div></div>';
      }).join('');
      return '<article class="content"><h2>' + escapeHtml(config.title || '多面向分數圖') + '</h2><div class="chart-wrap"><svg class="radar" viewBox="0 0 320 320" role="img" aria-label="多面向分數雷達圖">' + rings + axes + '<polygon class="radar-shape" points="' + shape + '"></polygon>' + dots + labels + '</svg><div class="legend">' + legend + '</div></div></article>';
    }

    function renderMatchedContent(items) {
      if (!Array.isArray(items) || !items.length) return;
      document.getElementById('contentSection').classList.remove('hidden');
      document.getElementById('matchedContent').innerHTML = items.map(function (item) {
        return '<article class="content">' +
          '<h3>' + escapeHtml(item.dimensionName || item.dimensionKey || '診斷') + '</h3>' +
          (item.imageUrl ? '<img class="report-image" src="' + escapeHtml(item.imageUrl) + '" alt="">' : '') +
          (item.title ? '<h3>' + escapeHtml(item.title) + '</h3>' : '') +
          (item.subtitle ? '<p><strong>' + escapeHtml(item.subtitle) + '</strong></p>' : '') +
          (item.body ? '<p>' + escapeHtml(item.body).replace(/\n/g, '<br>') + '</p>' : '') +
          '</article>';
      }).join('');
    }

    function renderBlocks(blocks) {
      const filtered = (blocks || []).filter(function (block) { return !['score_table', 'score_range_content'].includes(block.blockType); });
      if (!filtered.length) return;
      document.getElementById('blocksSection').classList.remove('hidden');
      document.getElementById('blocks').innerHTML = filtered.map(function (block) {
        const content = block.content || {};
        if (block.blockType === 'score_chart') return renderRadarChart(window.__scoreSummary || {}, Object.assign({ title: block.title }, content));
        if (block.blockType === 'heading') return '<h2>' + escapeHtml(content.text || block.title || '') + '</h2>';
        if (block.blockType === 'text') return '<p>' + escapeHtml(content.text || '').replace(/\n/g, '<br>') + '</p>';
        if (block.blockType === 'list') return '<ul>' + (content.items || []).map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul>';
        if (block.blockType === 'image') return '<img class="report-image" src="' + escapeHtml(content.url || '') + '" alt="' + escapeHtml(content.alt || '') + '">';
        if (block.blockType === 'button' || block.blockType === 'link') {
          const label = content.label || block.title || '了解更多';
          const href = appendReportParams(content.url || '#', content);
          return '<p><a class="button secondary"' + reportLinkAttrs(block, href, label) + '>' + escapeHtml(label) + '</a></p>';
        }
        if (block.blockType === 'booking_cta') {
          const label = content.label || '預約一對一諮詢';
          const href = content.urlMode === 'custom' && content.url ? appendReportParams(content.url, content) : bookingUrl();
          return '<p><a class="button"' + reportLinkAttrs(block, href, label) + '>' + escapeHtml(label) + '</a></p>';
        }
        return '';
      }).join('');
    }

    function boot() {
      if (!tenant || !qrid) {
        document.getElementById('loading').innerHTML = '<span class="error">報告連結缺少 tenant 或 qrid。</span>';
        return;
      }
      api('getQuizResult', {}).then(function (res) {
        if (!res.success) throw new Error(res.message || '找不到測驗結果。');
        window.__reportResult = res;
        const snapshot = res.reportSnapshot || {};
        const settings = snapshot.result_settings || {};
        const summary = res.scoreSummary || snapshot.score_summary || {};
        document.getElementById('title').textContent = settings.title || '你的檢測報告';
        document.getElementById('subtitle').textContent = settings.subtitle || (res.clientName ? res.clientName + '，以下是你的檢測結果。' : '以下是你的檢測結果。');
        document.getElementById('meta').textContent = '版本 ' + (res.versionCode || '') + '｜' + new Date(res.submittedAt).toLocaleString('zh-TW', { hour12:false });
        document.getElementById('topActions').innerHTML = '<a class="button" href="' + bookingUrl() + '" data-block-key="top-booking" data-block-type="booking_cta" data-link-label="' + escapeHtml(settings.booking_cta_label || '預約一對一諮詢') + '" onclick="return followReportLink(event,this)">' + escapeHtml(settings.booking_cta_label || '預約一對一諮詢') + '</a><a class="button secondary" href="/quiz?tenant=' + encodeURIComponent(tenant) + '&p=' + encodeURIComponent(projectCode) + '">重新檢測</a>';
        document.getElementById('topActions').classList.remove('hidden');
        window.__scoreSummary = summary;
        const reportBlocks = (snapshot.blocks || []).slice();
        if (settings.show_chart && !reportBlocks.some(function (block) { return block.blockType === 'score_chart'; })) {
          reportBlocks.unshift({ blockType: 'score_chart', title: '多面向分數圖', content: { chartType: 'radar' } });
        }
        renderScores(summary);
        renderMatchedContent(snapshot.matched_content || []);
        renderBlocks(reportBlocks);
        document.getElementById('loading').classList.add('hidden');
      }).catch(function (error) {
        document.getElementById('loading').innerHTML = '<span class="error">' + escapeHtml(error.message || '載入失敗') + '</span>';
      });
    }
    boot();
  </script>
</body>
</html>
