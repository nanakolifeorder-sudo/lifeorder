<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>付款完成｜人生秩序</title><style>:root{--ink:#16333a;--muted:#617177;--paper:#f7f1e4;--blue:#2d60b4;--line:#d8d0be}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',Arial,sans-serif;line-height:1.55}.wrap{width:min(620px,calc(100% - 32px));margin:80px auto}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:34px;box-shadow:0 10px 28px rgba(22,51,58,.08)}h1{font-size:30px;margin:0 0 12px}p{color:var(--muted)}a{display:inline-flex;margin-top:14px;padding:14px 20px;border-radius:6px;background:var(--blue);color:#fff;font-weight:800;text-decoration:none}.pending{color:#8a6518}.error{color:#b42318}.success-image{display:block;width:100%;max-height:280px;object-fit:cover;border-radius:6px;margin:0 0 22px}</style></head>
<body><main class="wrap"><section class="panel" id="content"><h1>正在確認付款結果</h1><p>請稍候，不要關閉此頁面。</p></section></main><script>
const content=document.getElementById('content');const token=new URLSearchParams(location.search).get('order')||'';const defaults={successTitle:'付款完成',successDescription:'人生秩序完整版測驗已為你開通。',successButtonLabel:'立即開始完整版測驗',successImageUrl:'',successImageAlt:''};
function escapeHtml(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function render(title,message,kind){content.innerHTML='<h1>'+escapeHtml(title)+'</h1><p class="'+escapeHtml(kind||'')+'">'+escapeHtml(message)+'</p>'}
async function settings(){try{const response=await fetch('/api?action=getPublicCheckoutPageSettings&tenant=lifeorder');const result=await response.json();return Object.assign({},defaults,result.success?result.settings||{}:{})}catch(_){return defaults}}
async function load(){const page=await settings();if(!token){render('找不到付款訂單','請回到付款頁面重新操作。','error');return}try{const response=await fetch('/api?action=getLifeOrderPayment&tenant=lifeorder&order='+encodeURIComponent(token));const result=await response.json();if(!result.success)throw new Error(result.message||'找不到付款訂單。');if(result.status==='paid'&&result.quizUrl){const image=page.successImageUrl?'<img class="success-image" src="'+escapeHtml(page.successImageUrl)+'" alt="'+escapeHtml(page.successImageAlt)+'">':'';content.innerHTML=image+'<h1>'+escapeHtml(page.successTitle)+'</h1><p>'+escapeHtml(page.successDescription)+'</p><a href="'+escapeHtml(result.quizUrl)+'">'+escapeHtml(page.successButtonLabel)+'</a>';return}if(result.status==='pending'){render('付款結果確認中','若剛完成轉帳或付款，請稍候片刻後重新整理此頁面。','pending');return}render('付款尚未完成','尚未收到成功付款通知，請確認付款狀態後再試一次。','error')}catch(error){render('付款結果確認中',error.message||'請稍後重新整理此頁面。','pending')}}load();
</script></body></html>
