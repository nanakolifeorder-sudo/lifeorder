<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>檢測測驗</title>
  <style>
    :root { --blue:#1a73e8; --green:#188038; --red:#d93025; --ink:#202124; --muted:#5f6368; --line:#dadce0; --soft:#f8fafc; --bg:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial,'Noto Sans TC',sans-serif; line-height:1.65; }
    main { max-width:900px; margin:0 auto; padding:28px 16px 56px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:24px; box-shadow:0 8px 28px rgba(60,64,67,.08); }
    .top { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
    h1 { font-size:28px; margin:0 0 6px; color:var(--blue); }
    h2 { font-size:20px; margin:0 0 12px; }
    p { color:var(--muted); margin:0 0 10px; }
    .badge { display:inline-flex; align-items:center; min-height:28px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:13px; white-space:nowrap; }
    .progress { height:8px; background:#eef2f7; border-radius:999px; overflow:hidden; margin:18px 0 22px; }
    .bar { width:0; height:100%; background:var(--blue); transition:width .18s ease; }
    label { display:block; font-weight:700; margin:14px 0 6px; }
    input, textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:12px; font:inherit; background:#fff; }
    textarea { min-height:96px; resize:vertical; }
    .field { margin:0 0 16px; }
    .choice { display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:6px; margin:8px 0; font-weight:400; cursor:pointer; }
    .choice input { width:auto; margin-top:5px; }
    .choice:has(input:checked) { border-color:var(--blue); background:#eef4ff; }
    .actions { display:flex; justify-content:space-between; gap:12px; margin-top:22px; }
    button, .button { border:0; border-radius:6px; background:var(--blue); color:#fff; font:inherit; font-weight:700; padding:12px 16px; cursor:pointer; text-decoration:none; display:inline-flex; justify-content:center; align-items:center; min-height:44px; }
    button.secondary { background:#fff; color:var(--blue); border:1px solid var(--line); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .hidden { display:none !important; }
    .error { color:var(--red); font-weight:700; }
    .success { color:var(--green); font-weight:700; }
    .stage-title { padding-bottom:12px; border-bottom:1px solid var(--line); margin-bottom:12px; }
    @media (max-width:640px) { main{padding:16px 12px 40px}.panel{padding:18px}.top{display:block}.badge{margin-top:8px}.actions{flex-direction:column-reverse}button,.button{width:100%} }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <div class="top">
        <div>
          <h1 id="title">檢測測驗</h1>
          <p id="subtitle">正在讀取題目...</p>
        </div>
      </div>

      <div id="loading">載入中...</div>

      <form id="quizForm" class="hidden">
        <section id="identityPanel">
          <h2>基本資料</h2>
          <div class="field"><label for="clientName">姓名 *</label><input id="clientName" autocomplete="name" required></div>
          <div class="field"><label for="clientEmail">Email *</label><input id="clientEmail" type="email" autocomplete="email" required></div>
          <div class="field"><label for="clientPhone">電話</label><input id="clientPhone" autocomplete="tel"></div>
          <div class="field"><label for="clientAge">年齡</label><input id="clientAge" inputmode="numeric" autocomplete="off" placeholder="例：38"></div>
          <div class="field"><label for="clientOccupation">職業</label><input id="clientOccupation" autocomplete="organization-title" placeholder="例：自由工作者、企業主、上班族"></div>
          <div class="field" id="accessCodeField"><label for="accessCode">折扣碼 / 重測碼</label><input id="accessCode" autocomplete="off" placeholder="已有代碼再填寫"></div>
        </section>

        <div class="progress"><div class="bar" id="bar"></div></div>
        <section id="questionPanel"></section>
        <div class="actions">
          <button type="button" class="secondary hidden" id="prevBtn">上一階段</button>
          <button type="button" class="hidden" id="nextBtn">下一階段</button>
          <button type="submit" id="submitBtn">送出檢測</button>
        </div>
      </form>

      <section id="donePanel" class="hidden"></section>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const isLocalPreview = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const tenant = (params.get('tenant') || params.get('t') || (isLocalPreview ? 'dm-test' : '')).toLowerCase();
    const projectCode = (params.get('p') || 'P01').toUpperCase();
    const versionCode = params.get('v') || params.get('version') || '';
    const apiBase = isLocalPreview ? 'https://dm-booking-saas.vercel.app/api' : '/api';
    let config = null;
    let stages = [];
    let currentStage = 0;
    const savedAnswers = {};

    function api(action, payload) {
      return fetch(apiBase + '?action=' + encodeURIComponent(action) + '&tenant=' + encodeURIComponent(tenant), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ projectCode, versionCode }, payload || {}))
      }).then(function (res) { return res.json(); });
    }

    function escapeHtml(value) {
      return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function cleanOptionLabel(value) {
      return String(value || '').trim().replace(/[。．.]$/g, '');
    }

    function isFreeVersion() {
      const code = String(config?.versionCode || versionCode || 'A').trim().toUpperCase();
      const text = [code, config?.version?.name, config?.version?.description].map(function (value) { return String(value || '').toLowerCase(); }).join(' ');
      if (['A', 'FREE', 'TRIAL', 'SIMPLE'].includes(code)) return true;
      return /(免費|簡易|free|trial|simple)/i.test(text) && !/(980|付費|完整版|完整|paid|full|premium|pro)/i.test(text);
    }

    function groupStages() {
      stages = [{
        stage_key: '1',
        title: '測驗題目',
        description: '',
        questions: (config.questions || []).slice()
      }].filter(function (stage) { return stage.questions.length; });
    }

    function inputName(question) { return 'q_' + question.id; }
    function answerKey(question) { return String(question.id); }

    function saveCurrentStageAnswers() {
      const stage = stages[currentStage];
      if (!stage) return;
      (stage.questions || []).forEach(function (question) {
        const nodes = Array.from(document.querySelectorAll('[name="' + inputName(question) + '"]'));
        if (!nodes.length) return;
        const key = answerKey(question);
        if (question.type === 'multiple') {
          savedAnswers[key] = nodes.filter(function (node) { return node.checked; }).map(function (node) { return node.value; });
        } else if (question.type === 'single') {
          const selected = nodes.find(function (node) { return node.checked; });
          savedAnswers[key] = selected ? selected.value : '';
        } else {
          savedAnswers[key] = nodes[0].value || '';
        }
      });
    }

    function restoreStageAnswers() {
      const stage = stages[currentStage];
      if (!stage) return;
      (stage.questions || []).forEach(function (question) {
        const key = answerKey(question);
        if (!Object.prototype.hasOwnProperty.call(savedAnswers, key)) return;
        const value = savedAnswers[key];
        const nodes = Array.from(document.querySelectorAll('[name="' + inputName(question) + '"]'));
        nodes.forEach(function (node) {
          if (node.type === 'radio') node.checked = String(node.value) === String(value);
          else if (node.type === 'checkbox') node.checked = Array.isArray(value) && value.map(String).includes(String(node.value));
          else node.value = value || '';
        });
      });
    }


    function renderQuestion(question) {
      const required = question.isRequired !== false;
      let html = '<div class="field" data-question-id="' + question.id + '"><label>' + escapeHtml(question.title) + (required ? ' *' : '') + '</label>';
      if (question.type === 'single' || question.type === 'multiple') {
        const type = question.type === 'single' ? 'radio' : 'checkbox';
        (question.options || []).forEach(function (option) {
          html += '<label class="choice"><input type="' + type + '" name="' + inputName(question) + '" value="' + escapeHtml(option.key) + '"><span>' + escapeHtml(cleanOptionLabel(option.label)) + '</span></label>';
        });
      } else {
        const tag = question.type === 'long_text' ? 'textarea' : 'input';
        html += tag === 'textarea' ? '<textarea name="' + inputName(question) + '"></textarea>' : '<input name="' + inputName(question) + '">';
      }
      return html + '</div>';
    }

    function renderStage() {
      const stage = stages[currentStage];
      const freeVersion = isFreeVersion();
      document.getElementById('identityPanel').classList.remove('hidden');
      document.getElementById('accessCodeField').classList.toggle('hidden', freeVersion);
      document.getElementById('clientAge').required = !freeVersion;
      document.getElementById('clientOccupation').required = !freeVersion;
      document.getElementById('bar').style.width = '100%';
      document.getElementById('questionPanel').innerHTML = '<div class="stage-title"><h2>' + escapeHtml(stage.title || '測驗題目') + '</h2><p>' + escapeHtml(stage.description || '') + '</p></div>' + stage.questions.map(renderQuestion).join('');
      restoreStageAnswers();
      document.getElementById('prevBtn').classList.add('hidden');
      document.getElementById('nextBtn').classList.add('hidden');
      document.getElementById('submitBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function validateStage() {
      const stage = stages[currentStage];
      for (const question of stage.questions) {
        if (question.isRequired === false) continue;
        const nodes = Array.from(document.querySelectorAll('[name="' + inputName(question) + '"]'));
        const filled = nodes.some(function (node) { return (node.type === 'radio' || node.type === 'checkbox') ? node.checked : node.value.trim(); });
        if (!filled) throw new Error('請填寫：「' + question.title + '」。');
      }
    }

    function collectAnswers() {
      saveCurrentStageAnswers();
      return Object.assign({}, savedAnswers);
    }

    document.getElementById('prevBtn').addEventListener('click', function () {
      if (currentStage > 0) {
        saveCurrentStageAnswers();
        currentStage -= 1;
        renderStage();
      }
    });
    document.getElementById('nextBtn').addEventListener('click', function () {
      try {
        validateStage();
        saveCurrentStageAnswers();
        currentStage += 1;
        renderStage();
      } catch (error) { alert(error.message); }
    });
    document.getElementById('quizForm').addEventListener('submit', function (event) {
      event.preventDefault();
      try { validateStage(); saveCurrentStageAnswers(); } catch (error) { alert(error.message); return; }
      const button = document.getElementById('submitBtn');
      button.disabled = true;
      button.textContent = '正在產生報告...';
      api('submitQuiz', {
        name: document.getElementById('clientName').value.trim(),
        email: document.getElementById('clientEmail').value.trim(),
        phone: document.getElementById('clientPhone').value.trim(),
        accessCode: document.getElementById('accessCode')?.value.trim() || '',
        answers: Object.assign(collectAnswers(), {
          _profile_age: document.getElementById('clientAge').value.trim(),
          _profile_occupation: document.getElementById('clientOccupation').value.trim()
        })
      }).then(function (res) {
        if (!res.success) {
          if (res.code === 'QUIZ_ALREADY_COMPLETED' && res.existingReportUrl) {
            const goReport = confirm((res.message || '這個 Email 已經完成過本次檢測。') + '\n\n要開啟原本的報告嗎？');
            if (goReport) { location.href = res.existingReportUrl; return; }
          }
          throw new Error(res.message || '送出失敗');
        }
        location.href = '/report?tenant=' + encodeURIComponent(tenant) + '&p=' + encodeURIComponent(projectCode) + '&qrid=' + encodeURIComponent(res.resultId);
      }).catch(function (error) {
        button.disabled = false;
        button.textContent = '送出檢測';
        alert(error.message || '送出失敗');
      });
    });

    function boot() {
      if (!tenant) { document.getElementById('loading').innerHTML = '<span class="error">安裝碼缺少 tenant。</span>'; return; }
      api('getQuizConfig', {}).then(function (res) {
        if (!res.success) throw new Error(res.message || '尚未設定測驗。');
        config = res;
        const displayTitle = res.version?.name || (String(res.versionCode || '').toUpperCase() === 'B' ? '人生秩序完整版' : (res.projectName || '檢測'));
        document.getElementById('title').textContent = displayTitle + '｜檢測測驗';
        document.title = displayTitle + '｜檢測測驗';
        document.getElementById('subtitle').textContent = res.resultSettings?.subtitle || '請依照目前狀況作答，完成後會產生檢測報告。';
        groupStages();
        if (!stages.length) throw new Error('此版本尚未建立題目。');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('quizForm').classList.remove('hidden');
        renderStage();
      }).catch(function (error) {
        document.getElementById('loading').innerHTML = '<span class="error">' + escapeHtml(error.message || '載入失敗') + '</span>';
      });
    }
    boot();
  </script>
</body>
</html>
