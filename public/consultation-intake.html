<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人生秩序完整實踐計畫｜諮詢前表單</title>
  <style>
    :root { font-family: Arial, "Noto Sans TC", sans-serif; color: #202124; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; }
    main { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 28px; box-shadow: 0 8px 30px rgba(60,64,67,.08); }
    h1 { color: #1a73e8; font-size: 25px; margin: 0 0 12px; }
    h2 { font-size: 19px; margin: 30px 0 18px; }
    p { line-height: 1.6; color: #5f6368; }
    .meta { border-bottom: 1px solid #dadce0; padding-bottom: 14px; }
    .field { margin: 0 0 23px; }
    .field > label { display: block; font-weight: 700; margin-bottom: 9px; line-height: 1.5; }
    textarea, input[type="text"] { width: 100%; border: 1px solid #bdc1c6; border-radius: 6px; padding: 12px; font: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    .choice { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; line-height: 1.4; }
    .choice input { margin-top: 2px; flex: none; }
    button { border: 0; border-radius: 6px; padding: 12px 22px; background: #1a73e8; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #b3261e; }
    a { color: #1a73e8; overflow-wrap: anywhere; }
    @media(max-width: 600px) { body { padding: 0; } main { border: 0; border-radius: 0; padding: 22px 18px; min-height: 100vh; } }
  </style>
</head>
<body>
  <main>
    <h1>諮詢前表單</h1>
    <div id="content"><p>正在載入預約資料…</p></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const tenant = params.get('tenant') || 'lifeorder';
    const token = params.get('token') || '';
    let questions = [];
    let booking = null;
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function request(action, payload) {
      return fetch('/api?action=' + encodeURIComponent(action) + '&tenant=' + encodeURIComponent(tenant), {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(response => response.json()).then(data => {
        if (!data.success) throw new Error(data.message || '操作失敗，請稍後再試。');
        return data;
      });
    }
    function appointmentHeader(data) {
      const date = new Date(data.startAt).toLocaleString('zh-TW', {
        timeZone: 'Asia/Taipei', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
      return '<div class="meta"><strong>' + escapeHtml(data.projectName) + '</strong><p>' +
        escapeHtml(data.clientName) + '｜' + escapeHtml(date) + '（台北時間）</p></div>';
    }
    function done(data) {
      document.getElementById('content').innerHTML = appointmentHeader(booking) +
        '<h2>表單已送出</h2><p>你的諮詢前資料已收到。</p>' +
        (data.meetLink ? '<p><a href="' + escapeHtml(data.meetLink) + '" target="_blank" rel="noopener noreferrer">開啟 Zoom 會議連結</a></p>' : '');
    }
    function render(data) {
      booking = data;
      if (data.submitted) return done(data);
      questions = data.questions || [];
      const fields = questions.map((q, index) => {
        const required = q.isRequired !== '否';
        const name = 'q_' + index;
        let control = '';
        if (['單選', '多選', '複選'].includes(q.type)) {
          const type = q.type === '單選' ? 'radio' : 'checkbox';
          control = (q.options || []).map(option => '<label class="choice"><input type="' + type +
            '" name="' + name + '" value="' + escapeHtml(option) + '"><span>' + escapeHtml(option) + '</span></label>').join('');
        } else {
          control = '<textarea id="' + name + '" name="' + name + '" ' + (required ? 'required' : '') + '></textarea>';
        }
        return '<div class="field"><label for="' + name + '">' + escapeHtml(q.title) +
          (required ? ' *' : '') + '</label>' + control + '</div>';
      }).join('');
      document.getElementById('content').innerHTML = appointmentHeader(data) +
        '<h2>請填寫諮詢前資料</h2><form id="intakeForm">' + fields +
        '<p id="error" class="error" role="alert"></p><button id="submitButton" type="submit">送出表單</button></form>';
      document.getElementById('intakeForm').addEventListener('submit', submit);
    }
    async function submit(event) {
      event.preventDefault();
      const values = {};
      const error = document.getElementById('error');
      for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const inputs = [...document.querySelectorAll('[name="q_' + i + '"]')];
        const value = q.type === '單選' ? (inputs.find(input => input.checked)?.value || '') :
          ['多選', '複選'].includes(q.type) ? inputs.filter(input => input.checked).map(input => input.value) :
            (inputs[0]?.value || '').trim();
        if (q.isRequired !== '否' && (!value || Array.isArray(value) && !value.length)) {
          error.textContent = '請填寫「' + q.title + '」。';
          inputs[0]?.focus();
          return;
        }
        values[q.rowId] = value;
      }
      const button = document.getElementById('submitButton');
      button.disabled = true;
      error.textContent = '';
      try { done(await request('submitConsultationIntake', { token, answers: values })); }
      catch (err) { error.textContent = err.message; button.disabled = false; }
    }
    request('getConsultationIntake', { token }).then(render).catch(err => {
      document.getElementById('content').innerHTML = '<p class="error">' + escapeHtml(err.message) + '</p>';
    });
  </script>
</body>
</html>
